l_russian:
 # ================================================================
 #  Модуль «Испанский пожар и Чёрный Интернационал»
 # ================================================================

 # --- Событие «Испанский пожар» (лето 1936) ---
 glp_spain.1.t:0 "ИСПАНСКИЙ ПОЖАР"
 glp_spain.1.d:0 "ГУЛЯЙ-ПОЛЕ. Из Барселоны приходят вести: поднялась Каталония, поднялись синдикаты, и над Иберией полыхает огонь, который, может быть, и есть наш огонь. «Набат» звонит по всем точкам: братья зовут. Части РПА уже говорят о дальнем походе — через моря и горы, навстречу революции."
 glp_spain.1.a:0 "Братья зовут! Всё для Каталонии!"
 glp_spain.1.b:0 "Поможем тайно"
 glp_spain.1.c:0 "Наши рубежи важнее"

 # --- Майские дни в Барселоне (май 1937) ---
 glp_barcelona.1.t:0 "МАЙСКИЕ ДНИ В БАРСЕЛОНЕ"
 glp_barcelona.1.d:0 "БАРСЕЛОНА. Фабричные митинги переросли в перестрелки, перестрелки — в уличные бои. На одной стороне — вольные синдикаты CNT-FAI, на другой — комиссары НКВД и агенты PCE. За кем останется победа — решится в эти дни. Наши связные ждут сигнала."
 glp_barcelona.1.a:0 "Чёрный Интернационал бьёт первым"
 glp_barcelona.1.b:0 "Действуем осторожно и скрытно"
 glp_barcelona.1.c:0 "Пусть решит фронт"
 glp_barcelona.1.w:0 "Наблюдаем из тени"

 # --- Новости: исход майских дней ---
 glp_barcelona.2.t:0 "ВЛАСТЬ СИНДИКАТОВ"
 glp_barcelona.2.d:0 "БАРСЕЛОНА. Спецгруппа КРО обезвредила агентов НКВД до того, как они успели сесть на поезд. Фабрики Каталонии и Арагона объявлены вольными, рабочая милиция патрулирует улицы, и над Барселоной впервые взвилось чёрное знамя свободы."
 glp_barcelona.2.a:0 "Свобода или смерть!"
 glp_barcelona.3.t:0 "СИЛЬНЕЕ СЛОВО — ПОЛКОВОЙ КОМИССАР"
 glp_barcelona.3.d:0 "БАРСЕЛОНА. Наши люди вывели агентуру из города раньше срока, но открытого восстания не произошло: аппарат компартии уцелел, а CNT-FAI получила лишь передышку. Связные доносят: борьба не окончена, но окно возможностей стремительно сужается."
 glp_barcelona.3.a:0 "Борьба продолжается"
 glp_barcelona.4.t:0 "ПОРЯДОК ЧУЖОЙ РУКОЙ"
 glp_barcelona.4.d:0 "МОСКВА. Без нашего вмешательства Барселона сдана: майские дни подавлены, вольные милиции разогнаны, а на улицах хозяйничают комиссары. Связи с Гуляйполем обрываются: махновские программы свёрнуты, и в свободной прессе о них больше не пишут."
 glp_barcelona.4.a:0 "Так сложилось..."
 glp_barcelona.5.t:0 "БАРСЕЛОНА УСПОКОИЛАСЬ"
 glp_barcelona.5.d:0 "БАРСЕЛОНА. Перестрелки стихли раньше, чем кто-либо успел ударить в набат. Фронт остался фронтом, а Барселона — городом, где снова торгуют на рынках. Но каждый понимает: вопрос о подлинной свободе отложен лишь на время."
 glp_barcelona.5.a:0 "Ждём развития событий"

 # --- Черноморско-Иберийский пакт ---
 glp_bi.1.t:0 "ЧЕРНОМОРСКО-ИБЕРИЙСКИЙ ПАКТ"
 glp_bi.1.d:0 "ГУЛЯЙ-ПОЛЕ. В нейтральных водах Чёрного моря подписан пакт: Вольная Территория и свободные синдикаты Иберии объединяют усилия. Чёрный Интернационал провозглашён: уголь Донбасса и хлеб степи — в обмен на каталонский вольфрам и продукцию синдикалистских мастерских. От Гуляйполя до Барселоны — единая артерия свободы."
 glp_bi.1.a:0 "Вольному воля!"

 # --- Название фракции ---
 GLP_black_international_faction:0 "Чёрный Интернационал"

 # --- Категория и решения «Испанский маршрут» ---
 GLP_spain_smuggling_routes:0 "Испанский маршрут"
 GLP_spain_black_sea_run:0 "Черноморский прорыв"
 GLP_spain_black_sea_run_desc:0 "Конвой с 1500 винтовок идёт через Босфор. Шанс прорыва — 65%. При перехвате Regia Marina конвой будет потерян, а Рим направит ноту протеста."
 GLP_spain_balkan_underground_traffic:0 "Балканский подпольный трафик"
 GLP_spain_balkan_underground_traffic_desc:0 "Скрытая доставка небольшими партиями на поездах через Румынию и Югославию. Шанс успеха — 85%."
 GLP_spain_french_syndicate_smuggling:0 "Французская синдикалистская контрабанда"
 GLP_spain_french_syndicate_smuggling_desc:0 "Груз переправляется через Пиренеи по собственным каналам синдикалистов Франции. Шанс успеха — 95%, укрепляет солидарность с французскими левыми."
 GLP_spain_send_kro_group:0 "Отправка специальной группы КРО"
 GLP_spain_send_kro_group_desc:0 "Группа Левы Задова направляется в Барселону: нейтрализация агентов НКВД и компартии до майских событий. Без этого шага анархистам не выстоять."
 GLP_spain_brigade_homecoming:0 "Возвращение бригады"
 GLP_spain_brigade_homecoming_desc:0 "Добровольцы бригады РПА возвращаются с Иберийского фронта. Белаш и Каретник получают черту «Испанская закалка»."
 GLP_spain_black_international_pact:0 "Черноморско-Иберийский пакт"
 GLP_spain_black_international_pact_desc:0 "Создание фракции «Чёрный Интернационал» с Испанией и взаимные экономические национальные духи. Доступно после успешных майских событий с 1938 года."

 # --- Национальные духи ---
 GLP_idea_spanish_brigade:0 "Добровольческая бригада РПА"
 GLP_idea_spanish_brigade_desc:0 "Подразделения РПА отправились на Иберийский фронт: добровольцы вступают охотнее, а опыт уличных боёв обогащает тактику наших полков."
 GLP_idea_nabat_disloyal:0 "«Набат» умолк"
 GLP_idea_nabat_disloyal_desc:0 "Сеть связных «Набат» разочарована отказом: слухи подменяют сведения, а доверие подорвано на 365 дней."
 GLP_idea_catalan_wolfram_syndicate_workshops:0 "Каталонский вольфрам и синдикалистские мастерские"
 GLP_idea_catalan_wolfram_syndicate_workshops_desc:0 "Вольфрам Пиренеев и мастерские Барселоны идут на укрепление обороны: военные заводы работают быстрее, а исследования продвигаются успешнее."
 GLP_idea_ukrainian_coal_and_grain:0 "Вольный степной уголь и хлеб"
 GLP_idea_ukrainian_coal_and_grain_desc:0 "Уголь Донбасса и хлеб степи направляются в Иберию: промышленное строительство ускоряется, укрепляя союз рабочих и крестьян."

 # --- Черты командиров ---
 GLP_spanish_tempering:0 "Испанская закалка"
 GLP_spanish_tempering_desc:0 "Ветеран Иберийского фронта: опыт уличных боёв, рейды конницы через горные перевалы, высокая организация и разведка."

 # --- Модификаторы отношений ---
 GLP_italian_protest_note:0 "Нота протеста (перехват конвоя)"
 GLP_french_syndicalist_warmth:0 "Французские синдикалисты сопровождают наш груз"
 GLP_spanish_syndicate_alliance:0 "Вольная Испания синдикатов"
 GLP_spanish_soviet_cold:0 "Просоветская Барселона"
 GLP_soviet_anarchy_resentment:0 "Недовольство анархистским вмешательством"

 GLP_black_international_actions:0 "Чёрный Интернационал"
 GLP_black_international_actions_desc:0 "Координация всемирного освободительного движения, взаимная синдикальная помощь и экспорт анархистских идеалов."
 GLP_bi_mutual_aid_initiative:0 "Синдикальная взаимопомощь"
 GLP_bi_mutual_aid_initiative_desc:0 "Организация прямого безвалютного товарообмена и взаимной поддержки предприятий между всеми вольными территориями альянса."
 GLP_bi_international_brigades:0 "Интернациональные Чёрные Бригады"
 GLP_bi_international_brigades_desc:0 "Призыв сотен добровольцев, революционных эмигрантов и синдикалистов со всего мира под знамёна Повстанческой Армии."
 GLP_bi_support_french_underground:0 "Связь с французским синдикалистским подпольем"
 GLP_bi_support_french_underground_desc:0 "Оказание материальной и агитационной поддержки забастовочным комитетам и союзам во Франции."
 GLP_bi_balkan_solidarity:0 "Балканский комитет вольных общин"
 GLP_bi_balkan_solidarity_desc:0 "Установление прочных связей с крестьянскими и рабочими коммунами Румынии, Болгарии и Югославии."

 GLP_idea_bi_mutual_aid:0 "Синдикальная взаимопомощь"
 GLP_idea_bi_mutual_aid_partner:0 "Солидарность Чёрного Интернационала"

 glp_bi.2.t:0 "Волна стачек во Франции"
 glp_bi.2.d:0 "При тайной координации и поддержке Чёрного Интернационала на заводах Парижа, Марселя и Лиона вспыхнули массовые забастовки под чёрно-красными флагами. Рабочие требуют рабочего контроля и прекращения империалистической политики."
 glp_bi.2.a:0 "Пойти на уступки бастующим синдикатам"
 glp_bi.2.b:0 "Попытаться подавить волнения силой жандармерии"

 glp_bi.3.t:0 "Посланцы Балканских коммун"
 glp_bi.3.d:0 "В Гуляйполе прибыла делегация представителей подпольных крестьянских союзов и рабочих кружков из Софии и Бухареста. Они привезли вести о растущей солидарности с Батькой и готовности сотен бойцов пополнить ряды Черной Гвардии."
 glp_bi.3.a:0 "Добро пожаловать в Вольную Степь, братья!"

 glp_bi.4.t:0 "Беглецы из РККА: Тревога на границе"
 glp_bi.4.d:0 "В расположение передовых махновских разъездов вышли группы советских командиров и красноармейцев, спасающихся от чисток Тухачевского и Якира. Они передают ценные оперативные карты и просят защиты у Революционной Повстанческой Армии."
 glp_bi.4.a:0 "Принять честных бойцов в ряды РПА и усилить оборону"
 glp_bi.4.b:0 "Избегать конфликта с Москвой: разоружить и отправить в тыловые коммуны"
 GLP_bi_proclaim_federation:0 "Провозглашение Чёрного Интернационала"
 GLP_bi_proclaim_federation_desc:0 "Официальное объединение всех революционных коммун, свободных профсоюзов и анархистских сил в единый антиавторитарный альянс. «Живи свободно или умри в борьбе за волю!» — Батька Махно."
 GLP_bi_send_tachanka_instructors:0 "Отправка тачаночных инструкторов"
 GLP_bi_send_tachanka_instructors_desc:0 "Направление ветеранов конных рейдов и пулемётных мастеров для обучения союзных добровольческих формирований искусству манёвренной степной войны."
 GLP_bi_spanish_axis:0 "Иберийский плацдарм: Ось Гуляйполе — Барселона"
 GLP_bi_spanish_axis_desc:0 "Закрепление нерушимого союза с CNT-FAI и Вольной Каталонией: прямой морской мост взаимопомощи через всё Средиземноморье."
 GLP_bi_latin_american_echo:0 "Трансатлантический маршрут: FORA и мексиканские синдикалисты"
 GLP_bi_latin_american_echo_desc:0 "Установление трансокеанских связей с аргентинской рабочей федерацией FORA и синдикалистами Мексики для взаимной солидарности и торговли."
 GLP_bi_strike_funds:0 "Финансирование зарубежных стачечных комитетов"
 GLP_bi_strike_funds_desc:0 "Материальная поддержка бастующих рабочих и крестьянских союзов за рубежом: распространение идеалов безвластия и подрыв тылов империалистов."
 GLP_bi_renounce_indemnities:0 "Акт об отказе от империалистических контрибуций"
 GLP_bi_renounce_indemnities_desc:0 "Торжественный манифест Вольной Территории: отказ от всяких колониальных захватов, репараций и признание права каждого народа на самоуправление. «Не государство освобождает народ, а народ освобождает себя сам» — Всеволод Волин."

 glp_bi.4.c:0 "Задействовать КРО Задова: перехватить архивы ГПУ и раскинуть сеть агентов"

 glp_bi.5.t:0 "Ультиматум Москвы: Требование выдачи комдивов"
 glp_bi.5.d:0 "Из Кремля поступила экстренная депеша за подписью Сталина. Москва объявляет бежавших в Гуляйполе командиров «троцкистскими диверсантами и заговорщиками», требуя их немедленной выдачи чекистам под угрозой суровых последствий."
 glp_bi.5.a:0 "Степь предателей не знает и беглецов не выдаёт! К оружию!"
 glp_bi.5.b:0 "Тайная операция Задова: инсценировать их гибель и переправить в Испанию"

 glp_bi.6.t:0 "Трансатлантическое братство: Голоса Буэнос-Айреса и Мексики"
 glp_bi.6.d:0 "В порты Черноморья прибыли торговые суда с грузом каучука, меди и посланиями от аргентинской федерации FORA и мексиканских анархо-синдикалистов. Латинская Америка рукоплещет восстанию в Гуляйполе!"
 glp_bi.6.a:0 "Да здравствует всемирное братство вольного труда!"

 glp_bi.7.t:0 "Балканское эхо: Крестьянские восстания"
 glp_bi.7.d:0 "Под влиянием агитационных брошюр Чёрного Интернационала крестьяне Румынии, Болгарии и Югославии поднимают бунты против землевладельцев и монархий, требуя земли и вольных советов."
 glp_bi.7.a:0 "Балканы сбрасывают ярмо деспотизма!"

 glp_sea.3.t:0 "Инцидент в Чёрном море: Защита крымских рыбаков"
 glp_sea.3.d:0 "Иностранные пограничные катера попытались задержать караван крымских рыболовецких артелей и баржи с зерном, направлявшиеся в нейтральные воды. Вольный флот обязан дать ответ."
 glp_sea.3.a:0 "Катерам Черноморской флотилии — открыть предупредительный огонь!"
 glp_sea.3.b:0 "Разрешить спор дипломатическим демаршем через синдикаты"

 GLP_idea_bi_mutual_aid_desc:0 "Прямая координация производственных синдикатов внутри Чёрного Интернационала без посредников и капиталистических наценок."
 GLP_idea_bi_mutual_aid_partner_desc:0 "Экономическая солидарность и снабжение сырьём со стороны Вольной Территории Гуляйполя."
