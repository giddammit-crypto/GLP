l_russian:
 GLP_black_guard_legacy:0 "§WНаследие Черной Гвардии§!"
 GLP_black_guard_legacy_desc:0 "§WЧерная гвардия помнит и Перегоновку, и Крымский поход: на своей земле повстанец дерется за троих и в окоп садится крепко. Зато обоз у нас мужицкий — за чужими межами армия быстро остается без хлеба и патронов.§!"
 GLP_free_syndicates_and_soviets:0 "§WВольные Синдикаты и Советы§!"
 GLP_free_syndicates_and_soviets_desc:0 "§WНи казенной палаты, ни хозяина: завод ведет фабричный комитет, село — вольный сход, а спор решает не начальство, а соседи. Работа спорится, и лишняго чиновника кормить не приходится.§!"
 GLP_hostile_encirclement:0 "§WВраждебное окружение§!"
 GLP_hostile_encirclement_desc:0 "§WКругом нас — то белый, то красный, то пан, и все сулят нам порядок на своем штыке. Народ от такого сулёнаго порядка только злее: чужому агитатору у нас веры нет, а гарнизону — подмога от всякаго двора.§!"

