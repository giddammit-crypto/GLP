l_russian:
 glp_spain2.1.t: "§WПервый контакт с колонной Дуррути§!"
 glp_spain2.1.d: "§WПосланники Буэнавентуры Дуррути прибыли в Гуляйполе с вестями о борьбе НКТ-ФАИ в Испании. Они просят прислать опытных военных советников из нашей Черной гвардии.§!"
 glp_spain2.1.a: "Отправить наших лучших командиров в Арагон!"
 glp_spain2.1.b: "Мы можем предложить лишь символическую солидарность."
 glp_spain2.2.t: "§WБуэнавентура Дуррути: Лев Арагона§!"
 glp_spain2.2.d: "§WДуррути проявил себя как харизматичный и непреклонный лидер. Его философия тесно переплетается с нашими махновскими принципами. Более тесные связи с его колонной могут стать основой для истинного §WЧерного Интернационала§!.§!"
 glp_spain2.2.a: "Принять видение Дуррути. Мы стоим вместе!"
 glp_spain2.2.b: "Мы будем поддерживать дружеские, но независимые отношения."
 glp_spain2.3.t: "§WСмерть Дуррути§!"
 glp_spain2.3.d: "§WТрагические новости из Мадрида: Буэнавентура Дуррути пал на фронте в Университетском городке. Вокруг обстоятельств его смерти ходят слухи, многие подозревают причастность НКВД.§!"
 glp_spain2.3.a: "Мы должны расследовать это убийство!"
 glp_spain2.3.b: "Тяжелый удар по революции. Оплакать его."
 glp_spain2.3.c: "Немедленно отправить оружие, чтобы отомстить за него!"
 glp_spain2.4.t: "§WАрагонский коллектив§!"
 glp_spain2.4.d: "§WОтчеты из Арагона подробно описывают успешную коллективизацию сельского хозяйства и промышленности силами НКТ-ФАИ, демонстрируя жизнеспособность анархистской экономики.§!"
 glp_spain2.4.a: "Вдохновляющий пример для всех нас."
 glp_spain2.5.t: "§WЧерноморский рейс: Успех§!"
 glp_spain2.5.d: "§WНаша тайная партия оружия успешно прорвала блокаду и достигла испанских анархистов.§!"
 glp_spain2.5.a: "Отличные новости."
 glp_spain2.6.t: "§WЧерноморский рейс: Перехват§!"
 glp_spain2.6.d: "§WКатастрофа! Итальянские военно-морские патрули перехватили наше замаскированное грузовое судно с оружием для Испании.§!"
 glp_spain2.6.a: "Фашисты заплатят за это."
 glp_spain2.7.t: "§WБалканское подполье: Подозрения Румынии§!"
 glp_spain2.7.d: "§WРумынские власти с подозрением относятся к внезапному увеличению транзита 'сельскохозяйственной техники' через их территорию.§!"
 glp_spain2.7.a: "Подкупить пограничников."
 glp_spain2.7.b: "Изменить маршрут на менее охраняемый."
 glp_spain2.8.t: "§WСолидарность французских синдикалистов§!"
 glp_spain2.8.d: "§WФранцузская ВКТ согласилась закрыть глаза на наши контрабандные операции через Пиренеи, проявив истинную синдикалистскую солидарность.§!"
 glp_spain2.8.a: "Да здравствует революция!"
 glp_spain2.9.t: "§WЗагнанный лидер: Андрес Нин§!"
 glp_spain2.9.d: "§WАндрес Нин, лидер ПОУМ, преследуется агентами Сталина в Испании. У нас есть короткое окно, чтобы задействовать оперативников КРО для его спасения.§!"
 glp_spain2.9.a: "Отправить КРО! Мы должны спасти его."
 glp_spain2.9.b: "Это слишком рискованно. Мы не можем вмешиваться."
 glp_spain2.10.t: "§WНин спасен!§!"
 glp_spain2.10.d: "§WВ ходе дерзкой операции нашим агентам удалось тайно вывезти Андреса Нина из Испании. Он прибыл в Гуляйполе в качестве политического беженца.§!"
 glp_spain2.10.a: "Добро пожаловать, товарищ Нин."
 glp_spain2.11.t: "§WСудьба Нина§!"
 glp_spain2.11.d: "§WБез нашего вмешательства Андрес Нин был арестован советскими агентами и жестоко убит. Его смерть - мрачное предупреждение всем антисталинистским левым силам.§!"
 glp_spain2.11.a: "Трагическая потеря для революции."
 glp_spain2.12.t: "§WАнархистская Испания консолидируется§!"
 glp_spain2.12.d: "§WНКТ-ФАИ укрепила свой контроль над анархистскими территориями и предложила создать единый фронт.§!"
 glp_spain2.12.a: "Мы присоединимся к ним!"
 glp_spain2.12.b: "Пока мы будем наблюдать."
 glp_spain2.13.t: "§WСоветский раскол§!"
 glp_spain2.13.d: "§WМосква открыто осудила нашу поддержку испанских анархистов, назвав нас 'махновскими вредителями' и саботажниками республиканского дела.§!"
 glp_spain2.13.a: "Пусть кричат."
 glp_spain2.14.t: "§WЭмма Гольдман в Гуляйполе§!"
 glp_spain2.14.d: "§WИзвестная анархистка Эмма Гольдман прибыла в Гуляйполе, привлекая международное внимание к нашему делу и борьбе в Испании.§!"
 glp_spain2.14.a: "Знаменательное событие."
 glp_spain2.15.t: "§WКонгресс Черного Интернационала§!"
 glp_spain2.15.d: "§WДелегаты из Гуляйполя, Анархистской Испании и французской ВКТ собрались, чтобы официально оформить Черный Интернационал.§!"
 glp_spain2.15.a: "Новая эра глобальной солидарности!"
 glp_spain2.16.t: "§WФранко у ворот§!"
 glp_spain2.16.d: "§WРеспубликанские силы рушатся. Фашистские войска приближаются к последним оплотам.§!"
 glp_spain2.16.a: "Отправить всё, что у нас есть, чтобы удержать линию!"
 glp_spain2.16.b: "Готовиться к приему беженцев..."
 glp_spain2.17.t: "§WИспанские беженцы в Гуляйполе§!"
 glp_spain2.17.d: "§WС падением Испании тысячи кадров НКТ-ФАИ и закаленных в боях ветеранов искали убежища на нашей территории.§!"
 glp_spain2.17.a: "Их опыт усилит нашу Черную гвардию."
 glp_spain2.18.t: "§WУроки Иберии§!"
 glp_spain2.18.d: "§WГражданская война в Испании закончилась, оставив нам глубокие уроки о международной солидарности, предательстве и цене свободы.§!"
 glp_spain2.18.a: "Мы не забудем."