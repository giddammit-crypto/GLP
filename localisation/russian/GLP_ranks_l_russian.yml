l_russian:
 # Исторически у махновцев не было воинских званий: старшие командиры
 # так и назывались — «командир». Ванильные служебные слова движка для
 # командующих переопределены: в подсказках все командиры (наши и чужие)
 # отображаются одинаково — «Командир».
 GENERAL:0 "Командир"
 FIELD_MARSHAL:0 "Командир"
 ADMIRAL:0 "Командир"
