 GLP_GATHERING_STORM_DESC:0 "Gulyaipole, winter of 1936.\n\nFor seventeen years the free steppe has lived without landlords, capitalists, or party commissars. Between the Dnieper and the Don stretches a federation of free soviets and peasant communes under the protection of Nestor Makhno's Revolutionary Insurgent Army.\n\nStorm clouds are gathering: Moscow, Berlin, and Warsaw eye our grain steppes and Donbas factories. But the Black Guard is ready for battle: land to the peasants, factories to the workers, and freedom to all!"
