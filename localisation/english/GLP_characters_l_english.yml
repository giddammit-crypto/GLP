 # Country Leader Traits
 batko_makhno:0 "Batko Makhno"
 batko_makhno_desc:0 "The undisputed leader of the insurgent movement who forged peasants, workers, and cavalrymen into an invincible army of liberty. A genius of guerrilla warfare who inspires terror in enemies and boundless devotion in comrades."

 # General / Field Marshal Traits (unit leader traits, /common/unit_leader/)
 GLP_tachanka_commander:0 "§WTachanka Commander§!"
 GLP_tachanka_commander_desc:0 "§WMaster of machine-gun cart tactics, turning the open steppe into a lethal killing ground for the enemy.§!"
 GLP_guerilla_master:0 "§WGuerrilla Master§!"
 GLP_guerilla_master_desc:0 "§WA legend of irregular warfare who transforms every village and ravine into an impregnable fortress.§!"
 GLP_steppe_raider:0 "§WSteppe Raider§!"
 GLP_steppe_raider_desc:0 "§WA commander of deep mounted raids whose columns advance where staff maps show nothing at all.§!"

 # Country Leader Traits (continued)
 GLP_inspirational_leader:0 "§WInspirational Leader§!"
 GLP_inspirational_leader_desc:0 "§WBatko speaks the peasant's own language, and whole villages harness their carts to follow the black banner.§!"
 GLP_panic:0 "§WPanic§!"
 GLP_panic_desc:0 "§WMakhno's lightning decisions terrify the enemy, but the army's feverish dashes erode order in the rear.§!"

 # Political Advisor Traits
 anarchist_organizer:0 "Free Communes Organizer"
 anarchist_organizer_desc:0 "A gifted administrator who organizes economic life without state coercion through voluntary cooperation."
 GLP_operational_planner:0 "§WChief of Staff: Operational Planner§!"
 GLP_operational_planner_desc:0 "§WThe movement's chief tactician and cartographer, whose staff work turns peasant detachments into a manageable army.§!"
 GLP_head_of_intelligence:0 "§WHead of Intelligence: Silent Workhorse§!"
 GLP_head_of_intelligence_desc:0 "§WThe Counter-Intelligence Department works without noise or publicity, yet knows more about the enemy than his own staff does.§!"
 counter_intelligence_expert:0 "Counter-Intelligence Expert"
 counter_intelligence_expert_desc:0 "A legendary spymaster and head of army intelligence whose agent network penetrates deep behind enemy lines."
 free_soviets_minister:0 "Minister of Education: Free Soviets"
 free_soviets_minister_desc:0 "An inspiring anarcho-communist propagandist whose fiery speeches strengthen the people's spirit and accelerate the building of a free society."
 GLP_soviet_military_mission:0 "§WSoviet Military Mission§!"
 GLP_german_military_mission:0 "§WGerman Military Mission§!"
 GLP_british_naval_mission:0 "§WBritish Naval Mission§!"
 GLP_soviet_mission_advisor:0 "§WSoviet Military Mission§!"
 GLP_german_mission_advisor:0 "§WGerman Military Mission§!"
 GLP_british_naval_advisor:0 "§WBritish Naval Mission§!"
 GLP_soviet_mission_doctrine:0 "§WDeep Battle Doctrine§!"
 GLP_soviet_mission_doctrine_desc:0 "§WRed commanders share deep-operations know-how with the RIA: cheaper doctrine, faster planning.§!"
 GLP_german_mission_drill:0 "§WPrussian Drill§!"
 GLP_german_mission_drill_desc:0 "§WReichswehr instructors drill the insurgent regiments: breakthrough and offensive power grow.§!"
 GLP_british_naval_drill:0 "§WRoyal Naval Drill§!"
 GLP_british_naval_drill_desc:0 "§WBritish officers run the Black Sea fleet service: cheaper naval doctrine, better coordination.§!"
 GLP_bogdan_dybets:0 "§WBohdan Dybets§!"
 GLP_bogdan_dybets_desc:0 "§WAn old Gulyaypole commander from the first soviet days. Batko's opponent at the peasant assembly, yet a reliable infantry organiser within the Insurgent Army.§!"
 GLP_aleksey_dybets:0 "§WOleksiy Dybets§!"
 GLP_aleksey_dybets_desc:0 "§WA young cavalry commander from the numerous Dybets family. Fast in the raid, swift in manoeuvre — he stakes everything on lightning strikes into enemy rear areas.§!"
 GLP_feodosiy_kozhin:0 "§WFeodosiy Kozhin§!"
 GLP_feodosiy_kozhin_desc:0 "§WA steppe commander of the old school, a peasant anarchist. Harsh to the enemy and to his men alike, a master of ambush in the Black Sea gullies.§!"

 GLP_trofim_vdovychenko:0 "§WTrofim Vdovychenko§!"
 GLP_trofim_vdovychenko_desc:0 "§WA peasant anarchist from Novospasovka and commander of the Azov group. Beloved across the whole Priazovye for his iron discipline and for forging scattered detachments into a single fighting force.§!"
 GLP_aleksey_marchenko:0 "§WAleksey Marchenko§!"
 GLP_aleksey_marchenko_desc:0 "§WCommander of the Makhnovist cavalry. His mounted columns broke out of the Crimean encirclement through Perekop and rode night and day to rejoin Batko — the finest sabre of the free steppe.§!"
 GLP_platon_petrenko:0 "§WPlaton Petrenko§!"
 GLP_platon_petrenko_desc:0 "§WCommander of the Crimean corps. It was his men who forded the rotting Sivash and stormed the Perekop fortifications, opening the way into Crimea.§!"
 GLP_vasily_kurylenko:0 "§WVasily Kurylenko§!"
 GLP_vasily_kurylenko_desc:0 "§WA young commander of the Novospasovka group and hero of the liberation of Mariupol. Daring to the point of recklessness, his raids made an entire regiment measure itself by his courage.§!"
 GLP_petr_gavrilenko:0 "§WPetr Gavrilenko§!"
 GLP_petr_gavrilenko_desc:0 "§WChief of the field staff of the Crimean group. A quiet, precise staff officer whose maps and timetables turn the insurgents' daring into a single calculated blow.§!"

 GLP_nikolai_skoblin:0 "§WNikolai Skoblin§!"
 GLP_nikolai_skoblin_desc:0 "§WA former White cavalry general in exile. A pragmatic ally of Batko — and a standing source of distrust in the staff.§!"
 GLP_anton_turkul:0 "§WAnton Turkul§!"
 GLP_anton_turkul_desc:0 "§WAn infantry general of the Volunteer Army, blunt and hard. His brigades fight like Civil War veterans.§!"
 GLP_grigory_semyonov:0 "§WGrigory Semyonov§!"
 GLP_grigory_semyonov_desc:0 "§WA Cossack ataman in exile. A steppe commander of the old imperial school who settles matters with a sabre and a raid.§!"
 GLP_white_emigre:0 "§WWhite Emigre§!"
 GLP_white_emigre_desc:0 "§WAn officer of the old army: better drill, higher supply cost, and a political price for the alliance.§!"
 GLP_white_emigre_favored:0 "§WStaff Confidence§!"
 GLP_white_emigre_favored_desc:0 "§WBatko backed the White commanders — their field authority grew, the communes mutter.§!"
 GLP_white_emigre_sidelined:0 "§WWatched by Makhnovists§!"
 GLP_white_emigre_sidelined_desc:0 "§WThe emigres have been clipped. The staff is calmer; the blow is weaker.§!"

 # ---------------- Oleg Potemkin (Ataman, RPA corps commander) ----------------
 GLP_oleg_potemkin:0 "§WOleg Potemkin§!"
 GLP_potemkin_infantry_master:0 "§WMaster of Infantry Battles§!"
 GLP_potemkin_infantry_master_desc:0 "§WThe Free Territory's most hardened infantryman: his battalions strike head-on, hold ground to the last, and break out of encirclements through the enemy's center.§!"
 GLP_potemkin_black_fidele:0 "§WFidele of the Ataman§!"
 GLP_potemkin_black_fidele_desc:0 "§WThe Ataman Makhno's foremost devotee: his loyalty keeps the formation in the line where others no longer have the strength.§!"
 # ---------------- Ivan Lepetchenko (RPA field commander) ----------------
 GLP_ivan_lepetchenko:0 "§WIvan Lepetchenko§!"
