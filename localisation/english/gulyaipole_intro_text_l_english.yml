 GULYAIPOLE_EPIC_INTRO_TEXT:0 "In real history, this man was supposed to burn out from tuberculosis in damp Parisian exile back in 1934, leaving behind only bitter memories of unfulfilled hopes, broken tachankas and yellowed pages of memoirs. His Free Republic in southern Ukraine was wiped off the face of the earth by the millstones of fratricidal slaughter, finding no place for itself in a world of harsh totalitarian empires.\n\nBut history is not a straight road. It is a steppe where the wind can change direction in an instant.\n\nIt is 1936.\n\nIn Gulyaypole, black banners once again flutter in the cold autumn wind. Nestor Ivanovich Makhno, having survived his own death sentence, with a stubborn gleam in his eyes, looks at maps of Europe engulfed in crisis. The Free Anarchist Republic has risen from the ashes of the civil war, surrounded on all sides by hostile giants. From the north looms the industrial moloch of Stalin's USSR, eager to correct the mistakes of the past. From the west and south crawl the shadows of fascist and militarist regimes, while former White Guards in exile sharpen their sabres in anticipation of revenge.\n\nThe world is rapidly sliding towards a new, even more terrible Second World War. And in this cauldron, a tiny but unyielding republic must make a choice that will shake the foundations of the global order.\n\nWhat awaits Gulyaypole? Which road will Batko and his comrades choose?\n\n§Y• Alliance with the pragmatic devil:§! Join Germany, trying to play on the contradictions of the great powers for the survival of the young free commune.\n\n§Y• Red revenge:§! Make a temporary, bitterly ironic compromise with Moscow, directing combined power against advancing fascism.\n\n§Y• Western vector:§! Turn to the democracies of England and France for support, trying to prove anarchy's right to exist.\n\n§Y• Or — 'Volnomu Volya'?§! Cast aside all geopolitical calculations, proudly declare war on both poles of the old world and throw out a call across the globe. Summon under black banners volunteers from all corners of the planet — former White officers, disillusioned socialists, free artists, workers and anarchists.\n\nPeasant tachankas roll out again onto the expanses of the Wild Field. Maxim machine guns are repaired, and black papakhas are pulled low over brows.\n\nThe world sinks into darkness, but in the very heart of the steppe burns a fire that no one can extinguish. Lead Gulyaypole to freedom — or perish with it."
 GULYAIPOLE_START_BUTTON:0 "Volnomu Volya!"
 GULYAIPOLE_INTRO_TITLE:0 "Gulyaypole: Free Territory"
 GULYAIPOLE_INTRO_SUBTITLE:0 "Anarchy is the mother of order — 1936"
