l_english:
 glp_spain2.1.t: "First Contact with the Durruti Column"
 glp_spain2.1.d: "Envoys from Buenaventura Durruti have arrived in Gulyaypole, bringing news of the CNT-FAI's struggle in Spain. They request experienced military advisors from our Black Guard to help organize their militia columns."
 glp_spain2.1.a: "Send our best commanders to Aragon!"
 glp_spain2.1.b: "We can only offer our symbolic solidarity."
 glp_spain2.2.t: "Buenaventura Durruti: The Lion of Aragon"
 glp_spain2.2.d: "Durruti has proven to be a charismatic and unyielding leader. His philosophy closely aligns with our own Makhnovist principles. Closer ties with his column could form the basis of a true §WBlack International§!."
 glp_spain2.2.a: "Embrace Durruti's vision. We stand together!"
 glp_spain2.2.b: "We shall maintain friendly but independent relations."
 glp_spain2.3.t: "The Death of Durruti"
 glp_spain2.3.d: "Tragic news from Madrid: Buenaventura Durruti has fallen at the University City front. Rumors swirl about the circumstances of his death, with many suspecting NKVD involvement."
 glp_spain2.3.a: "We must investigate this assassination!"
 glp_spain2.3.b: "A heavy blow to the revolution. Mourn him."
 glp_spain2.3.c: "Send arms to avenge him immediately!"
 glp_spain2.4.t: "The Aragon Collective"
 glp_spain2.4.d: "Reports from Aragon detail the successful collectivization of agriculture and industry by the CNT-FAI, demonstrating the viability of anarchist economics."
 glp_spain2.4.a: "An inspiring example for us all."
 glp_spain2.5.t: "The Black Sea Run: Success"
 glp_spain2.5.d: "Our covert weapons shipment has successfully breached the blockade and reached the Spanish anarchists."
 glp_spain2.5.a: "Excellent news."
 glp_spain2.6.t: "The Black Sea Run: Intercepted"
 glp_spain2.6.d: "Disaster! Italian naval patrols have intercepted our disguised freighter carrying weapons to Spain."
 glp_spain2.6.a: "The fascists will pay for this."
 glp_spain2.7.t: "Balkan Underground: Romanian Suspicion"
 glp_spain2.7.d: "Romanian authorities are growing suspicious of the sudden increase in 'agricultural machinery' transit through their territory."
 glp_spain2.7.a: "Bribe the border guards."
 glp_spain2.7.b: "Reroute through less watched paths."
 glp_spain2.8.t: "French Syndicalist Solidarity"
 glp_spain2.8.d: "The French CGT has agreed to turn a blind eye to our smuggling operations across the Pyrenees, showing true syndicalist solidarity."
 glp_spain2.8.a: "Vive la révolution!"
 glp_spain2.9.t: "The Hunted Leader: Andrés Nin"
 glp_spain2.9.d: "Andrés Nin, leader of the POUM, is being hunted by Stalin's agents in Spain. We have a brief window to deploy our KRO operatives to extract him."
 glp_spain2.9.a: "Send the KRO! We must save him."
 glp_spain2.9.b: "It is too risky. We cannot intervene."
 glp_spain2.10.t: "Nin Saved!"
 glp_spain2.10.d: "In a daring operation, our agents have successfully smuggled Andrés Nin out of Spain. He has arrived in Gulyaypole as a political refugee."
 glp_spain2.10.a: "Welcome, comrade Nin."
 glp_spain2.11.t: "Nin's Fate"
 glp_spain2.11.d: "Without our intervention, Andrés Nin was arrested by Soviet agents and brutally murdered. His death is a grim warning to anti-Stalinist leftists everywhere."
 glp_spain2.11.a: "A tragic loss for the revolution."
 glp_spain2.12.t: "Anarchist Spain Consolidates"
 glp_spain2.12.d: "The CNT-FAI has solidified its control over anarchist territories and proposed forming a united front."
 glp_spain2.12.a: "We shall join them!"
 glp_spain2.12.b: "We will observe for now."
 glp_spain2.13.t: "The Soviet Rift"
 glp_spain2.13.d: "Moscow has openly denounced our support for the Spanish anarchists, labeling us as 'Makhnovist wreckers' and saboteurs of the Republican cause."
 glp_spain2.13.a: "Let them scream."
 glp_spain2.14.t: "Emma Goldman in Gulyaypole"
 glp_spain2.14.d: "The renowned anarchist Emma Goldman has arrived in Gulyaypole, drawing international attention to our cause and the struggle in Spain."
 glp_spain2.14.a: "A momentous occasion."
 glp_spain2.15.t: "The Black International Congress"
 glp_spain2.15.d: "Delegates from Gulyaypole, Anarchist Spain, and the French CGT have gathered to formalize the Black International."
 glp_spain2.15.a: "A new era of global solidarity!"
 glp_spain2.16.t: "Franco at the Gates"
 glp_spain2.16.d: "The Republican forces are crumbling. Fascist troops are closing in on the final strongholds."
 glp_spain2.16.a: "Send everything we have to hold the line!"
 glp_spain2.16.b: "Prepare to receive refugees..."
 glp_spain2.17.t: "Spanish Refugees in Gulyaypole"
 glp_spain2.17.d: "With the fall of Spain, thousands of CNT-FAI cadres and battle-hardened veterans have sought refuge in our territory."
 glp_spain2.17.a: "Their experience will strengthen our Black Guard."
 glp_spain2.18.t: "The Lessons of Iberia"
 glp_spain2.18.d: "The Spanish Civil War has ended, leaving us with profound lessons about international solidarity, betrayal, and the cost of freedom."
 glp_spain2.18.a: "We will not forget."
