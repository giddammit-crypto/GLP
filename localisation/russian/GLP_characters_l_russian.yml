 # Черты новых министров
 GLP_chronicler_of_revolution:0 "Министр печати: летописец революции"
 GLP_chronicler_of_revolution_desc:0 "Редактор «Голоса Воли» и хранитель памяти движения: его страстные передовицы держат волю народа твёрже любых декретов."
 GLP_black_atamansha:0 "Министр революционной обороны: чёрная атаманша"
 GLP_black_atamansha_desc:0 "Маруся не признаёт ни фронта, ни тыла: её вольные дружины поднимают сёла в ружьё быстрее, чем штаб успевает напечатать приказ. Но там, где она проходит, порядка не жди."
 GLP_syndicalist_organizer:0 "Министр труда: организатор синдикатов"
 GLP_syndicalist_organizer_desc:0 "Фабричные комитеты Екатеринослава верят Барону как своему: станки крутятся без надсмотрщиков, а нормы выработки растут добровольно."
 GLP_partisan_theorist:0 "Военный теоретик: теория партизанской войны"
 GLP_partisan_theorist_desc:0 "Бывший штабс-капитан свёл опыт тысячи рейдов в единую доктрину: удар из ниоткуда, окоп за ночь, отход в степь до рассвета."

 # Черты претендентов «Чёрной рады»
 GLP_left_sr_conspirator:0 "Твёрдая рука вольницы"
 GLP_left_sr_conspirator_desc:0 "Попов строит из вольницы дисциплинированную силу: штаб работает как часы, но коммуны глухо ропщут — не для того гнали комиссаров, чтобы завести своих."
 GLP_patriarch_of_anarchism:0 "Патриарх анархизма"
 GLP_patriarch_of_anarchism_desc:0 "Старый учитель, приведший юного Махно в движение. Его слово мирит атаманов и коммуны, но воевать сталью старик уже не рвётся."
