l_english:
 # News Events
 glp_news.1.t:0 "§WREBIRTH OF FREE GULYAYPOLE§!"
 glp_news.1.d:0 "§WGULYAYPOLE. Across the Black Sea steppes and the industrial giants of Donbass, the Free Territory has resumed activity under Batko Makhno and the Revolutionary Insurgent Army (RIA). Free peasant communes and factory committees have taken control, proclaiming a stateless society ready to defend freedom by force of arms.§!"
 glp_news.1.a:0 "Liberty or Death! Anarchy is the Mother of Order!"

 glp_news.2.t:0 "§WFOURTH CONGRESS OF PEASANTS & WORKERS§!"
 glp_news.2.d:0 "§WGULYAYPOLE. Delegates from hundreds of communes, mines, and Black Guard regiments have proclaimed the Federation of Free Soviets.§!"
 glp_news.2.a:0 "Long live the free order!"

 glp_news.3.t:0 "§WLEGENDARY TACHANKAS RIDE THE STEPPE§!"
 glp_news.3.d:0 "§WGULYAYPOLE. Mass production of legendary machine-gun carriages is underway across southern workshops.§!"
 glp_news.3.a:0 "The steppe belongs to the free!"
 glp_news.3.b:0 "Formidable news from the steppes"

 glp_news.4.t:0 "§WFORMATION OF THE BLACK INTERNATIONAL§!"
 glp_news.4.d:0 "§WGULYAYPOLE. Syndicalist and anarchist delegations from across the globe have gathered to establish the Black International.§!"
 glp_news.4.a:0 "The flame of revolution will never die!"

 glp_news.5.t:0 "§WNEW FOREIGN ALLIANCE RATIFIED§!"
 glp_news.5.d:0 "§WGULYAYPOLE. The Revolutionary Military Council has ratified an international treaty of mutual military cooperation.§!"
 glp_news.5.a:0 "The enemy shall be defeated!"

 glp_news.6.t:0 "§WTRIUMPH OF THE FREE PEOPLE§!"
 glp_news.6.d:0 "§WGULYAYPOLE. The Free Territory has proven the invincible strength of stateless fraternity.§!"
 glp_news.6.a:0 "Glory to Batko Makhno and the free people!"

