 GLP_underground_armories:0 "§WПодпольные арсеналы§!"
 GLP_underground_armories_desc:0 "§WСоздание тайных складов оружия и боеприпасов в хуторах и балках степи.§!"
 GLP_partisan_warfare_doctrine:0 "§WДоктрина партизанской войны§!"
 GLP_partisan_warfare_doctrine_desc:0 "§WОбучение бойцов тактике внезапных ударов, засад и молниеносного отхода.§!"
 GLP_legendary_tachankas:0 "§WЛегендарные тачанки§!"
 GLP_legendary_tachankas_desc:0 "§WМассовое производство легендарных пулеметных повозок — символа несокрушимой мобильности РПА.§!"
 GLP_black_banner_vanguard:0 "§WАвангард Черного Знамени§!"
 GLP_black_banner_vanguard_desc:0 "§WШтурмовые ударные батальоны Черной Гвардии для сокрушения обороны противника.§!"
 GLP_steppe_lightning:0 "§WСтепная молния§!"
 GLP_steppe_lightning_desc:0 "§WМаксимальная моторизация и разведка для контроля бескрайних просторов степей.§!"
 GLP_anti_tank_cavalry:0 "§WПротивотанковая конница§!"
 GLP_anti_tank_cavalry_desc:0 "§WОснащение мобильных кавалерийских отрядов бронебойными ружьями и гранатами.§!"
 GLP_armored_train_production:0 "§WПроизводство бронепоездов РПА§!"
 GLP_armored_train_production_desc:0 "§WСоздание мощных бронированных крепостей на колесах для доминирования на магистралях.§!"
 GLP_rapid_rail_deployment:0 "§WСтремительная ж/д переброска§!"
 GLP_rapid_rail_deployment_desc:0 "§WИспользование южной железнодорожной сети для мгновенной переброски дивизий на угрожаемые участки.§!"
 GLP_cossack_sabre_tactics:0 "§WМастерство клинка и пулемета§!"
 GLP_cossack_sabre_tactics_desc:0 "§WСочетание сокрушительного пулеметного огня тачанок с сабельной атакой лихой конницы.§!"
 GLP_steel_ram_tactics:0 "§WТактика стального тарана§!"
 GLP_steel_ram_tactics_desc:0 "§WСмелые прорывы вражеских фронтов при поддержке тяжелых бронепоездов и танков.§!"
 GLP_invincible_insurgency:0 "§WНесокрушимое восстание§!"
 GLP_invincible_insurgency_desc:0 "§WВооруженный народ невозможно победить: каждый город и хутор становится крепостью свободы.§!"

 # Ветка 2: Индустриализация и вольные советы
 GLP_syndicate_industrial_planning:0 "§WИндустриальный план вольных синдикатов§!"
 GLP_syndicate_industrial_planning_desc:0 "§WКоординация фабрично-заводских комитетов для развития независимой народной экономики.§!"
 GLP_empower_the_communes:0 "§WМастерские и тачанки§!"
 GLP_empower_the_communes_desc:0 "§WПередача всех заводов и фабрик в прямое самоуправление рабочих коллективов.§!"
 GLP_donbass_coal_and_steel_collective:0 "§WШахтерские и металлургические коллективы Донбасса§!"
 GLP_donbass_coal_and_steel_collective_desc:0 "§WНаращивание добычи угля и выплавки первоклассной броневой стали на заводах Донбасса.§!"
 GLP_dnieper_hydroelectric_freedom:0 "§WКооперативная электрификация§!"
 GLP_dnieper_hydroelectric_freedom_desc:0 "§WИспользование колоссальной энергии Днепра для электрификации сел, городов и заводов.§!"
 GLP_revvoensovet_industry_coordination:0 "§WВольные арсеналы§!"
 GLP_revvoensovet_industry_coordination_desc:0 "§WОбъединение военных мастерских под эгидой РевВоенСовета для непрерывного выпуска боеприпасов.§!"
 GLP_decentralized_workshop_network:0 "§WСеть децентрализованных мастерских§!"
 GLP_decentralized_workshop_network_desc:0 "§WРассредоточенное производство, неуязвимое для вражеских бомбардировок.§!"
 GLP_libertarian_railway_network:0 "§WСвободная железнодорожная сеть юга§!"
 GLP_libertarian_railway_network_desc:0 "§WМодернизация путей, мостов и станций силами вольных транспортных синдикатов.§!"
 GLP_revvoensovet_armored_command:0 "§WБронетанковое и железнодорожное управление§!"
 GLP_revvoensovet_armored_command_desc:0 "§WОрганизация производства легких танков, броневиков и тяжелых бронепоездов.§!"
 GLP_black_sea_shipyards_refit:0 "§WСудоверфи Черного моря§!"
 GLP_black_sea_shipyards_refit_desc:0 "§WМодернизация верфей Николаева и Севастополя для обороны морских рубежей.§!"
 GLP_scientific_communes_academies:0 "§WНаучные лаборатории вольных коммун§!"
 GLP_scientific_communes_academies_desc:0 "§WСоздание передовых исследовательских центров и открытие нового слота научных исследований.§!"
 GLP_autonomous_industrial_bastion:0 "§WАвтономный индустриальный бастион§!"
 GLP_autonomous_industrial_bastion_desc:0 "§WПолная индустриальная самодостаточность Вольной Территории.§!"

 # Ветка 3: Внутренняя безопасность и контрразведка
 GLP_kontrrazvedka_reorganization:0 "§WРеорганизация Контрразведки РПА§!"
 GLP_kontrrazvedka_reorganization_desc:0 "§WПовышение эффективности агентурной и оперативной работы службы безопасности под руководством Лева Задова.§!"
 GLP_purging_white_remnants:0 "§WЛиквидация белогвардейских заговоров§!"
 GLP_purging_white_remnants_desc:0 "§WОбезвреживание тайных монархических и белогвардейских ячеек, угрожающих свободе народа.§!"
 GLP_vigilance_against_cheka_infiltrators:0 "§WБорьба с агентурой ЧК и ОГПУ§!"
 GLP_vigilance_against_cheka_infiltrators_desc:0 "§WЗащита вольных советов и коммун от большевистских провокаторов и диверсантов.§!"
 GLP_libertarian_civil_courts:0 "§WСуды чести и народные сходы§!"
 GLP_libertarian_civil_courts_desc:0 "§WОткрытое народное правосудие на сходах граждан без бюрократических судей и казематов.§!"
 GLP_decree_on_black_terror:0 "§WДекрет о Черном терроре§!"
 GLP_decree_on_black_terror_desc:0 "§WБеспощадное искоренение врагов революции мерами чрезвычайного военного трибунала.§!"
 GLP_zadov_intelligence_network:0 "§WСеть контрразведки Лева Задова§!"
 GLP_zadov_intelligence_network_desc:0 "§WСоздание разветвленной зарубежной и внутренней разведывательной сети.§!"
 GLP_expansion_of_iron_fist:0 "§WЭкспансия железного кулака§!"
 GLP_expansion_of_iron_fist_desc:0 "§WУстановление жесткой военной дисциплины на всех освобожденных территориях.§!"
 GLP_peoples_militia_patrols:0 "§WПатрули народной стражи§!"
 GLP_peoples_militia_patrols_desc:0 "§WДобровольные отряды самообороны граждан для поддержания порядка на улицах.§!"
 GLP_unshakeable_revolutionary_order:0 "§WНепоколебимый революционный порядок§!"
 GLP_unshakeable_revolutionary_order_desc:0 "§WСтабильность и абсолютная защищенность завоеваний вольного народа.§!"

 # Ветка 4: Дипломатические союзы
 GLP_international_diplomacy_crossroads:0 "§WДипломатический выбор Гуляйполя§!"
 GLP_international_diplomacy_crossroads_desc:0 "§WОпределение внешнеполитического курса Вольной Территории на пороге мировой войны.§!"
 GLP_alliance_with_soviet_union:0 "§WСоюз с Советским Союзом§!"
 GLP_alliance_with_soviet_union_desc:0 "§WВоенно-политический пакт с Москвой на условиях взаимного признания автономии советов.§!"
 GLP_alliance_with_germany:0 "§WПакт с Германией§!"
 GLP_alliance_with_germany_desc:0 "§WПрагматичный пакт о ненападении и военно-техническом сотрудничестве с Берлином.§!"
 GLP_alliance_with_britain:0 "§WДоговор с Великобританией§!"
 GLP_alliance_with_britain_desc:0 "§WСоглашение с западными демократиями для защиты черноморской торговли и независимости.§!"
 GLP_soviet_armaments_lend_lease:0 "§WСоветский военный ленд-лиз§!"
 GLP_soviet_armaments_lend_lease_desc:0 "§WПоставки стрелкового оружия и артиллерии со складов РККА.§!"
 GLP_krupp_arms_shipments:0 "§WПоставки вооружений от Krupp§!"
 GLP_krupp_arms_shipments_desc:0 "§WИмпорт немецких противотанковых орудий и новейшего пехотного снаряжения.§!"
 GLP_vickers_armaments_lend_lease:0 "§WВоенные поставки Vickers§!"
 GLP_vickers_armaments_lend_lease_desc:0 "§WПрибытие британских конвоев со стрелковым оружием и тяжелой артиллерией.§!"
 GLP_joint_red_black_military_academy:0 "§WСовместная военная академия§!"
 GLP_joint_red_black_military_academy_desc:0 "§WОбмен передовым тактическим опытом между командирами РПА и советскими военспецами.§!"
 GLP_wehrmacht_tactical_instructors:0 "§WВоенные инструкторы Вермахта§!"
 GLP_wehrmacht_tactical_instructors_desc:0 "§WВнедрение методов глубоких маневренных прорывов и прусской штабной выучки.§!"
 GLP_sevastopol_naval_refit_with_royal_navy:0 "§WМодернизация верфей с Royal Navy§!"
 GLP_sevastopol_naval_refit_with_royal_navy_desc:0 "§WПереоснащение севастопольских доков по британским чертежам.§!"
 GLP_eurasian_red_black_vanguard:0 "§WЕвразийский Красно-Черный авангард§!"
 GLP_eurasian_red_black_vanguard_desc:0 "§WНесокрушимый союз трудящихся Востока для разгрома мирового империализма.§!"
 GLP_black_cross_of_the_steppes:0 "§WЧерный крест степей§!"
 GLP_black_cross_of_the_steppes_desc:0 "§WМощнейшая ось степной ударной мощи в союзе со странами Оси.§!"
 GLP_bastion_of_free_nations:0 "§WОплот свободных наций§!"
 GLP_bastion_of_free_nations_desc:0 "§WГуляйполе как несокрушимый бастион свободы и антитоталитарного сопротивления.§!"
 GLP_free_will:0 "§WВольному воля§!"
 GLP_free_will_desc:0 "§WГуляйполе не встаёт ни под чьи знамёна. Слава Батьки гремит по всей Европе: воюющие державы шлют доббровольцев под чёрное знамя, а сама РПА крепит волю трудового народа.§!"
 GLP_old_enemies_unite:0 "§WСтарые враги§!"
 GLP_old_enemies_unite_desc:0 "§WПризыв к бывшим противникам по всей Европе — от белых эмигрантов до дезертиров всех армий — объединиться против общего врага. Полки добровольцев прибывают в Гуляйполе на помощь Нестору Махно.§!"
 GLP_international_brigades:0 "§WИнтернациональные бригады§!"
 GLP_international_brigades_desc:0 "§WАнархисты, социалисты и антифашисты всего мира формируют интернациональные бригады. Гуляйполе получает оружие, людей и право принимать доббровольческие части любой воюющей страны.§!"
 GLP_black_cross_aid:0 "§WПомощь Чёрного Креста§!"
 GLP_black_cross_aid_desc:0 "§WАнархистский Чёрный Крест разворачивает сеть снабжения: вольные мастеровые и зарубежные товарищи ставят под ружьё новые заводы и арсеналы.§!"
 GLP_makhno_myth:0 "§WМиф о Махно§!"
 GLP_makhno_myth_desc:0 "§WИмя Батьки становится легендой по всей Европе. Бойцы РПА сражаются с верой в свою правду, а враги трепещут при одном виде чёрного знамени.§!"

 # Ветка 5: Аграрные и социальные реформы
 GLP_peasant_grain_supplies:0 "§WПоставки продовольствия от вольных крестьян§!"
 GLP_peasant_grain_supplies_desc:0 "§WСвободный добровольный товарообмен между хлеборобами степи и рабочими городов.§!"
 GLP_bread_for_cities_and_front:0 "§WХлеб для городов и фронта§!"
 GLP_bread_for_cities_and_front_desc:0 "§WБесперебойное снабжение отрядов Черной Гвардии лучшим хлебом свободных степей.§!"
 GLP_communal_granaries:0 "§WОбщинные зернохранилища и элеваторы§!"
 GLP_communal_granaries_desc:0 "§WСтроительство современных механизированных элеваторов для создания стратегических запасов зерна.§!"
 GLP_tractor_stations_for_communes:0 "§WМашинно-тракторные станции коммун§!"
 GLP_tractor_stations_for_communes_desc:0 "§WОснащение крестьянских коммун тракторами и комбайнами для кратного роста урожайности.§!"
 GLP_land_to_the_tillers_decree:0 "§WДекрет: Земля тем, кто её обрабатывает§!"
 GLP_land_to_the_tillers_decree_desc:0 "§WОкончательная отмена частной и государственной собственности на землю — земля принадлежит трудовому народу!§!"
 GLP_free_libertarian_schools:0 "§WСвободные школы и ликвидация неграмотности§!"
 GLP_free_libertarian_schools_desc:0 "§WВсеобщее бесплатное образование и открытие нового слота научных исследований.§!"
 GLP_rural_healthcare_network:0 "§WСеть земской медицины§!"
 GLP_rural_healthcare_network_desc:0 "§WОрганизация сельских больниц, пунктов вакцинации и санитарных поездов.§!"
 GLP_steppes_breadbasket:0 "§WЖитница свободной степи§!"
 GLP_steppes_breadbasket_desc:0 "§WПревращение южных просторов в изобильный оазис свободного крестьянского труда.§!"
 GLP_peasant_intellectual_harmony:0 "§WГармония крестьянского и умственного труда§!"
 GLP_peasant_intellectual_harmony_desc:0 "§WСлияние физического и научного творчества для процветания общества.§!"
 GLP_flourishing_free_countryside:0 "§WПроцветающая вольная деревня§!"
 GLP_flourishing_free_countryside_desc:0 "§WБогатые, культурные и вооруженные крестьянские коммуны юга.§!"

 # Ветка 6: Судьба Вольной Территории и Мировая Революция
 GLP_fourth_congress_of_peasants:0 "§WIV Съезд крестьян, рабочих и повстанцев§!"
 GLP_fourth_congress_of_peasants_desc:0 "§WВсенародный съезд делегатов Вольного Гуляйполя для определения пути развития страны.§!"
 GLP_federation_of_free_soviets:0 "§WФедерация вольных Советов§!"
 GLP_federation_of_free_soviets_desc:0 "§WПостроение подлинного безгосударственного анархо-коммунистического общества.§!"
 GLP_black_military_dictatorship:0 "§WЧерная военная диктатура§!"
 GLP_black_military_dictatorship_desc:0 "§WКонцентрация всей власти в руках военного совета для подготовки к тотальной войне.§!"
 GLP_black_international:0 "§WЧерный Интернационал§!"
 GLP_black_international_desc:0 "§WОбъединение анархистов всего мира для координации антиавторитарной борьбы.§!"
 GLP_total_militarization_of_communes:0 "§WТотальная милитаризация коммун§!"
 GLP_total_militarization_of_communes_desc:0 "§WПревращение всех заводов и хозяйств в военные цеха армии.§!"
 GLP_aid_to_spanish_anarchists:0 "§WБратская помощь CNT-FAI§!"
 GLP_aid_to_spanish_anarchists_desc:0 "§WОтправка добровольцев и эшелонов с оружием испанским братьям по борьбе.§!"
 GLP_black_crescent_of_the_steppes:0 "§WЧерный Полумесяц Вольных Степей§!"
 GLP_black_crescent_of_the_steppes_desc:0 "§WОсвобождение народов Причерноморья, Крыма, Дона и Кавказа от тирании.§!"
 GLP_anti_state_continental_crusade:0 "§WАнтигосударственный поход§!"
 GLP_anti_state_continental_crusade_desc:0 "§WНаступление на все империалистические государства континента.§!"
 GLP_declaration_of_world_anarchy:0 "§WДекларация Мировой Анархии§!"
 GLP_declaration_of_world_anarchy_desc:0 "§WПровозглашение планетарного восстания против власти капитала и государств.§!"
 GLP_triumph_of_free_humanity:0 "§WТриумф Свободного Человечества§!"
 GLP_triumph_of_free_humanity_desc:0 "§WВечный триумф свободы, братства и солидарности во всем мире.§!"

 # Идеи и национальные духи
 GLP_idea_dnieper_hydroelectric:0 "§WЭнергия ДнепроГЭС§!"
 GLP_idea_dnieper_hydroelectric_desc:0 "§WТурбины ДнепроГЭС питают мастерские и депо Вольной территории — металл идёт потоком, а свет горит даже в самых глухих сёлах.§!"
 GLP_idea_decentralized_workshops:0 "§WДецентрализованные мастерские§!"
 GLP_idea_decentralized_workshops_desc:0 "§WПроизводство рассредоточено по сотням сельских мастерских: разбомбить такую промышленность невозможно, а восстанавливается она за считанные дни.§!"
 GLP_idea_autonomous_industrial_bastion:0 "§WАвтономная индустрия§!"
 GLP_idea_autonomous_industrial_bastion_desc:0 "§WВольная территория опирается только на собственные станки и собственное сырьё — ни один внешний ультиматум не остановит наши заводы.§!"
 GLP_idea_kontrrazvedka_surveillance:0 "§WБдительность Контрразведки§!"
 GLP_idea_kontrrazvedka_surveillance_desc:0 "§WРазведывательно-заградительный отдел присматривает за дорогами, вокзалами и постоялыми дворами: чужой агент не проедет и одной волости.§!"
 GLP_idea_anti_cheka_vigilance:0 "§WЩит от провокаторов§!"
 GLP_idea_anti_cheka_vigilance_desc:0 "§WСельские сходы сами вылавливают провокаторов и подстрекателей, лишая соседние державы почвы для подрывной работы.§!"
 GLP_idea_libertarian_courts:0 "§WНародные сходы правосудия§!"
 GLP_idea_libertarian_courts_desc:0 "§WПравосудие вершат выборные народные сходы, а не чиновники: приговоры быстры, понятны и потому уважаемы.§!"
 GLP_idea_zadov_network:0 "§WАгентурная сеть Задова§!"
 GLP_idea_zadov_network_desc:0 "§WАгентура Задова работает от Харькова до Одессы, доставляя штабу сведения раньше, чем противник успевает отдать приказ.§!"
 GLP_idea_militia_patrols:0 "§WНародная стража§!"
