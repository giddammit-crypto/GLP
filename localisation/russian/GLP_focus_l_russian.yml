l_russian:
 GLP_focus_tree:0 "§WВольная Территория — Гуляйполе§!"
 # Ветка 1: Военная доктрина и партизанская война
 GLP_insurgent_army_reorganization:0 "§WРеорганизация Повстанческой Армии§!"
