 tachanka_equipment_2:0 "Бронированная тачанка прорыва обр. 1938 г."
 tachanka_equipment_2_desc:0 "Тачанка со стальными щитками и спаренной пулемётной установкой."
 tachanka_equipment_3:0 "Бронеавтомобиль «Воля» обр. 1939 г."
 tachanka_equipment_3_desc:0 "Полугусеничный броневик с двумя пулемётными башнями."
 tachanka_equipment_4:0 "Тяжёлый броневик «Батько» обр. 1941 г."
 tachanka_equipment_4_desc:0 "Тяжёлый пушечный броневик с 45-мм орудием."

 # Конструктор дивизий: заголовок группы бронированных/пулемётных тачанок
 # (блок группы задан в common/units/GLP_white_units.txt: group = cavalry).
 group_cavalry_title:0 "Тачанки"
 group_cavalry_desc:0 "Пулемётные и бронированные тачанки РПА."
 armored_train_GLP:0 "Бронепоезд «Свобода или Смерть»"
 armored_train_GLP_desc:0 "Тяжёлый повстанческий бронепоезд времён боёв за Александровск и Екатеринослав. Усиленное бронирование паровоза и вагонов, пулемётные казематы и знамя Вольной Территории защищают магистрали революции."
 train_equipment_3_GLP:0 "Бронепоезд «Свобода или Смерть»"
 train_equipment_3_GLP_desc:0 "Тяжёлый штурмовой бронепоезд Батьки Махно с усиленной бронёй, зенитными турелями и пулемётными расчётами."
 GLP_train_tech_1:0 "Бронепоезд «Свобода или Смерть»"
 GLP_train_tech_1_desc:0 "Тяжёлый бронепоезд времён боёв за Александровск и Екатеринослав. Усиленное бронирование паровоза и вагонов, пулемётные казематы и зенитные турели защищают магистрали от авиаударов противника."
 GLP_train_tech_2:0 "Бронепоезд «Батько Махно»"
 GLP_train_tech_2_desc:0 "Флагман железнодорожных сил Вольной Территории. Оснащён поворотными артиллерийскими бронебашнями с 76-мм орудиями, радиостанцией штаба и скорострельными зенитными автоматами."
 GLP_train_tech_3:0 "Бронепоезд «Гроза Степей»"
 GLP_train_tech_3_desc:0 "Вершина махновской железнодорожной мощи. Скоростной бронированный состав с мощной 37-мм ПВО-батареей, прожекторными вышками и десантной платформой для молниеносной зачистки перегонов."
 GLP_train_equipment_1:0 "Бронепоезд «Свобода или Смерть»"
 GLP_train_equipment_1_desc:0 "Тяжёлый штурмовой бронепоезд с усиленной противоосколочной бронёй и пулемётными расчётами."
 GLP_train_equipment_2:0 "Бронепоезд «Батько Махно»"
 GLP_train_equipment_2_desc:0 "Флагманский бронепоезд РПА с тяжёлыми орудийными башнями и узлом дальней радиосвязи."
 GLP_train_equipment_3:0 "Бронепоезд «Гроза Степей»"
 GLP_train_equipment_3_desc:0 "Глубоко модернизированный скоростной бронепоезд с эшелонированной зенитной защитой."
 GLP_train_bonus:0 "Развитие железнодорожных бронесил"
 GLP_armored_train_equipment:0 "Бронепоезда"
 GLP_armored_train_equipment_desc:0 "Тяжёлые железнодорожные крепости со спаренными орудиями, зенитными автоматами и пулемётными расчётами."
