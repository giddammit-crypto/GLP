 GLP_international_brigades:0 "§WInternational Brigades§!"
 GLP_international_brigades_desc:0 "§WAnarchists, socialists and anti-fascists the world over form international brigades. Gulyaypole receives weapons, men and the right to host volunteer units from any country at war.§!"
