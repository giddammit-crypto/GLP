 GLP_dnieper_rural_electrification:0 "Электрификация хуторов от ДнепроГЭС"
 GLP_expand_ekaterinoslav_armories:0 "Расширение оружейных мастерских Екатеринослава"
 GLP_build_armored_rail_scouts:0 "Броневые дрезины завода им. Малышева"

 GLP_emergency_grain_relief:0 "Срочная продовольственная помощь городам"
 GLP_organize_communal_tractor_brigades:0 "Сельские МТС и тракторные бригады"
 GLP_establish_strategic_grain_reserve:0 "Стратегический хлебный фонд степи"

 GLP_crackdown_on_crimean_white_cells:0 "Облава на белогвардейские ячейки в Крыму"
