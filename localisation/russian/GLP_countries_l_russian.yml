 # ---------------------------------------------------------------------------
 #  Закладка старта и слог конца 1920-х (главное меню, экран выбора страны)
 # ---------------------------------------------------------------------------
 GLP_GATHERING_STORM_DESC:0 "§YГуляйполе, зима 1936 года.§!\n\nСемнадцать лет минуло с того дня, как вольная степь отбилась и от белаго погона, и от краснаго комиссара. Между Днепром и Доном стоит то, чего не значится ни в одном дипломатическом справочнике: земля без помещика, завод без хозяина, уезд без начальства.\n\nВластью здесь зовут сельский сход, войском — Революционную Повстанческую Армию, а Батько Махно по старой памяти именуется не президентом и не вождем, а всего лишь §Yсоветчиком вольнаго народа§!.\n\nСоседи сговариваются. Москва точит зубы на хлеб и уголь, Варшава — на переправы, Берлин считает наши версты по своей карте. Черная гвардия седлает коней: §Yземля — крестьянам, фабрики — рабочим, а воля — никому не отдается§!."
 GLP_MOTTO_1:0 "Анархия — мать порядка"
 GLP_MOTTO_2:0 "Свобода или смерть!"
 GLP_MOTTO_3:0 "Земля — крестьянам, фабрики — рабочим"

