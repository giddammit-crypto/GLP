 # Ideas
 GLP_idea_dnieper_hydroelectric:0 "Dnieper Dam Energy"
 GLP_idea_dnieper_hydroelectric_desc:0 "The Dnieper turbines power the workshops and depots of the Free Territory: metal flows freely and light reaches even the remotest villages."
 GLP_idea_decentralized_workshops:0 "Decentralized Workshops"
 GLP_idea_decentralized_workshops_desc:0 "Production is scattered across hundreds of village workshops. Such industry cannot be bombed flat, and it recovers within days."
 GLP_idea_autonomous_industrial_bastion:0 "Autonomous Industry"
 GLP_idea_autonomous_industrial_bastion_desc:0 "The Free Territory relies on its own lathes and its own raw materials: no foreign ultimatum can shut our factories down."
 GLP_idea_kontrrazvedka_surveillance:0 "Kontrrazvedka Vigilance"
 GLP_idea_kontrrazvedka_surveillance_desc:0 "The Counter-Intelligence Department watches the roads, stations and inns; a foreign agent will not cross a single district unnoticed."
 GLP_idea_anti_cheka_vigilance:0 "Anti-Cheka Shield"
 GLP_idea_anti_cheka_vigilance_desc:0 "Village assemblies root out provocateurs themselves, denying neighbouring powers any ground for subversion."
 GLP_idea_libertarian_courts:0 "Popular Courts of Honor"
 GLP_idea_libertarian_courts_desc:0 "Justice is dispensed by elected popular assemblies rather than officials: verdicts are swift, comprehensible and therefore respected."
 GLP_idea_zadov_network:0 "Zadov Intelligence Network"
 GLP_idea_zadov_network_desc:0 "Zadov's agents work from Kharkov to Odessa, delivering intelligence to headquarters before the enemy has even issued his orders."
 GLP_idea_militia_patrols:0 "People's Patrols"
 GLP_idea_militia_patrols_desc:0 "Armed commune militias patrol their own roads. The rear is calm, and the people see the guard as theirs rather than an occupier's."
 GLP_idea_land_to_tillers:0 "Land to the Tillers"
 GLP_idea_land_to_tillers_desc:0 "The landlords' fields belong to those who plough them. A peasant who owns his land feeds the army and gladly sends it his sons."
 GLP_idea_rural_healthcare:0 "Rural Healthcare"
 GLP_idea_rural_healthcare_desc:0 "Rural aid posts and field infirmaries save thousands of lives once lost to typhus and untreated wounds."
 GLP_idea_black_crescent:0 "Steppes Black Crescent"
 GLP_idea_black_crescent_desc:0 "The black banner arcs across the steppe from the Dnieper to the Don: our frontiers are deeper and our blow heavier."
 GLP_idea_continental_crusade:0 "Continental Crusade"
 GLP_idea_continental_crusade_desc:0 "The Insurgent Army no longer waits for the enemy at home — it carries the revolt beyond the Free Territory."
 GLP_idea_triumph_of_liberty:0 "Triumph of Liberty"
 GLP_idea_triumph_of_liberty_desc:0 "The stateless society has endured and prevailed: free labour, free science and free soviets outperform any bureaucracy."

