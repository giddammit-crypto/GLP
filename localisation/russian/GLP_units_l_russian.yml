 # --- Уникальная ветка бронепоездов РПА (Гуляйполе) ---
 GLP_train_tech_1:0 "Бронепоезд «Свобода или Смерть»"
 GLP_train_tech_1_desc:0 "Тяжёлый бронепоезд времён боёв за Александровск и Екатеринослав. Усиленное бронирование (Броня: 360), пулемётные казематы и зенитные турели (ПВО: 30, Атака: 26/16) надёжно защищают магистрали от авиаударов и штурмов противника."
 GLP_train_tech_2:0 "Бронепоезд «Батько Махно»"
 GLP_train_tech_2_desc:0 "Флагман железнодорожных сил Вольной Территории. Оснащён тяжёлыми бронелистами (Броня: 450), поворотными артиллерийскими бронебашнями с 76-мм орудиями, зенитными автоматами (ПВО: 38, Атака: 34/22) и радиостанцией штаба."
 GLP_train_tech_3:0 "Бронепоезд «Гроза Степей»"
 GLP_train_tech_3_desc:0 "Вершина махновской железнодорожной мощи. Скоростной бронированный состав с мощной бронёй (Броня: 520), батареей 37-мм зенитных автоматов (ПВО: 46, Атака: 42/28) и десантной платформой."
 GLP_armored_train_1:0 "Бронепоезд «Свобода или Смерть»"
 GLP_armored_train_1_desc:0 "Тяжёлый штурмовой бронепоезд (Броня: 360, ПВО: 30, Атака: 26/16) с усиленной противоосколочной защитой и пулемётными расчётами."
 GLP_armored_train_2:0 "Бронепоезд «Батько Махно»"
 GLP_armored_train_2_desc:0 "Флагманский бронепоезд РПА (Броня: 450, ПВО: 38, Атака: 34/22) с тяжёлыми орудийными башнями и узлом дальней радиосвязи."
 GLP_armored_train_3:0 "Бронепоезд «Гроза Степей»"
 GLP_armored_train_3_desc:0 "Глубоко модернизированный скоростной бронепоезд (Броня: 520, ПВО: 46, Атака: 42/28) с эшелонированной зенитной защитой."
 GLP_train_bonus:0 "Развитие железнодорожных бронесил"
 GLP_armored_train_equipment:0 "Бронепоезда"
 GLP_armored_train_equipment_desc:0 "Тяжёлые железнодорожные крепости со спаренными орудиями, зенитными автоматами и пулемётными расчётами."
