 GLP_idea_moscow_grain_tribute_desc:0 "§WCommunes ship grain for a delay of war. The rear goes hungry and the soviets grumble.§!"
 GLP_idea_partisan_camps_timed:0 "§WFloodplain Camps§!"
 GLP_idea_partisan_camps_timed_desc:0 "§WTemporary bases in the Dnieper reeds cover the rear and feed reconnaissance.§!"

 GLP_idea_makhno_illness:0 "§WThe Batko's Illness§!"
 GLP_idea_makhno_illness_desc:0 "§WTuberculosis floors Makhno. The soviets argue and the staff loses the thread.§!"
 GLP_idea_occupied_kiev_soviet:0 "§WKiev Free Soviet§!"
 GLP_idea_occupied_kiev_soviet_desc:0 "§WA soviet is raised in occupied Kiev — compliance grows at the price of bread.§!"

 GLP_idea_recognized_border:0 "§WA Recognized Border§!"
 GLP_idea_recognized_border_desc:0 "§WAt least one power has stood surety for the Free Territory. The ring has loosened, but the exchanges still treat the steppe as a stranger.§!"
 GLP_idea_isolated_resistance:0 "§WIsolationist Resistance§!"
 GLP_idea_isolated_resistance_desc:0 "§WThe pact was refused, so we hold out alone. Garrisons dig deeper and the villages stand with the insurgents, but goods grow dearer and political power fades: we have no foreign friends left.§!"
# ── New ideas: Spanish Scenario ─────────────────────────────────────────
 GLP_voice_of_aragon:0 "§WVoice of Aragon§!"
 GLP_voice_of_aragon_desc:0 "§WAndres Nin is a living symbol that the NKVD can be beaten. His presence in Gulyaipole gives the anarchist movement political and theoretical momentum.§!"
 GLP_international_support:0 "§WInternational Solidarity§!"
 GLP_international_support_desc:0 "§WEmma Goldman's visit drew the eyes of the world. Volunteers are arriving, the press is writing, and the Free Territory for the first time becomes a symbol of living anarchism.§!"
 GLP_black_international_member:0 "§WMember of the Black International§!"
 GLP_black_international_member_desc:0 "§WGulyaipole, syndicalist Spain and the French CGT are formally united. The Black International is a real force, not a declaration.§!"
 GLP_spanish_veterans:0 "§WSpanish Veterans§!"
 GLP_spanish_veterans_desc:0 "§WCNT-FAI cadres have passed through the street battles of Barcelona, the defence of Madrid and the mountain crossings of Aragon. Their experience is now in the ranks of the Black Guard.§!"
 GLP_aragon_collective_model:0 "§WAragonese Collective Model§!"
 GLP_aragon_collective_model_desc:0 "§WReports from Aragon confirm: anarcho-collectivism works. The Tavrian communes are adopting the methods: self-governance, rotation, mutual aid.§!"
 GLP_equal_soviet_partnership:0 "§WEqual Soviet Pact§!"
 GLP_equal_soviet_partnership_desc:0 "§WThe Kharkov Pact II was concluded on equal terms without political commissars or Cheka agents. The Red Army and Insurgent Army coordinate headquarters while maintaining full internal autonomy.§!"
 GLP_soviet_heavy_industry_support:0 "§WSoviet Heavy Industry Support§!"
 GLP_soviet_heavy_industry_support_desc:0 "§WMachinery from Kharkov and Leningrad, alongside coal and iron shipments, have established heavy defence production in Gulyaipole.§!"
 GLP_krupp_rearmament:0 "§WKrupp Arms Rearmament§!"
 GLP_krupp_rearmament_desc:0 "§WHeavy German anti-tank guns and armoured cars have been integrated into the Black Guard divisions, boosting firepower significantly.§!"
 GLP_german_anarchist_cadres:0 "§WGerman Anarcho-Syndicalists (FAUD)§!"
 GLP_german_anarchist_cadres_desc:0 "§WRescued FAUD unionists and Berlin anti-fascist underground activists share underground warfare and engineering expertise with the Free Territory.§!"
 GLP_black_sea_admiralty:0 "§WBlack Sea Syndicalist Admiralty§!"
 GLP_black_sea_admiralty_desc:0 "§WBritish naval cooperation and convoy deliveries reinforce Black Sea sea-lanes, making Odessa and Berdyansk robust naval bastions.§!"
 GLP_british_trade_union_solidarity:0 "§WBritish Trade Union Solidarity§!"
 GLP_british_trade_union_solidarity_desc:0 "§WDirect alliance with British trade unions secures steady supplies and political protection across the Western democracies.§!"
