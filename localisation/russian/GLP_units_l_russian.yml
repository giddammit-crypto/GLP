 GLP_tachanka_tech_1:0 "Пулемётная тачанка РПА"
 GLP_tachanka_tech_1_desc:0 "Классическая рессорная повозка со станковым пулеметом «Максим» — основа мобильности и сокрушительного пулеметного огня в степи."
 GLP_tachanka_tech_2:0 "Бронированная тачанка прорыва"
 GLP_tachanka_tech_2_desc:0 "Усиление тачанок стальными бронещитами и спаренными пулеметными системами для подавления огневых точек противника."
 GLP_tachanka_tech_3:0 "Бронеавтомобиль «Воля»"
 GLP_tachanka_tech_3_desc:0 "Бронирование грузовых шасси и установка вращающихся крупнокалиберных пулеметных бронебашен."
 GLP_tachanka_tech_4:0 "Тяжёлый броневик «Батько»"
 GLP_tachanka_tech_4_desc:0 "Оснащение колесной бронетехники 45-мм противотанковыми орудиями и наклонной броней."
 category_tachanka:0 "Тачанка"
 tachanka:0 "Тачанки (Тачанка)"
