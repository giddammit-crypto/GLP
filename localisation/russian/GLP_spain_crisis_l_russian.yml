l_russian:
 # ================================================================
 #  Модуль «Испанский пожар и Чёрный Интернационал»
 # ================================================================

 # --- Событие «Испанский пожар» (лето 1936) ---
 glp_spain.1.t:0 "ИСПАНСКИЙ ПОЖАР"
 glp_spain.1.d:0 "ГУЛЯЙ-ПОЛЕ. Из Барселоны приходят вести: поднялась Каталония, поднялись синдикаты, и над Иберией полыхает огонь, который, может быть, и есть наш огонь. «Набат» звонит по всем точкам: братья зовут. Частини РПА уже шепчутъся о дальнем походе — через моря и горы, к огню."
 glp_spain.1.a:0 "Братья зовут! Всё для Каталонии!"
 glp_spain.1.b:0 "Поможем тайно"
 glp_spain.1.c:0 "Наши рубежи важнее"

 # --- Майские дни в Барселоне (май 1937) ---
 glp_barcelona.1.t:0 "МАЙСКИЕ ДНИ В БАРСЕЛОНЕ"
 glp_barcelona.1.d:0 "БАРСЕЛОНА. Фабричные митинги переросли в перестрелки, перестрелки — в уличныя битвы. На одной стороне — вольныя синдикаты CNT-FAI, на другой — комиссары НКВД и агенты PCE, и за кем победа — решится в эти дни. Наши связные ждут сигналу."
 glp_barcelona.1.a:0 "Чёрный Интернационал бьёт первым"
 glp_barcelona.1.b:0 "Диючемо тихо"
 glp_barcelona.1.c:0 "Пусть решит фронт"
 glp_barcelona.1.w:0 "Наблюдаем из-пид тени"

 # --- Новини: исход майських днив ---
 glp_barcelona.2.t:0 "ВЛАСТЬ СИНДИКАТИВ"
 glp_barcelona.2.d:0 "БАРСЕЛОНА. Спецгрупа КРО обезвредила агентив НКВД до того, як вони успили систи до потяга. Фабрики Каталонии й Арагону проголошени вильними, милиция на вулицях, и над Барселоною впервые вивисалося чорне знамя з двома жолудями."
 glp_barcelona.2.a:0 "Свобода або смерть!"
 glp_barcelona.3.t:0 "СИЛЬНИШЕЕ СЛИВО — ПИЛКОВИЙ КОМИССАР"
 glp_barcelona.3.d:0 "БАРСЕЛОНА. Наши люди вивели агентуру з миста ранише термину, але видкритого ходу не було: РГТ вцилила, CNT-FAI дисталась лише передыху. Зв'язкови доносять: справа не скинчилась, але викно звужуеться."
 glp_barcelona.3.a:0 "Справа не скинчилась"
 glp_barcelona.4.t:0 "ПОРЯДОК ЧУЖОЮ РУКОЮ"
 glp_barcelona.4.d:0 "МОСКВА. Без нашои руки Барселона сдана: майские дни придушени, вильни милиции розигнани, а на вулицях — комисари. Зв'язки з Гуляйполем обриваються: «махновськи програми» згорнути, и у вильний преси про них бильше не пишуть."
 glp_barcelona.4.a:0 "Так вийшло"
 glp_barcelona.5.t:0 "БАРСЕЛОНА УСПОКОИЛАСЯ"
 glp_barcelona.5.d:0 "БАРСЕЛОНА. Перестрилки стихли ранише, ниж хтось встиг бити в набат. Фронт лишився фронтом, а Барселона — мистом, де знову торгують на ринку. Але вси знають: питання про те, чиий влади вильнише, видкладене не назавжди."
 glp_barcelona.5.a:0 "Чикаемо"

 # --- Чорноморсько-Иберийський пакт ---
 glp_bi.1.t:0 "ЧОРНОМОРСЬКО-ИБЕРИЙСЬКИЙ ПАКТ"
 glp_bi.1.d:0 "ГУЛЯЙ-ПОЛЕ. На нейтральний води Чорного моря пидписано пакт: Вильна Територия та вильни синдикати Иберии поеднують зусилля. «Чорний Интернационал» проголошено: вугилля Донбасу та хлиб степу — за каталонський вольфрам и синдикалистськи майстерни. Вид Гуляйполя до Барселони — одна вильна артерия."
 glp_bi.1.a:0 "Вольному воля!"

 # --- Назва фракции ---
 GLP_black_international_faction:0 "Чорний Интернационал"

 # --- Категория та ришенне «Испанський маршрут» ---
 GLP_spain_smuggling_routes:0 "Испанський маршрут"
 GLP_spain_black_sea_run:0 "Чорноморський прорив"
 GLP_spain_black_sea_run_desc:0 "Конвой з 1500 гвинтивок иде через Босфор. Шанс прориву — 65%. При перехопленни Regia Marina конвой втрачено, а Рим надсилае ноту протесту."
 GLP_spain_balkan_underground_traffic:0 "Балканський пидпильний трафик"
 GLP_spain_balkan_underground_traffic_desc:0 "Прихована доставка невеликими партиями поиздами через Румунию та Югославию. Шанс — 85%."
 GLP_spain_french_syndicate_smuggling:0 "Французька синдикалистська контрабанда"
 GLP_spain_french_syndicate_smuggling_desc:0 "Вантаж веде через Пиренейи по власних линиях синдикалисти з Франции. Шанс — 95%, плюс тепли стосунки з ливими у Франции."
 GLP_spain_send_kro_group:0 "Надсилання специальнои групи КРО"
 GLP_spain_send_kro_group_desc:0 "Група Льва Задова йде до Барселони: виведення з ладу агентив НКВД та PCE до «травневих днив». Без цього кроку анархистам не встояти."
 GLP_spain_brigade_homecoming:0 "Повернення бригади"
 GLP_spain_brigade_homecoming_desc:0 "Добровольци бригади РПА повертаються з Иберийського фронту. Белаш и Каретник отримують рису «Испанський закалю»."
 GLP_spain_black_international_pact:0 "Чорноморсько-Иберийський пакт"
 GLP_spain_black_international_pact_desc:0 "Створення фракции «Чорний Интернационал» з Испаниею та взаемни економични духи. Доступно писля успишних «травневих днив» з 1938 року."

 # --- Духи ---
 GLP_idea_spanish_brigade:0 "Добровольча бригада РПА"
 GLP_idea_spanish_brigade_desc:0 "Частини РПА пишли на Иберийський фронт: добровольци йдуть охочише, а досвид вуличних боив лишаеться у полках."
 GLP_idea_nabat_disloyal:0 "«Набат» замовк"
 GLP_idea_nabat_disloyal_desc:0 "Мережа зв'язковикив «Набат» розчарована видмовою: чутки заминюють свидчення, а свидчення — чутки. На 365 днив."
 GLP_idea_catalan_wolfram_syndicate_workshops:0 "Каталонський вольфрам и синдикалистськи майстерни"
 GLP_idea_catalan_wolfram_syndicate_workshops_desc:0 "Вольфрам Пиренейив и майстерни Барселони йдуть на озброення: заводи озброень працюють швидше, и дослидження йдуть смиливише. (У 1.19 национальний дух не видае ресурси — зараховано бонусами виробництва.)"
 GLP_idea_ukrainian_coal_and_grain:0 "Украинське вугилля и хлиб"
 GLP_idea_ukrainian_coal_and_grain_desc:0 "Вугилля Донбасу и хлиб степу йдуть до Иберии: заводи будуються швидше, але на внутришний ринок лишаеться менше. (У 1.19 национальний дух не видае ресурси — зараховано бонусами виробництва.)"

 # --- Риси командирив ---
 GLP_spanish_tempering:0 "Испанський закалю"
 GLP_spanish_tempering_desc:0 "Повернувся з Иберийського фронту: вуличний бий, киннота через гирськи проходи. Организация та розвидка — як у травневих днив."

 # --- Модификатори думок ---
 GLP_italian_protest_note:0 "Нота протесту (перехоплення конвою)"
 GLP_french_syndicalist_warmth:0 "Французьки синдикалисти ведуть наш вантаж"
 GLP_spanish_syndicate_alliance:0 "Вильна Испания синдикалив"
 GLP_spanish_soviet_cold:0 "Прорадянська Барселона"
 GLP_soviet_anarchy_resentment:0 "Незадоволення анархистським втручанством"
