 GLP_makhno_myth:0 "§WThe Makhno Myth§!"
 GLP_makhno_myth_desc:0 "§WThe Batko's name becomes a legend across Europe. RIA fighters battle with faith in their cause, and enemies tremble at the very sight of the black banner.§!"

