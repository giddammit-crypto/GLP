l_russian:
 glp_spain2.1.t:0 "Первый контакт с колонной Дуррути"
 glp_spain2.1.d:0 "Посланники Буэнавентуры Дуррути прибыли в Гуляйполе с вестями о борьбе НКТ-ФАИ в Испании. Они просят прислать опытных военных советников из нашей Черной гвардии."
 glp_spain2.1.a:0 "Отправить наших лучших командиров в Арагон!"
 glp_spain2.1.b:0 "Мы можем предложить лишь символическую солидарность."
 glp_spain2.2.t:0 "Буэнавентура Дуррути: Лев Арагона"
 glp_spain2.2.d:0 "Дуррути проявил себя как харизматичный и непреклонный лидер. Его философия тесно переплетается с нашими махновскими принципами. Более тесные связи с его колонной могут стать основой для истинного Черного Интернационала."
 glp_spain2.2.a:0 "Принять видение Дуррути. Мы стоим вместе!"
 glp_spain2.2.b:0 "Мы будем поддерживать дружеские, но независимые отношения."
 glp_spain2.3.t:0 "Смерть Дуррути"
 glp_spain2.3.d:0 "Трагические новости из Мадрида: Буэнавентура Дуррути пал на фронте в Университетском городке. Вокруг обстоятельств его смерти ходят слухи, многие подозревают причастность НКВД."
 glp_spain2.3.a:0 "Мы должны расследовать это убийство!"
 glp_spain2.3.b:0 "Тяжелый удар по революции. Оплакать его."
 glp_spain2.3.c:0 "Немедленно отправить оружие, чтобы отомстить за него!"
 glp_spain2.4.t:0 "Арагонский коллектив"
 glp_spain2.4.d:0 "Отчеты из Арагона подробно описывают успешную коллективизацию сельского хозяйства и промышленности силами НКТ-ФАИ, демонстрируя жизнеспособность анархистской экономики."
 glp_spain2.4.a:0 "Вдохновляющий пример для всех нас."
 glp_spain2.5.t:0 "Черноморский рейс: Успех"
 glp_spain2.5.d:0 "Наша тайная партия оружия успешно прорвала блокаду и достигла испанских анархистов."
 glp_spain2.5.a:0 "Отличные новости."
 glp_spain2.6.t:0 "Черноморский рейс: Перехват"
 glp_spain2.6.d:0 "Катастрофа! Итальянские военно-морские патрули перехватили наше замаскированное грузовое судно с оружием для Испании."
 glp_spain2.6.a:0 "Фашисты заплатят за это."
 glp_spain2.7.t:0 "Балканское подполье: Подозрения Румынии"
 glp_spain2.7.d:0 "Румынские власти с подозрением относятся к внезапному увеличению транзита 'сельскохозяйственной техники' через их территорию."
 glp_spain2.7.a:0 "Подкупить пограничников."
 glp_spain2.7.b:0 "Изменить маршрут на менее охраняемый."
 glp_spain2.8.t:0 "Солидарность французских синдикалистов"
 glp_spain2.8.d:0 "Французская ВКТ согласилась закрыть глаза на наши контрабандные операции через Пиренеи, проявив истинную синдикалистскую солидарность."
 glp_spain2.8.a:0 "Да здравствует революция!"
 glp_spain2.9.t:0 "Загнанный лидер: Андрес Нин"
 glp_spain2.9.d:0 "Андрес Нин, лидер ПОУМ, преследуется агентами Сталина в Испании. У нас есть короткое окно, чтобы задействовать оперативников КРО для его спасения."
 glp_spain2.9.a:0 "Отправить КРО! Мы должны спасти его."
 glp_spain2.9.b:0 "Это слишком рискованно. Мы не можем вмешиваться."
 glp_spain2.10.t:0 "Нин спасен!"
 glp_spain2.10.d:0 "В ходе дерзкой операции нашим агентам удалось тайно вывезти Андреса Нина из Испании. Он прибыл в Гуляйполе в качестве политического беженца."
 glp_spain2.10.a:0 "Добро пожаловать, товарищ Нин."
 glp_spain2.11.t:0 "Судьба Нина"
 glp_spain2.11.d:0 "Без нашего вмешательства Андрес Нин был арестован советскими агентами и жестоко убит. Его смерть - мрачное предупреждение всем антисталинистским левым силам."
 glp_spain2.11.a:0 "Трагическая потеря для революции."
 glp_spain2.12.t:0 "Анархистская Испания консолидируется"
 glp_spain2.12.d:0 "НКТ-ФАИ укрепила свой контроль над анархистскими территориями и предложила создать единый фронт."
 glp_spain2.12.a:0 "Мы присоединимся к ним!"
 glp_spain2.12.b:0 "Пока мы будем наблюдать."
 glp_spain2.13.t:0 "Советский раскол"
 glp_spain2.13.d:0 "Москва открыто осудила нашу поддержку испанских анархистов, назвав нас 'махновскими вредителями' и саботажниками республиканского дела."
 glp_spain2.13.a:0 "Пусть кричат."
 glp_spain2.14.t:0 "Эмма Гольдман в Гуляйполе"
 glp_spain2.14.d:0 "Известная анархистка Эмма Гольдман прибыла в Гуляйполе, привлекая международное внимание к нашему делу и борьбе в Испании."
 glp_spain2.14.a:0 "Знаменательное событие."
 glp_spain2.15.t:0 "Конгресс Черного Интернационала"
 glp_spain2.15.d:0 "Делегаты из Гуляйполя, Анархистской Испании и французской ВКТ собрались, чтобы официально оформить Черный Интернационал."
 glp_spain2.15.a:0 "Новая эра глобальной солидарности!"
 glp_spain2.16.t:0 "Франко у ворот"
 glp_spain2.16.d:0 "Республиканские силы рушатся. Фашистские войска приближаются к последним оплотам."
 glp_spain2.16.a:0 "Отправить всё, что у нас есть, чтобы удержать линию!"
 glp_spain2.16.b:0 "Готовиться к приему беженцев..."
 glp_spain2.17.t:0 "Испанские беженцы в Гуляйполе"
 glp_spain2.17.d:0 "С падением Испании тысячи кадров НКТ-ФАИ и закаленных в боях ветеранов искали убежища на нашей территории."
 glp_spain2.17.a:0 "Их опыт усилит нашу Черную гвардию."
 glp_spain2.18.t:0 "Уроки Иберии"
 glp_spain2.18.d:0 "Гражданская война в Испании закончилась, оставив нам глубокие уроки о международной солидарности, предательстве и цене свободы."
 glp_spain2.18.a:0 "Мы не забудем."

