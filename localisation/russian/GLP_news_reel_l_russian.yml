l_russian:
 # ================================================================
 # 10 УНИКАЛЬНЫХ НОВОСНЫХ СОБЫТИЙ С ИЗОБРАЖЕНИЯМИ
 # ================================================================

 # 1. Бронепоезд «Свобода или Смерть»
 glp_press.1.t:0 "§WБРОНЕПОЕЗД «СВОБОДА ИЛИ СМЕРТЬ» СОШЁЛ С ВЕРФЕЙ§!"
 glp_press.1.d:0 "§W§YЕКАТЕРИНОСЛАВ.§!§W Из ворот железнодорожных мастерских вышел грозный бронепоезд «Свобода или Смерть» — боевая крепость на рельсах, оснащённая тяжёлыми орудиями и пулемётными башнями. Бронированный состав стал символом несокрушимой военной мощи РПА и грозой всех, кто посмеет угрожать Вольной Территории. Батько Махно лично осмотрел боевую машину и отдал приказ о немедленном развёртывании на южном направлении.§!"
 glp_press.1.a:0 "§WСвобода или Смерть! Бронепоезд — на фронт!§!"
 glp_press.1.b:0 "§WЭто угроза нашему наступлению...§!"
 glp_press.1.c:0 "§WИнтересная конструкция, надо изучить.§!"

 # 2. ДнепроГЭС: Электрификация степи
 glp_press.2.t:0 "§WДНЕПРОГЭС: СТЕПЬ ОЗАРЕНА ЭЛЕКТРИЧЕСТВОМ§!"
 glp_press.2.d:0 "§W§YЗАПОРОЖЬЕ.§!§W Грандиозная плотина Днепровской гидроэлектростанции введена в эксплуатацию силами вольных инженерных коммун. Тысячи километров линий электропередач протянулись по степям, неся свет и энергию в сёла, мастерские и заводы. Электрификация — локомотив свободы, и теперь Вольная Территория обладает мощнейшей энергетической базой на всём юге.§!"
 glp_press.2.a:0 "§WЭлектрификация — это власть свободного народа!§!"
 glp_press.2.b:0 "§WМы должны были контролировать этот объект...§!"
 glp_press.2.c:0 "§WВпечатляющий инженерный проект.§!"

 # 3. Кавалерийский рейд Щуся
 glp_press.3.t:0 "§WЛИХОЙ РЕЙД ЩУСЯ: РАЗГРОМ БЕЛОГВАРДЕЙЦЕВ§!"
 glp_press.3.d:0 "§W§YСТЕПЬ ЮЖНОГО ФРОНТА.§!§W Легендарный командир конного отряда Феодосий Щусь совершил стремительный рейд по тылам противника, разгромив два белогвардейских эшелона и захватив склады с оружием и продовольствием. Конница Черной Гвардии, несущаяся по степи под чёрно-красными знамёнами, навела ужас на вражеские гарнизоны. Трофеи: сотни винтовок, десятки пулемётов и три исправных бронеавтомобиля.§!"
 glp_press.3.a:0 "§WСлава лихому Щусю! Степь — наша!§!"
 glp_press.3.b:0 "§WМахновцы снова нанесли удар в тыл...§!"
 glp_press.3.c:0 "§WСитуация на южном фронте обостряется.§!"

 # 4. Съезд анархистов в Екатеринославе
 glp_press.4.t:0 "§WВСЕУКРАИНСКИЙ СЪЕЗД АНАРХИСТОВ В ЕКАТЕРИНОСЛАВЕ§!"
 glp_press.4.d:0 "§W§YЕКАТЕРИНОСЛАВ.§!§W Делегаты анархистских групп, синдикалистских союзов и вольных коммун со всей Украины собрались на исторический съезд. Принята резолюция о создании Федерации Вольных Советов — общества без государства, капитала и начальников. Всеволод Волин выступил с пламенной речью, призвав трудящихся всего мира последовать примеру Гуляйполя.§!"
 glp_press.4.a:0 "§WДа здравствует анархия — мать порядка!§!"
 glp_press.4.b:0 "§WЭто прямая угроза советской власти...§!"
 glp_press.4.c:0 "§WЛюбопытное политическое явление.§!"

 # 5. Чёрная Гвардия на марше
 glp_press.5.t:0 "§WЧЁРНАЯ ГВАРДИЯ НА МАРШЕ: ВСЕОБЩАЯ МОБИЛИЗАЦИЯ§!"
 glp_press.5.d:0 "§W§YГУЛЯЙ-ПОЛЕ.§!§W РевВоенСовет объявил всеобщую мобилизацию Черной Гвардии. Десятки тысяч добровольцев — крестьян, рабочих, шахтёров — откликнулись на призыв Батьки Махно. Колонны вооружённых бойцов с чёрно-красными знамёнами движутся к линии фронта. Степь гудит от топота копыт и рёва моторов. Враг будет разбит!§!"
 glp_press.5.a:0 "§WКаждый свободный человек — солдат революции!§!"
 glp_press.5.b:0 "§WМахновцы мобилизуют всё население...§!"
 glp_press.5.c:0 "§WНаблюдаем за развитием ситуации.§!"

 # 6. Вольные синдикаты Донбасса
 glp_press.6.t:0 "§WДОНБАСС: ШАХТЫ И ЗАВОДЫ ПЕРЕДАНЫ СИНДИКАТАМ§!"
 glp_press.6.d:0 "§W§YДОНЕЦКИЙ БАССЕЙН.§!§W Все шахты, металлургические заводы и коксохимические предприятия Донбасса переданы под управление вольных рабочих синдикатов. Тысячи шахтёров и металлургов торжественно поклялись добывать уголь и выплавлять сталь для защиты свободы. Производственные показатели растут рекордными темпами — свободный труд эффективнее принуждения!§!"
 glp_press.6.a:0 "§WДонбасс — кузница свободы!§!"
 glp_press.6.b:0 "§WОни захватили наши промышленные ресурсы!§!"
 glp_press.6.c:0 "§WИнтересный эксперимент в экономике.§!"

 # 7. Операция контрразведки Задова
 glp_press.7.t:0 "§WКОНТРРАЗВЕДКА ЗАДОВА РАЗОБЛАЧИЛА ЗАГОВОР§!"
 glp_press.7.d:0 "§W§YГУЛЯЙ-ПОЛЕ.§!§W Агенты особой разведки РПА под руководством Лева Задова разоблачили масштабный заговор белогвардейских агентов и провокаторов ЧК, планировавших диверсии на военных складах и покушение на командование. Десятки арестованных, изъяты шифры, карты и списки агентуры. Контрразведка РПА вновь доказала свою высочайшую эффективность.§!"
 glp_press.7.a:0 "§WЗадов — щит революции! Враги будут наказаны.§!"
 glp_press.7.b:0 "§WИзъятое оружие пойдёт на вооружение ополчения.§!"

 # 8. Процветание крестьянских коммун
 glp_press.8.t:0 "§WЗОЛОТОЙ ВЕК КРЕСТЬЯНСКИХ КОММУН ГУЛЯЙ-ПОЛЯ§!"
 glp_press.8.d:0 "§W§YВОЛЬНАЯ ТЕРРИТОРИЯ.§!§W Свободные крестьянские коммуны Вольной Территории собирают рекордный урожай. Общинные зернохранилища заполнены до отказа, новые тракторные бригады работают на полях, а сельские школы и больницы открываются в каждом селе. Без помещиков и чиновников крестьянский труд приносит невиданное изобилие. Гуляйполе доказывает: народ может жить без государства!§!"
 glp_press.8.a:0 "§WЗемля — тем, кто её обрабатывает!§!"
 glp_press.8.b:0 "§WИнвестируем излишки в промышленность.§!"

 # 9. Радиобашня «Голос Воли»
 glp_press.9.t:0 "§WРАДИОБАШНЯ «ГОЛОС ВОЛИ» НАЧИНАЕТ ВЕЩАНИЕ§!"
 glp_press.9.d:0 "§W§YГУЛЯЙ-ПОЛЕ.§!§W Мощная радиостанция «Голос Воли» вступила в строй, покрывая сигналом всю южную Украину, Крым, Донбасс и Кавказ. Каждый день в эфир выходят передачи на русском, украинском, идиш и немецком языках — призывы к свободе, новости фронта и революционная музыка. Голос свободы теперь невозможно заглушить!§!"
 glp_press.9.a:0 "§WГолос Воли — голос свободного народа!§!"
 glp_press.9.b:0 "§WЭта пропаганда угрожает нашей стабильности...§!"
 glp_press.9.c:0 "§WИнтересная технология.§!"

 # 10. Чёрный Интернационал: Мадрид
 glp_press.10.t:0 "§WЧЁРНЫЙ ИНТЕРНАЦИОНАЛ: БРАТСТВО С CNT-FAI§!"
 glp_press.10.d:0 "§W§YМАДРИД — ГУЛЯЙ-ПОЛЕ.§!§W Делегация РПА подписала исторический пакт о взаимопомощи с испанскими анархистами CNT-FAI. Тысячи добровольцев и эшелоны с оружием отправлены на Пиренейский полуостров. Чёрный Интернационал становится реальной боевой силой — от степей Украины до берегов Эбро анархисты объединяются против фашизма и тирании!§!"
 glp_press.10.a:0 "§WСолидарность — наше оружие! Viva CNT-FAI!§!"
 glp_press.10.b:0 "§WБратья по борьбе пришли на помощь!§!"
 glp_press.10.c:0 "§WМеждународное анархистское движение набирает силу.§!"
