 armored_tachanka_desc:0 "Бронированные штурмовые тачанки огневой поддержки."
 glp_armored_car_volya:0 "Бронеавтомобиль «Воля»"
 glp_armored_car_volya_desc:0 "Манёвренный бронеавтомобиль со спаренными пулемётными башнями для стремительных фланговых ударов."
 glp_heavy_armored_car_batko:0 "Тяжёлый броневик «Батько»"
 glp_heavy_armored_car_batko_desc:0 "Мощный пушечный колёсный броневик революции, оснащённый противотанковым орудием и наклонной бронёй."

 tachanka_equipment:0 "Тачанки и броневики"
 armored_tachanka_equipment:0 "Бронированные тачанки и броневики"
