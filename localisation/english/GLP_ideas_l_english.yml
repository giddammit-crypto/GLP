l_english:
 GLP_black_guard_legacy:0 "Legacy of the Black Guard"
 GLP_black_guard_legacy_desc:0 "The Black Guard traditions grant formidable defensive bonuses on home soil and cavalry mastery, but irregular RIA logistics cause supply difficulties beyond core territories."
