l_russian:
 LOADING_TIP_1:0 "Вольная территорія — не утопія, а опытъ жизни безъ государства.\n— В. М. Волинъ"
 LOADING_TIP_2:0 "Власть развращаетъ, а абсолютная власть развращаетъ абсолютно.\n— М. А. Бакунинъ"
 LOADING_TIP_3:0 "Страсть къ разрушенію есть вмѣстѣ съ тѣмъ и страсть творческая.\n— М. А. Бакунинъ"
 LOADING_TIP_4:0 "Свобода безъ соціализма — привилегія и несправедливость; соціализмъ безъ свободы — рабство.\n— М. А. Бакунинъ"
 LOADING_TIP_5:0 "Если Бога нѣтъ, то все дозволено? — Напротивъ: если Бога нѣтъ, человѣкъ самъ отвѣчаетъ за все.\n— М. А. Бакунинъ"
 LOADING_TIP_6:0 "Государство — это наиболѣе наглое, самое циническое отрицаніе человѣчности.\n— М. А. Бакунинъ"
 LOADING_TIP_7:0 "Взаимная помощь — такой же законъ природы, какъ и взаимная борьба.\n— П. А. Кропоткинъ"
 LOADING_TIP_8:0 "Анархія ведетъ свое начало отъ того же греческаго корня, что и «гармонія».\n— П. А. Кропоткинъ"
 LOADING_TIP_9:0 "Земля — общее достояніе, и трудящійся имѣетъ на нее неотъемлемое право.\n— П. А. Кропоткинъ"
 LOADING_TIP_10:0 "Общество, государство и власть — три явленія непримиримо враждебныя.\n— П. А. Кропоткинъ"
 LOADING_TIP_11:0 "Революція — это открытое, насильственное разрушеніе однихъ учрежденій и созданіе другихъ.\n— П. А. Кропоткинъ"
 LOADING_TIP_12:0 "Справедливость безъ силы — безсильна; сила безъ справедливости — тиранія.\n— П. А. Кропоткинъ"
 LOADING_TIP_13:0 "Собственность — это кража.\n— П.-Ж. Прудонъ"
 LOADING_TIP_14:0 "Анархія — мать порядка.\n— П.-Ж. Прудонъ"
 LOADING_TIP_15:0 "Свобода — не дочь, а мать порядка.\n— П.-Ж. Прудонъ"
 LOADING_TIP_16:0 "Всякій эксплуатируемый достоинъ того, чтобы сбросить иго.\n— Э. Гольдманъ"
 LOADING_TIP_17:0 "Если бы не смѣлились надъ идеями, ихъ никогда не осуществляли бы.\n— Э. Гольдманъ"
 LOADING_TIP_18:0 "Самый большой грѣхъ противъ трудового народа — это покорность.\n— Э. Гольдманъ"
 LOADING_TIP_19:0 "Ни Бога, ни господина! — ни надъ собой, ни подъ собой.\n— Девизъ анархистовъ"
 LOADING_TIP_20:0 "Земля — крестьянамъ, фабрики — рабочимъ, власть — Совѣтамъ!\n— Н. И. Махно"
