l_english:
 # ================================================================
 #  Module "Iberian Fire and the Black International"
 # ================================================================

 # --- "Iberian Fire" event (July 1936) ---
 glp_spain.1.t:0 "IBERIAN FIRE"
 glp_spain.1.d:0 "GULYAI-POLE. Word comes from Barcelona: Catalonia has risen, the syndicates have risen, and over Iberia burns a fire that may yet be our own. The Nabat sounds in every station: the brothers are calling. The RPA units already whisper of a far expedition — over seas and mountains, toward the fire."
 glp_spain.1.a:0 "The brothers call! All for Catalonia!"
 glp_spain.1.b:0 "We will help in secret"
 glp_spain.1.c:0 "Our borders matter more"

 # --- The May Days in Barcelona (May 1937) ---
 glp_barcelona.1.t:0 "THE MAY DAYS IN BARCELONA"
 glp_barcelona.1.d:0 "BARCELONA. The factory meetings have turned to firefights, the firefights to street battles. On one side the free syndicates of CNT-FAI, on the other the NKVD commissars and the agents of PCE — and who wins will be decided in these days. Our contacts await the signal."
 glp_barcelona.1.a:0 "The Black International strikes first"
 glp_barcelona.1.b:0 "We move quietly"
 glp_barcelona.1.c:0 "Let the front decide"
 glp_barcelona.1.w:0 "We watch from the shadows"

 # --- News: the outcome of the May Days ---
 glp_barcelona.2.t:0 "THE POWER OF THE SYNDICATES"
 glp_barcelona.2.d:0 "BARCELONA. The KRO special group neutralised the NKVD agents before they could reach the train. The factories of Catalonia and Aragon are declared free, the militia holds the streets, and over Barcelona for the first time rises the black flag with the two acorns."
 glp_barcelona.2.a:0 "Freedom or death!"
 glp_barcelona.3.t:0 "THE STRONGER WORD — THE REGIMENTAL COMMISSAR"
 glp_barcelona.3.d:0 "BARCELONA. Our men pulled the agents out of the city ahead of schedule, but no open stroke was made: the RGHT survived, and CNT-FAI gained only a breather. The contacts report: the matter is not over, but the window narrows."
 glp_barcelona.3.a:0 "The matter is not over"
 glp_barcelona.4.t:0 "ORDER BY A FOREIGN HAND"
 glp_barcelona.4.d:0 "MOSCOW. Without our hand, Barcelona is given up: the May Days are crushed, the free militias dispersed, and the streets are filled with commissars. The ties with Gulyaipole are cut: the 'Makhnovist programs' are wound down, and the free press no longer writes of them."
 glp_barcelona.4.a:0 "So it turned out"
 glp_barcelona.5.t:0 "BARCELONA FALLS QUIET"
 glp_barcelona.5.d:0 "BARCELONA. The firefights die down before anyone could beat the alarm. The front remains a front, and Barcelona a city where the market trades again. But all know: the question of whose power is freer is not deferred forever."
 glp_barcelona.5.a:0 "We wait"

 # --- The Black Sea–Iberian Pact ---
 glp_bi.1.t:0 "THE BLACK SEA–IBERIAN PACT"
 glp_bi.1.d:0 "GULYAI-POLE. On neutral waters of the Black Sea the pact is signed: the Free Territory and the free syndicates of Iberia join forces. The 'Black International' is proclaimed: the coal of the Donbass and the bread of the steppe for the wolfram of Catalonia and the syndicalist workshops. From Gulyaipole to Barcelona — one free artery."
 glp_bi.1.a:0 "Free to the free!"

 # --- Faction name ---
 GLP_black_international_faction:0 "The Black International"

 # --- Category and decisions "The Spanish Route" ---
 GLP_spain_smuggling_routes:0 "The Spanish Route"
 GLP_spain_black_sea_run:0 "Black Sea Breakthrough"
 GLP_spain_black_sea_run_desc:0 "A convoy of 1500 rifles runs the Bosphorus. Chance of success — 65%. If the Regia Marina intercepts it, the convoy is lost and Rome delivers a note of protest."
 GLP_spain_balkan_underground_traffic:0 "Balkan Underground Traffic"
 GLP_spain_balkan_underground_traffic_desc:0 "Hidden delivery in small batches by train through Romania and Yugoslavia. Chance — 85%."
 GLP_spain_french_syndicate_smuggling:0 "French Syndicalist Smuggling"
 GLP_spain_french_syndicate_smuggling_desc:0 "The freight is carried over the Pyrenees by the French syndicalists over their own lines. Chance — 95%, plus warmer relations with the French left."
 GLP_spain_send_kro_group:0 "Send the KRO Special Group"
 GLP_spain_send_kro_group_desc:0 "Lev Zadov's group moves to Barcelona: to take out the NKVD and PCE agents before the May Days. Without this stroke the anarchists will not hold."
 GLP_spain_brigade_homecoming:0 "Homecoming of the Brigade"
 GLP_spain_brigade_homecoming_desc:0 "The volunteers of the RPAU brigade return from the Iberian front. Belash and Karetinik receive the trait 'Spanish Hardening'."
 GLP_spain_black_international_pact:0 "Black Sea–Iberian Pact"
 GLP_spain_black_international_pact_desc:0 "Found the faction 'The Black International' with Spain and grant mutual economic national spirits. Available after successful May Days, from 1938."

 # --- National spirits ---
 GLP_idea_spanish_brigade:0 "RPAU Volunteer Brigade"
 GLP_idea_spanish_brigade_desc:0 "The RPA units went to the Iberian front: volunteers enlist more readily, and the experience of street fighting stays with the regiments."
 GLP_idea_nabat_disloyal:0 "The Nabat Fell Silent"
 GLP_idea_nabat_disloyal_desc:0 "The Nabat network of contacts is disappointed by the refusal: rumor replaces testimony, and testimony replaces rumor. For 365 days."
 GLP_idea_catalan_wolfram_syndicate_workshops:0 "Catalan Wolfram and Syndicalist Workshops"
 GLP_idea_catalan_wolfram_syndicate_workshops_desc:0 "The wolfram of the Pyrenees and the workshops of Barcelona go to armaments: the arms factories work faster and research bolder. (In 1.19 a national spirit cannot grant resources — accounted by production bonuses.)"
 GLP_idea_ukrainian_coal_and_grain:0 "Ukrainian Coal and Grain"
 GLP_idea_ukrainian_coal_and_grain_desc:0 "The coal of the Donbass and the bread of the steppe go to Iberia: factories are built faster, but less is left for the home market. (In 1.19 a national spirit cannot grant resources — accounted by production bonuses.)"

 # --- Unit leader trait ---
 GLP_spanish_tempering:0 "Spanish Hardening"
 GLP_spanish_tempering_desc:0 "Returned from the Iberian front: street fighting, cavalry through the mountain passes. Organisation and reconnaissance — as in the May Days."

 # --- Opinion modifiers ---
 GLP_italian_protest_note:0 "Note of protest (convoy intercepted)"
 GLP_french_syndicalist_warmth:0 "French syndicalists carry our freight"
 GLP_spanish_syndicate_alliance:0 "Free Spain of the Syndicates"
 GLP_spanish_soviet_cold:0 "Soviet-line Barcelona"
 GLP_soviet_anarchy_resentment:0 "Resentment of anarchist interventionism"

 GLP_black_international_actions:0 "Black International"
 GLP_black_international_actions_desc:0 "Coordination of the worldwide liberation movement, mutual syndical aid, and the spread of anarchist ideals."
 GLP_bi_mutual_aid_initiative:0 "Mutual Aid Initiative"
 GLP_bi_mutual_aid_initiative_desc:0 "Direct exchange of resources and industrial support across free territories without capitalist market barriers."
 GLP_bi_international_brigades:0 "International Black Brigades"
 GLP_bi_international_brigades_desc:0 "Rallying volunteers, revolutionaries, and syndicalists worldwide to join the Revolutionary Insurgent Army."
 GLP_bi_support_french_underground:0 "Support French Syndicalist Underground"
 GLP_bi_support_french_underground_desc:0 "Provide resources and propaganda to workers and strike committees in France."
 GLP_bi_balkan_solidarity:0 "Balkan Free Communes Committee"
 GLP_bi_balkan_solidarity_desc:0 "Forge solidarity networks with agrarian and worker communes across Romania, Bulgaria, and Yugoslavia."

 GLP_idea_bi_mutual_aid:0 "Syndical Mutual Aid"
 GLP_idea_bi_mutual_aid_partner:0 "Black International Solidarity"

 glp_bi.2.t:0 "Wave of Strikes Across France"
 glp_bi.2.d:0 "Aided by the Black International, wildcat strikes and syndicalist demonstrations erupt across Paris, Marseille, and Lyon, demanding workers control."
 glp_bi.2.a:0 "Make concessions to the syndicates"
 glp_bi.2.b:0 "Deploy gendarmerie to disperse the strikes"

 glp_bi.3.t:0 "Envoys from Balkan Communes"
 glp_bi.3.d:0 "Delegations from underground peasant unions and socialist circles from Sofia and Bucharest arrive in Gulyaypole, offering volunteers and solidarity."
 glp_bi.3.a:0 "Welcome to the Free Steppe, comrades!"

 glp_bi.4.t:0 "Red Army Fugitives: Border Alert"
 glp_bi.4.d:0 "Commanders and soldiers fleeing internal purges in the USSR cross into Makhnovist lines, offering strategic intelligence in exchange for asylum."
 glp_bi.4.a:0 "Welcome seasoned fighters into the RIA and reinforce defenses"
 glp_bi.4.b:0 "Avoid escalation with Moscow: disarm and reassign to agrarian communes"
 GLP_bi_proclaim_federation:0 "Proclaim the Black International"
 GLP_bi_proclaim_federation_desc:0 "Formal consolidation of revolutionary communes, free trade unions, and anarchist forces into a unified anti-authoritarian alliance. 'Live free or die in the struggle for liberty!' — Batko Makhno."
 GLP_bi_send_tachanka_instructors:0 "Dispatch Tachanka Instructors"
 GLP_bi_send_tachanka_instructors_desc:0 "Dispatch seasoned cavalry veterans and machine gun crews to instruct allied volunteer formations in the art of fast-paced steppe mobility."
 GLP_bi_spanish_axis:0 "Iberian Bastion: Gulyaypole–Barcelona Axis"
 GLP_bi_spanish_axis_desc:0 "Consolidate an unbreakable pact with CNT-FAI and Free Catalonia: a direct maritime bridge of mutual solidarity spanning the Mediterranean."
 GLP_bi_latin_american_echo:0 "Transatlantic Route: FORA & Mexican Syndicalists"
 GLP_bi_latin_american_echo_desc:0 "Establish transoceanic maritime ties with the Argentine FORA workers' federation and Mexican syndicalists for trade and mutual solidarity."
 GLP_bi_strike_funds:0 "Finance Foreign Strike Committees"
 GLP_bi_strike_funds_desc:0 "Provide financial and logistical support to striking workers abroad, propagating anarchist principles and undermining imperialist rear areas."
 GLP_bi_renounce_indemnities:0 "Declaration on Non-Annexation and Anti-Imperialism"
 GLP_bi_renounce_indemnities_desc:0 "Solemn proclamation renouncing colonial indemnities and imperial conquests, affirming the unalienable right of every people to local self-governance. 'It is not the State that frees the people, but the people who free themselves' — Volin."

 glp_bi.4.c:0 "Mobilize Zadov's Counter-Intelligence: seize GPU files and weave an informant web"

 glp_bi.5.t:0 "Moscow Ultimatum: Extradition of Defectors"
 glp_bi.5.d:0 "An urgent dispatch signed by Stalin arrives from the Kremlin, labeling the defectors 'Trotskyite conspirators and traitors' and demanding immediate extradition under threat of severe repercussions."
 glp_bi.5.a:0 "The Steppe knows no betrayal and surrenders no fugitives! To arms!"
 glp_bi.5.b:0 "Zadov's Secret Route: stage their demise and smuggle them across to Spain"

 glp_bi.6.t:0 "Transatlantic Solidarity: Voices from Buenos Aires & Mexico"
 glp_bi.6.d:0 "Freighters laden with rubber and copper arrive in Black Sea ports carrying greetings from Argentina's FORA federation and Mexican anarcho-syndicalists, cheering the revolution in the South."
 glp_bi.6.a:0 "Long live the global brotherhood of free labor!"

 glp_bi.7.t:0 "Balkan Reverberations: Peasant Risings"
 glp_bi.7.d:0 "Inspired by leaflets distributed by the Black International, agrarian communes in Romania, Bulgaria, and Yugoslavia rise against landlord rule, demanding communal land and free soviets."
 glp_bi.7.a:0 "The Balkans cast off the chains of tyranny!"

 glp_sea.3.t:0 "Black Sea Incident: Guarding Crimean Fishermen"
 glp_sea.3.d:0 "Foreign patrol craft attempted to intercept Crimean fishing cooperatives and grain barges navigating peaceful coastal waters. The Revolutionary Navy must safeguard our people's sustenance."
 glp_sea.3.a:0 "Order Black Sea patrol boats to fire warning bursts!"
 glp_sea.3.b:0 "Resolve the confrontation peacefully through syndicate conciliation"

 GLP_idea_bi_mutual_aid_desc:0 "Direct coordination of syndicates and factories within the Black International without middlemen or market exploitation."
 GLP_idea_bi_mutual_aid_partner_desc:0 "Economic solidarity and raw material logistics supplied by the Free Territory of Gulyaypole."
