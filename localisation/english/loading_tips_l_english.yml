l_english:
 LOADING_TIP_1:0 "Liberty or death!\n— Motto of the Revolutionary Insurgent Army (Anarcho-Communists of the Bakunin school)"
 LOADING_TIP_2:0 "Power corrupts, and absolute power corrupts absolutely.\n— Mikhail Bakunin"
 LOADING_TIP_3:0 "The passion for destruction is at the same time a creative passion.\n— Mikhail Bakunin"
 LOADING_TIP_4:0 "Freedom without socialism is privilege and injustice; socialism without freedom is slavery.\n— Mikhail Bakunin"
 LOADING_TIP_5:0 "The State is the most flagrant, the most cynical negation of humanity.\n— Mikhail Bakunin"
 LOADING_TIP_6:0 "Mutual aid is as much a law of nature as mutual struggle.\n— Peter Kropotkin"
 LOADING_TIP_7:0 "Anarchy springs from the same Greek root as harmony.\n— Peter Kropotkin"
 LOADING_TIP_8:0 "The land is the common heritage, and the toiler has an inalienable right to it.\n— Peter Kropotkin"
 LOADING_TIP_9:0 "Society, the State and power are three irreconcilably hostile phenomena.\n— Peter Kropotkin"
 LOADING_TIP_10:0 "Property is theft.\n— Pierre-Joseph Proudhon"
 LOADING_TIP_11:0 "Anarchy is the mother of order.\n— Pierre-Joseph Proudhon"
 LOADING_TIP_12:0 "Liberty is not the daughter but the mother of order.\n— Pierre-Joseph Proudhon"
 LOADING_TIP_13:0 "The greatest sin against the working people is submission.\n— Emma Goldman"
 LOADING_TIP_14:0 "No God, no master — neither above us nor beneath us.\n— Anarchist motto"
 LOADING_TIP_15:0 "The land to the peasants, the factories to the workers, power to the soviets!\n— Nestor Makhno"
 LOADING_TIP_16:0 "We did not come to install a new power: we came to destroy it.\n— Nestor Makhno"
 LOADING_TIP_17:0 "Better to die free than live as a slave.\n— Nestor Makhno"
 LOADING_TIP_18:0 "Whoever toils enjoys the fruits — we recognise no other order.\n— Nestor Makhno"
 LOADING_TIP_19:0 "The free council decides for itself: neither masters nor commissars.\n— RIAU Declaration"
 LOADING_TIP_20:0 "Not one step from the free land: the steppe shall not be surrendered.\n— RIAU Declaration"
 LOADING_TIP_21:0 "Where the machine-gun is, there is the liberty of the working people.\n— Tachanka motto"
 LOADING_TIP_22:0 "Equality without liberty is a barracks; liberty without equality is privilege.\n— Voline"
 LOADING_TIP_23:0 "Only labour gives the right to life; only struggle gives the right to liberty.\n— Voline"
 LOADING_TIP_24:0 "Revolutions are made by the masses, not by leaders.\n— Voline"
 LOADING_TIP_25:0 "Whoever wants liberty must be ready to defend it, rifle in hand.\n— Peter Arshinov"
 LOADING_TIP_26:0 "Discipline must be conscious, not enforced by the stick.\n— Peter Arshinov"
