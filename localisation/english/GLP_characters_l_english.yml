 # Country Leader Traits
 batko_makhno:0 "Batko Makhno"
 batko_makhno_desc:0 "The undisputed leader of the insurgent movement who forged peasants, workers, and cavalrymen into an invincible army of liberty. A genius of guerrilla warfare who inspires terror in enemies and boundless devotion in comrades."

 # General / Field Marshal Traits (unit leader traits, /common/unit_leader/)
 GLP_tachanka_commander:0 "Tachanka Commander"
 GLP_tachanka_commander_desc:0 "Master of machine-gun cart tactics, turning the open steppe into a lethal killing ground for the enemy."
 GLP_guerilla_master:0 "Guerrilla Master"
 GLP_guerilla_master_desc:0 "A legend of irregular warfare who transforms every village and ravine into an impregnable fortress."
 GLP_steppe_raider:0 "Steppe Raider"
 GLP_steppe_raider_desc:0 "A commander of deep mounted raids whose columns advance where staff maps show nothing at all."

 # Country Leader Traits (continued)
 GLP_inspirational_leader:0 "Inspirational Leader"
 GLP_inspirational_leader_desc:0 "Batko speaks the peasant's own language, and whole villages harness their carts to follow the black banner."
 GLP_panic:0 "Panic"
 GLP_panic_desc:0 "Makhno's lightning decisions terrify the enemy, but the army's feverish dashes erode order in the rear."

 # Political Advisor Traits
 anarchist_organizer:0 "Free Communes Organizer"
 anarchist_organizer_desc:0 "A gifted administrator who organizes economic life without state coercion through voluntary cooperation."
 GLP_operational_planner:0 "Chief of Staff: Operational Planner"
 GLP_operational_planner_desc:0 "The movement's chief tactician and cartographer, whose staff work turns peasant detachments into a manageable army."
 GLP_head_of_intelligence:0 "Head of Intelligence: Silent Workhorse"
 GLP_head_of_intelligence_desc:0 "The Counter-Intelligence Department works without noise or publicity, yet knows more about the enemy than his own staff does."
 counter_intelligence_expert:0 "Counter-Intelligence Expert"
 counter_intelligence_expert_desc:0 "A legendary spymaster and head of army intelligence whose agent network penetrates deep behind enemy lines."
 free_soviets_minister:0 "Minister of Education: Free Soviets"
 free_soviets_minister_desc:0 "An inspiring anarcho-communist propagandist whose fiery speeches strengthen the people's spirit and accelerate the building of a free society."
 GLP_soviet_military_mission:0 "Soviet Military Mission"
 GLP_german_military_mission:0 "German Military Mission"
 GLP_british_naval_mission:0 "British Naval Mission"
 GLP_soviet_mission_advisor:0 "Soviet Military Mission"
 GLP_german_mission_advisor:0 "German Military Mission"
 GLP_british_naval_advisor:0 "British Naval Mission"
 GLP_soviet_mission_doctrine:0 "Deep Battle Doctrine"
 GLP_soviet_mission_doctrine_desc:0 "Red commanders share deep-operations know-how with the RIA: cheaper doctrine, faster planning."
 GLP_german_mission_drill:0 "Prussian Drill"
 GLP_german_mission_drill_desc:0 "Reichswehr instructors drill the insurgent regiments: breakthrough and offensive power grow."
 GLP_british_naval_drill:0 "Royal Naval Drill"
 GLP_british_naval_drill_desc:0 "British officers run the Black Sea fleet service: cheaper naval doctrine, better coordination."
 GLP_bogdan_dybets:0 "Bohdan Dybets"
 GLP_bogdan_dybets_desc:0 "An old Gulyaypole commander from the first soviet days. Batko's opponent at the peasant assembly, yet a reliable infantry organiser within the Insurgent Army."
 GLP_aleksey_dybets:0 "Oleksiy Dybets"
 GLP_aleksey_dybets_desc:0 "A young cavalry commander from the numerous Dybets family. Fast in the raid, swift in manoeuvre — he stakes everything on lightning strikes into enemy rear areas."
 GLP_feodosiy_kozhin:0 "Feodosiy Kozhin"
 GLP_feodosiy_kozhin_desc:0 "A steppe commander of the old school, a peasant anarchist. Harsh to the enemy and to his men alike, a master of ambush in the Black Sea gullies."

 GLP_nikolai_skoblin:0 "Nikolai Skoblin"
 GLP_nikolai_skoblin_desc:0 "A former White cavalry general in exile. A pragmatic ally of Batko — and a standing source of distrust in the staff."
 GLP_anton_turkul:0 "Anton Turkul"
 GLP_anton_turkul_desc:0 "An infantry general of the Volunteer Army, blunt and hard. His brigades fight like Civil War veterans."
 GLP_grigory_semyonov:0 "Grigory Semyonov"
 GLP_grigory_semyonov_desc:0 "A Cossack ataman in exile. A steppe commander of the old imperial school who settles matters with a sabre and a raid."
 GLP_white_emigre:0 "White Emigre"
 GLP_white_emigre_desc:0 "An officer of the old army: better drill, higher supply cost, and a political price for the alliance."
 GLP_white_emigre_favored:0 "Staff Confidence"
 GLP_white_emigre_favored_desc:0 "Batko backed the White commanders — their field authority grew, the communes mutter."
 GLP_white_emigre_sidelined:0 "Watched by Makhnovists"
 GLP_white_emigre_sidelined_desc:0 "The emigres have been clipped. The staff is calmer; the blow is weaker."
 GLP_lavr_kornilov:0 "Lavr Kornilov"
 GLP_lavr_kornilov_desc:0 "The legend of the Ice March and the Volunteer Army. Beneath the black banner his shock troops storm onward once more — the finest officer cadres of the old army."
 GLP_mikhail_drozdovsky:0 "Mikhail Drozdovsky"
 GLP_mikhail_drozdovsky_desc:0 "The iron colonel. His riflemen neither retreat nor rout: officer-guard discipline sworn to the free steppe."
 GLP_ice_march:0 "Ice March"
 GLP_ice_march_desc:0 "The glacial victorious campaign hardened the army: cavalry and breakthroughs are his element. But faith in the bayonet costs more than any plan."
 GLP_white_legend:0 "Legend of the Volunteer Army"
 GLP_white_legend_desc:0 "The Volunteer Army is a myth worth dying for. Organisation and morale rise, but its cadres are honed for a single trade: the offensive."
 GLP_iron_discipline:0 "Iron Discipline"
 GLP_iron_discipline_desc:0 "Drozdovsky's lines stand in defence as if rooted; the price is stiffness in the attack."
 GLP_last_stand:0 "The Last Battalion"
 GLP_last_stand_desc:0 "Husbands men and cartridges for the final battle — manoeuvre is traded for frugality."
