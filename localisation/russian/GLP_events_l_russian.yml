 GLP_mobilize_black_guard_reserves:0 "Мобилизация резервов Черной Гвардии"
 GLP_conduct_cavalry_partisan_raid:0 "Кавалерийский рейд по тылам"
 GLP_commission_armored_train:0 "Строительство бронепоезда «Свобода или Смерть»"
 GLP_send_brigade_to_cnt_fai:0 "Отправка добровольческого корпуса CNT-FAI"
 GLP_establish_dnieper_partisan_camps:0 "Партизанские базы в плавнях Днепра"
