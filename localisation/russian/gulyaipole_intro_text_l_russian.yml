 GULYAIPOLE_EPIC_INTRO_TEXT:0 "В реальной истории этот человек должен был сгореть от чахотки в сырой парижской эмиграции ещё в 1934 году, оставив после себя лишь горькие воспоминания о несбывшихся надеждах, изломанные тачанки и пожелтевшие страницы мемуаров. Его Вольная республика на юге Украины была стерта с лица земли жерновами братоубийственной бойни, не найдя себе места в мире жестких тоталитарных империй.\n\nНо история — не прямая дорога. Это степь, где ветер может переменить направление в одно мгновение.\n\nНа дворе 1936 год.\n\nВ Гуляй-Поле черные знамена вновь трепещут на холодном осеннем ветру. Нестор Иванович Махно, переживший свой смертный приговор, с упрямым блеском в глазах смотрит на карты охваченной кризисом Европы. Вольная Анархическая Республика возродилась из пепелища гражданской войны, окруженная со всех сторон враждебными гигантами. С севера навис индустриальный молох сталинского СССР, жаждущий исправить ошибки прошлого. С запада и юга ползут тени фашистских и милитаристских режимов, а бывшие белогвардейцы в изгнании точат сабли в ожидании реванша.\n\nМир стремительно катится к новой, еще более страшной Второй мировой войне. И в этом котле крошечной, но несгибаемой республике предстоит сделать выбор, который потрясет основы глобального порядка.\n\nЧто ждет Гуляй-Поле? Какую дорогу выберет «Батько» и его соратники?\n\n§Y• Союз с прагматичным дьяволом:§! Примкнуть к Германии, попытавшись сыграть на противоречиях великих держав ради выживания молодой вольной коммуны.\n\n§Y• Красный реванш:§! Пойти на временный, полный горькой иронии компромисс с Москвой, направив общую мощь против наступающего фашизма.\n\n§Y• Западный вектор:§! Обратиться за поддержкой к демократиям Англии и Франции, пытаясь доказать им право анархии на существование.\n\n§Y• Или — «Вольному Воля»?§! Отбросить все геополитические расчёты, гордо объявить войну обоим полюсам старого мира и бросить клич по всему земному шару. Призвать под черные знамена добровольцев со всех уголков планеты — бывших белых офицеров, разочарованных социалистов, свободных художников, рабочих и анархистов.\n\nКрестьянские тачанки снова выкатываются на просторы Дикого Поля. Пулеметы «Максим» починены, а черные папахи надвинуты на брови.\n\nМир погружается во тьму, но в самом сердце степи горит огонь, который никому не удается потушить. Ведите Гуляй-Поле к свободе — или погибните вместе с ней."
 GULYAIPOLE_START_BUTTON:0 "Вольному воля!"
 GULYAIPOLE_INTRO_TITLE:0 "Гуляй-Поле: Вольная Территория"
