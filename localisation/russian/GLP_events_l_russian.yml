l_russian:
 # Государственные и всемирные новости Гуляйполя
 glp_news.1.t:0 "ВОЗРОЖДЕНИЕ ВОЛЬНОГО ГУЛЯЙ-ПОЛЯ"
 glp_news.1.d:0 "ГУЛЯЙ-ПОЛЕ. В причерноморских степях и на индустриальных гигантах Донецкого бассейна возобновила деятельность Вольная Территория под началом Батьки Махно и Революционной Повстанческой Армии (РПА). Свободные крестьянские коммуны и фабричные комитеты взяли под контроль юг, провозгласив общество без господ и готовность защищать свободу силой оружия."
 glp_news.1.a:0 "Свобода или Смерть! Анархия — мать порядка!"

 glp_news.2.t:0 "IV СЪЕЗД ВОЛЬНЫХ КРЕСТЬЯН И РАБОЧИХ"
 glp_news.2.d:0 "ГУЛЯЙ-ПОЛЕ. Делегаты сотен крестьянских коммун, шахт Донбасса и полков Черной Гвардии единогласно провозгласили Федерацию Вольных Советов. Любая государственная власть объявлена вне закона, земля передана в общее пользование тружеников, а заводы — фабричным комитетам."
 glp_news.2.a:0 "Да здравствует вольный строй!"

 glp_news.3.t:0 "ЛЕГЕНДАРНЫЕ ТАЧАНКИ ВЫХОДЯТ В СТЕПЬ"
 glp_news.3.d:0 "ГУЛЯЙ-ПОЛЕ. В мастерских Екатеринослава и хуторах степи развернуто массовое производство знаменитых пулеметных повозок. Сочетание небывалой огневой мощи станковых пулеметов и скорости лихой конницы вновь делает РПА грозой любых интервентов."
 glp_news.3.a:0 "Степь принадлежит свободным!"

 glp_news.4.t:0 "ОБРАЗОВАНИЕ ЧЕРНОГО ИНТЕРНАЦИОНАЛА"
 glp_news.4.d:0 "ГУЛЯЙ-ПОЛЕ. В Гуляйполе прибывают делегации синдикалистов и анархистов со всей Европы и мира. Провозглашено создание Черного Интернационала — боевого союза против мирового капитала, фашизма и тоталитарных диктатур."
 glp_news.4.a:0 "Пламя революции не угаснет!"

 glp_news.5.t:0 "НОВЫЙ ВНЕШНЕПОЛИТИЧЕСКИЙ АЛЬЯНС ГУЛЯЙ-ПОЛЯ"
 glp_news.5.d:0 "ГУЛЯЙ-ПОЛЕ. РевВоенСовет Вольной Территории ратифицировал международный договор о военном союзе и взаимных поставках вооружений, укрепив стратегические позиции повстанческого движения на международной арене."
 glp_news.5.a:0 "Враг будет разбит!"

 glp_news.6.t:0 "ТРИУМФ ВОЛЬНОГО НАРОДА"
 glp_news.6.d:0 "ГУЛЯЙ-ПОЛЕ. Вольная Территория доказала миру несокрушимость безгосударственного братства трудящихся. Повстанческая армия сломала хребет врагам свободы, открыв новую эру всеобщего освобождения человечества."
 glp_news.6.a:0 "Слава Батьке Махно и вольному народу!"

