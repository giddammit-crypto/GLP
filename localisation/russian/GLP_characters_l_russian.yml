 # Country Leader Traits
 batko_makhno:0 "Батько Махно"
 batko_makhno_desc:0 "Непререкаемый вождь повстанческого движения, объединивший вольных крестьян, рабочих и кавалеристов в несокрушимую армию свободы. Гений партизанской войны, внушающий ужас врагам и беззаветную преданность соратникам."

 # General / Field Marshal Traits
 tachanka_commander:0 "Командир тачанок"
 tachanka_commander_desc:0 "Мастер тактики пулеметных повозок, превращающий степной простор в смертоносную ловушку для противника."
 cavalry_expert:0 "Кавалерийский эксперт"
 cavalry_expert_desc:0 "Непревзойденный знаток конного дела, способный выжать из кавалерийских частей максимум скорости и ударной мощи."
 aggressive_assaulter:0 "Стремительный штурмовик"
 aggressive_assaulter_desc:0 "Командир, ведущий бойцов в атаку с неудержимым порывом, ломая любую оборону стремительным натиском."
 guerilla_master:0 "Мастер партизанской войны"
 guerilla_master_desc:0 "Легенда иррегулярной войны, превращающая каждый населённый пункт и каждую балку в неприступную крепость."

 # Political Advisor Traits
 anarchist_organizer:0 "Организатор Вольных Коммун"
 anarchist_organizer_desc:0 "Талантливый администратор, способный наладить работу экономики без государственного принуждения через добровольную кооперацию."
 counter_intelligence_expert:0 "Мастер контрразведки"
 counter_intelligence_expert_desc:0 "Легендарный разведчик и начальник особой разведки армии, чья агентурная сеть пронизывает тылы противника."
 free_soviets_minister:0 "Идеолог Вольных Советов"
 free_soviets_minister_desc:0 "Вдохновенный пропагандист анархо-коммунизма, чьи пламенные речи укрепляют дух народа и ускоряют строительство свободного общества."
