l_russian:
 GLP_black_guard_legacy:0 "Наследие Черной Гвардии"
 GLP_black_guard_legacy_desc:0 "Черная гвардія помнитъ и Перегоновку, и Крымскій походъ: на своей землѣ повстанецъ дерется за троихъ и въ окопъ садится крѣпко. Зато обозъ у насъ мужицкій — за чужими межами армія быстро остается безъ хлѣба и патроновъ."
 GLP_free_syndicates_and_soviets:0 "Вольные Синдикаты и Советы"
 GLP_free_syndicates_and_soviets_desc:0 "Ни казенной палаты, ни хозяина: заводъ ведетъ фабричный комитетъ, село — вольный сходъ, а споръ рѣшаетъ не начальство, а сосѣди. Работа спорится, и лишняго чиновника кормить не приходится."
 GLP_hostile_encirclement:0 "Враждебное окружение"
 GLP_hostile_encirclement_desc:0 "Кругомъ насъ — то бѣлый, то красный, то панъ, и всѣ сулятъ намъ порядокъ на своемъ штыкѣ. Народъ отъ такого сулёнаго порядка только злѣе: чужому агитатору у насъ вѣры нѣтъ, а гарнизону — подмога отъ всякаго двора."

 GLP_idea_federation_of_free_soviets:0 "Федерация Вольных Советов"
 GLP_idea_federation_of_free_soviets_desc:0 "Прямая демократия и низовое самоуправление обеспечивают высокую производительность труда."
 GLP_idea_communes_empowerment:0 "Укрепление Коммун"
 GLP_idea_communes_empowerment_desc:0 "Быстрое восстановление производственных цепочек силами сознательных рабочих."
 GLP_idea_black_international:0 "Черный Интернационал"
 GLP_idea_black_international_desc:0 "Готовность отправлять добровольческие бригады на помощь революциям по всему миру."
 GLP_idea_world_anarchy:0 "Пламя Мировой Анархии"
 GLP_idea_world_anarchy_desc:0 "Идейная решимость покончить с империализмом и властью капитала во всем мире."

