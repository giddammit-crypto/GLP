 GLP_GATHERING_STORM_DESC:0 "Гуляйполе, зима 1936 года.\n\nСемнадцать лет вольная степь живёт без помещиков, фабрикантов и комиссаров. Между Днепром и Доном раскинулась федерация вольных советов и крестьянских общин под защитой Революционной Повстанческой Армии Батьки Махно.\n\nВокруг сгущаются тучи: Москва, Берлин и Варшава точат клыки на хлебные степи и заводы Донбасса. Но Чёрная гвардия готова к бою: земля — крестьянам, фабрики — рабочим, а воля — никому не отдаётся!"
 GLP_MOTTO_1:0 "Анархия — мать порядка"
 GLP_MOTTO_2:0 "Свобода или смерть!"
 GLP_MOTTO_3:0 "Земля — крестьянам, фабрики — рабочим"

