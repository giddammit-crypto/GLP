 # RevVoenSovet ideas (added by audit)
 GLP_idea_revvoensovet_partisan_command:0 "RevVoenSovet Partisan Command"
 GLP_idea_revvoensovet_partisan_command_desc:0 "Headquarters coordinates scattered detachments by telegraph and mounted courier: plans appear fast, but lack depth."
 GLP_idea_revvoensovet_total_preparedness:0 "Total Preparedness"
 GLP_idea_revvoensovet_total_preparedness_desc:0 "Every village keeps a tachanka, a horse and a rifle ready — the army mobilizes in days, at the cost of calm in the rear."
 GLP_idea_free_will:0 "To Each Their Own Freedom"
 GLP_idea_free_will_desc:0 "Gulyaypole charts its own destiny."
 GLP_idea_white_volunteers:0 "European Volunteer Regiments"
 GLP_idea_white_volunteers_desc:0 "Veterans of every army rally to the black flag."
 GLP_idea_international_brigades:0 "International Brigades"
 GLP_idea_international_brigades_desc:0 "Volunteers from across the world fight for the free steppe."
 GLP_idea_black_cross_aid:0 "Black Cross Network"
 GLP_idea_black_cross_aid_desc:0 "Anarchist mutual aid feeds its factories and arsenals."
 GLP_idea_makhno_myth:0 "The Makhno Myth"
 GLP_idea_makhno_myth_desc:0 "The legend of the Batko lifts morale and resolve."

 GLP_idea_white_emigre_officers:0 "Emigre Officer Corps"
 GLP_idea_white_emigre_officers_desc:0 "White cadres lift cavalry and infantry punch, but drain political power every day and anger the anarchists."

 GLP_idea_moscow_grain_tribute:0 "Grain Tribute to Moscow"
 GLP_idea_moscow_grain_tribute_desc:0 "Communes ship grain for a delay of war. The rear goes hungry and the soviets grumble."
 GLP_idea_partisan_camps_timed:0 "Floodplain Camps"
 GLP_idea_partisan_camps_timed_desc:0 "Temporary bases in the Dnieper reeds cover the rear and feed reconnaissance."

 GLP_idea_makhno_illness:0 "The Batko's Illness"
 GLP_idea_makhno_illness_desc:0 "Tuberculosis floors Makhno. The soviets argue and the staff loses the thread."
 GLP_idea_occupied_kiev_soviet:0 "Kiev Free Soviet"
 GLP_idea_occupied_kiev_soviet_desc:0 "A soviet is raised in occupied Kiev — compliance grows at the price of bread."

 GLP_idea_recognized_border:0 "A Recognized Border"
 GLP_idea_recognized_border_desc:0 "At least one power has stood surety for the Free Territory. The ring has loosened, but the exchanges still treat the steppe as a stranger."
 GLP_idea_isolated_resistance:0 "Isolationist Resistance"
 GLP_idea_isolated_resistance_desc:0 "The pact was refused, so we hold out alone. Garrisons dig deeper and the villages stand with the insurgents, but goods grow dearer and political power fades: we have no foreign friends left."
# ── New ideas: Spanish Scenario ─────────────────────────────────────────
 GLP_voice_of_aragon:0 "Voice of Aragon"
 GLP_voice_of_aragon_desc:0 "Andres Nin is a living symbol that the NKVD can be beaten. His presence in Gulyaipole gives the anarchist movement political and theoretical momentum."
 GLP_international_support:0 "International Solidarity"
 GLP_international_support_desc:0 "Emma Goldman's visit drew the eyes of the world. Volunteers are arriving, the press is writing, and the Free Territory for the first time becomes a symbol of living anarchism."
 GLP_black_international_member:0 "Member of the Black International"
 GLP_black_international_member_desc:0 "Gulyaipole, syndicalist Spain and the French CGT are formally united. The Black International is a real force, not a declaration."
 GLP_spanish_veterans:0 "Spanish Veterans"
 GLP_spanish_veterans_desc:0 "CNT-FAI cadres have passed through the street battles of Barcelona, the defence of Madrid and the mountain crossings of Aragon. Their experience is now in the ranks of the Black Guard."
 GLP_aragon_collective_model:0 "Aragonese Collective Model"
 GLP_aragon_collective_model_desc:0 "Reports from Aragon confirm: anarcho-collectivism works. The Tavrian communes are adopting the methods: self-governance, rotation, mutual aid."
GLP_equal_soviet_partnership:0 "Equal Soviet Pact"
 GLP_equal_soviet_partnership_desc:0 "The Kharkov Pact II was concluded on equal terms without political commissars or Cheka agents. The Red Army and Insurgent Army coordinate headquarters while maintaining full internal autonomy."
 GLP_soviet_heavy_industry_support:0 "Soviet Heavy Industry Support"
 GLP_soviet_heavy_industry_support_desc:0 "Machinery from Kharkov and Leningrad, alongside coal and iron shipments, have established heavy defence production in Gulyaipole."
 GLP_krupp_rearmament:0 "Krupp Arms Rearmament"
 GLP_krupp_rearmament_desc:0 "Heavy German anti-tank guns and armoured cars have been integrated into the Black Guard divisions, boosting firepower significantly."
 GLP_german_anarchist_cadres:0 "German Anarcho-Syndicalists (FAUD)"
 GLP_german_anarchist_cadres_desc:0 "Rescued FAUD unionists and Berlin anti-fascist underground activists share underground warfare and engineering expertise with the Free Territory."
 GLP_black_sea_admiralty:0 "Black Sea Syndicalist Admiralty"
 GLP_black_sea_admiralty_desc:0 "British naval cooperation and convoy deliveries reinforce Black Sea sea-lanes, making Odessa and Berdyansk robust naval bastions."
 GLP_british_trade_union_solidarity:0 "British Trade Union Solidarity"
 GLP_british_trade_union_solidarity_desc:0 "Direct alliance with British trade unions secures steady supplies and political protection across the Western democracies."
