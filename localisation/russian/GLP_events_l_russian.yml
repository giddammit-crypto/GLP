 # ---------------------------------------------------------------------------
 #  Вступительная газета новой партіи
 # ---------------------------------------------------------------------------
 glp_news.100.t:0 "§WВОЛЬНЫЙ ГОЛОСЪ ГУЛЯЙ-ПОЛЯ: грядетъ гроза надъ вольной степью§!"
 glp_news.100.d:0 "§WГуляйполе, 1 января 1936 года. Альтернативная исторія.\n\nВосемнадцать лѣтъ тому назадъ, въ огнѣ 1917 года, надъ Приазовскою степью поднялось черное знамя. Бѣлые полки, гетманская варта, нѣмецкій штыкъ и красный комиссаръ по очереди сулили здѣшнему мужику порядокъ — и по очереди уходили ни съ чѣмъ.\n\nВопреки всему, что писали въ учебникахъ, Революціонная Повстанческая Армія (Анархо-Коммунисты Бакунинскаго толка) не была разбита. Ни Перекопъ 1920 года, ни чекистская облава 1921-го, ни голодные годы не смогли добить вольное повстанчество. Къ 1925 году Москва, обезкровленная войною и мятежами, подписала съ Гуляйполемъ то, чего не подписывала ни съ кѣмъ: договоръ о вольной территоріи.\n\nСъ той поры между Днѣпромъ, Дономъ и Крымомъ стоитъ Вольная Республика Гуляйполе — весь Югъ бывшей Россійской имперіи, отбитый у всѣхъ правительствъ разомъ. Здѣсь нѣтъ ни помѣщика, ни министра: заводомъ правитъ фабричный комитетъ, селомъ — вольный сходъ, а Батько Махно по старой памяти зовется совѣтчикомъ трудового народа, а не вождемъ.\n\nНо міръ снова точитъ штыкъ. Москва считаетъ нашъ хлѣбъ и уголь своими, Берлинъ мѣряетъ нашу степь по своей картѣ, Варшава глядитъ на переправы. Большая война уже стучится въ ворота — и какую сторону выберетъ Несторъ Ивановичъ, рѣшать тебѣ.§!"
 glp_news.100.a:0 "Да грянетъ Громъ!"
 glp_news.100.b:0 "Батьку рано списали со счетовъ…"
 glp_news.100.c:0 "Странное государство безъ правительства"

 # --------------------------------------------------------------------
 #  Локализация событий, отсутствовавшая до аудита (этап 5)
 # --------------------------------------------------------------------
 glp.1.t:0 "Совет Революционного Военного Комитета"
 glp.1.d:0 "В штабе РПА собрался совет командиров и делегатов коммун. Решения принимаются сообща — и исполняются без промедления."
 glp.1.a:0 "Так порешил вольный сход"
 glp.2.t:0 "Сход вольных коммун"
 glp.2.d:0 "Делегаты сёл и заводских комитетов съехались в Гуляйполе, чтобы сверить хозяйственные дела и уладить споры без чиновников."
 glp.2.a:0 "Порядок держится на согласии"
 glp.3.t:0 "Пополнение в повстанческую армию"
 glp.3.d:0 "Из хуторов и шахтёрских посёлков в полки Чёрной Гвардии прибыли новые добровольцы — с собственными конями и отцовскими винтовками."
 glp.3.a:0 "Принять братьев в строй"
 glp.10.t:0 "Делегация CNT-FAI прибыла в Гуляйполе"
 glp.10.d:0 "ГУЛЯЙ-ПОЛЕ. Испанские анархо-синдикалисты из CNT-FAI сошли с поезда под чёрными знамёнами, и духовой оркестр играл им «Свобода или смерть». Гости привезли опыт барселонских рабочих коллективов и просьбу о помощи — а вместе с ней предложение обменяться инженерами и оружейными чертежами."
 glp.10.a:0 "Братьям по борьбе — наших добровольцев"
 glp.10.b:0 "Возьмём у Барселоны заводскую науку"
 glp.11.t:0 "Степные манёвры тачаночных отрядов"
 glp.11.d:0 "ЕКАТЕРИНОСЛАВЩИНА. На выжженной солнцем равнине пять сотен тачанок разыграли встречный бой. Пулемётные повозки заходили во фланг, разворачивались на скаку и уходили из-под удара быстрее, чем противник успевал развернуть батарею. Штаб Белаша исписал наблюдениями три тетради."
 glp.11.a:0 "Учить войска так, как будем воевать"
 glp.11.b:0 "Раздать полкам новые винтовки"
 glp.12.t:0 "ДнепроГЭС даёт ток вольным мастерским"
 glp.12.d:0 "ЗАПОРОЖЬЕ. Турбины днепровской станции вышли на полную мощность. Ток пошёл не в столичные ведомства, а в кузницы, мельницы и оружейные мастерские Вольной территории. Инженеры спорят: ставить ли новые цеха — или сперва вложиться в электрическую науку."
 glp.12.a:0 "Ставить цеха у самой плотины"
 glp.12.b:0 "Вложиться в электротехническую науку"
 glp.13.t:0 "Донбасс: угольные синдикаты объединяются"
 glp.13.d:0 "ЮЗОВКА. Шахтёрские комитеты Донецкого бассейна свели свои артели в один вольный синдикат. Уголь пойдёт по единому наряду — но распоряжаться им будут сами забойщики, а не управляющие. Военный совет просит долю на оружейные заводы."
 glp.13.a:0 "Уголь — оружейным мастерским"
 glp.13.b:0 "Прибыль — обратно в шахтёрские посёлки"
 glp.14.t:0 "Тяжёлый бронепоезд выведен из депо"
 glp.14.d:0 "ЕКАТЕРИНОСЛАВ. В депо закончили сборку тяжёлого бронепоезда: клёпаная броня, орудийная башня, пулемётные казематы и вагон-мастерская. На борту белой краской выведено «Свобода или смерть». Машинисты клянутся, что дотянут состав хоть до Варшавы."
 glp.14.a:0 "Пусть степь услышит его гудок"
 glp.15.t:0 "Великая осенняя ярмарка в Гуляйполе"
 glp.15.d:0 "ГУЛЯЙ-ПОЛЕ. На ярмарку съехались подводы со всей степи: хлеб, кони, кожа, донецкий уголь и крымская соль. Ни акциза, ни урядника — только вольный торг и договор по рукам. Молодёжь после торгов записывается в полки целыми улицами."
 glp.15.a:0 "Ярмарка кормит и мирит"
 glp.15.b:0 "Записать добровольцев на месте"
 glp.16.t:0 "Севастополь: возрождение революционного флота"
 glp.16.d:0 "СЕВАСТОПОЛЬ. Матросские комитеты подняли из отстоя корабли, брошенные всеми правительствами разом. Котлы перебраны, орудия расконсервированы. Черноморская вольница снова выходит в море — вопрос лишь в том, строить ли верфь или сперва учить команды."
 glp.16.a:0 "Заложить верфь в Севастополе"
 glp.16.b:0 "Сперва выучить команды"
 glp.17.t:0 "Батько объезжает передовые заставы"
 glp.17.d:0 "ФРОНТОВАЯ ПОЛОСА. Махно проехал по заставам от Днепра до Дона — без охраны, на тачанке, ночуя у костров вместе с бойцами. Там, где он побывал, ротные книги пополняются добровольцами, а разговоры о «замирении с Москвой» стихают сами собой."
 glp.17.a:0 "Слово Батьки крепче приказа"
 glp.17.b:0 "Обратить поездку в сходы и агитацию"
 glp.18.t:0 "Вольные коммуны собрали небывалый урожай"
 glp.18.d:0 "ТАВРИЯ. Сельские коммуны отчитались перед сходом: хлеба хватит и на прокорм, и на запас, и на обмен с городом. Спорят о главном — раздать ли излишек по дворам или пустить его в общий фонд под новые мастерские."
 glp.18.a:0 "Раздать по дворам — пусть народ крепнет"
 glp.18.b:0 "Пустить излишек на мастерские"
 glp.19.t:0 "Радиостанция «Голос Воли» вышла в эфир"
 glp.19.d:0 "ГУЛЯЙ-ПОЛЕ. Над крышей бывшей земской управы поднялась радиомачта. Первую передачу — обращение к трудящимся всего света — слушали в Харькове, Ростове и, если верить перехватам, даже в Варшаве. Теперь спорят, что нести в эфир: правду о вольном строе или сводки для войск противника."
 glp.19.a:0 "Нести миру слово о вольном строе"
 glp.19.b:0 "Вещать на войска противника"
 glp.20.t:0 "Военный совет РевВоенСовета"
 glp.20.d:0 "ГУЛЯЙ-ПОЛЕ. Белаш разложил карты юга: рельсовые узлы, переправы, балки, где укроется полк. Каретник требует конных корпусов, Щусь — свободы рейда, Задов — разведки. Сходятся в одном: воевать по-своему, а не по чужим уставам."
 glp.20.a:0 "Утвердить собственную конную доктрину"
 glp.20.b:0 "Учиться на манёврах, а не на бумаге"
 glp.21.t:0 "Контрразведка Задова накрыла агентурную сеть"
 glp.21.d:0 "ЕКАТЕРИНОСЛАВ. Разведывательно-заградительный отдел взял всю цепочку: явочные квартиры, шифры, курьеров и склад с оружием. Задов доложил сходу коротко: «Работали чисто, шума не будет». Сход постановил трофеи раздать в полки."
 glp.21.a:0 "Огласить дело на сходе"
 glp.21.b:0 "Забрать склад в полки"
 glp.22.t:0 "Формируется эскадрилья «Чёрный буревестник»"
 glp.22.d:0 "СТЕПНОЙ АЭРОДРОМ. Самолёты, собранные из трофеев и купленных по частям машин, сведены в первую вольную эскадрилью. Лётчики — вчерашние механики и кавалеристы, на килях выведена буква «А» в круге. Спорят: гнаться ли за новыми машинами или строить аэродромы."
 glp.22.a:0 "Догонять век — нужны новые машины"
 glp.22.b:0 "Сперва аэродромы и мастерские"
 glp.23.t:0 "Съезд вольной мысли в Екатеринославе"
 glp.23.d:0 "ЕКАТЕРИНОСЛАВ. Волин собрал публицистов, учителей и делегатов коммун: три дня спорили о том, как жить без государства и не скатиться к новой власти. Итог напечатали в брошюре, которую разобрали до последнего листа."
 glp.23.a:0 "Печатать и раздавать по коммунам"
 glp.23.b:0 "Обратить учёный спор в дело"
 glp.24.t:0 "Юбилей безгосударственной республики"
 glp.24.d:0 "ГУЛЯЙ-ПОЛЕ. Вольная территория празднует годовщину: на площади — тачанки в парадном строю, оркестр, столы на всю улицу. За эти годы её хоронили трижды, а она стоит — без царя, без комиссара и без хозяина."
 glp.24.a:0 "Слава вольному народу!"
 glp_cnt_bonus:0 "Опыт барселонских коллективов"
 glp_electrification:0 "Электрификация вольной степи"
 glp_cav_doctrine:0 "Конная доктрина Гуляйполя"
 glp_air_bonus:0 "Школа «Чёрного буревестника»"
 glp_theory_bonus:0 "Вольная научная мысль"
 glp_news.1.b:0 "Москва: временное недоразумение на юге"
 glp_news.1.c:0 "Любопытный опыт — но чем он кончится?"
 glp_news.2.b:0 "Съезд без партии — это не власть"
 glp_news.4.b:0 "Чёрный интернационал? Пусть шумят"
 glp_news.5.b:0 "Этот договор нас не касается"
 glp_news.5.c:0 "Учтём новые расклады"
 glp_news.6.b:0 "Признать очевидное"
 glp_press.8.c:0 "Принять к сведению"
 glp_news.7.t:0 "§WСтарые враги в строю РПА§!"
 glp_news.7.d:0 "§WБывшие белые офицеры, солдаты распавшихся армий и просто искатели воли со всей Европы сходятся под чёрное знамя. «Против общего врага мы теперь заодно», — заявляют ветераны, записываясь в полки имени Батьки.§!"
 glp_news.7.a:0 "Каждому, кто за свободу — винтовка и конь!"
 glp_news.7.b:0 "Неожиданный союз в степях"
 glp_trophy.1.t:0 "Трофейные команды РПА"
 glp_trophy.1.d:0 "Бойцы Батьки снова обчистили разбитые вражеские части: оружейные дворы Гуляйполя пополнились трофейными винтовками, снаряжением и техникой. Из добровольцев и пленных, согласных служить Вольной Территории, сформирован новый отряд — с ремонтной ротой, чтобы оружие врага продолжало работать на революцию."
 glp_trophy.1.a:0 "Анархия — мать порядка!"

 glp_white.1.t:0 "Разборки в штабе"
 glp_white.1.d:0 "Через месяц после призыва Скоблина, Туркула и Семёнова штаб РПА трещит. Махновцы требуют разоружить «золотопогонников». Эмигранты требуют полной власти над ударными бригадами."
 glp_white.1.a:0 "Поддержать генералов"
 glp_white.1.b:0 "Поддержать махновцев"

 GLP_reconciliation_with_past:0 "Примирение с прошлым"
 GLP_equip_volunteer_shock_brigades:0 "Снарядить ударные добровольческие бригады"
 GLP_equip_volunteer_shock_brigades_desc:0 "Довооружить белые бригады винтовками и орудиями — за счёт спокойствия коммун."

 glp_diplo.1.t:0 "Харьковский вопрос"
 glp_diplo.1.d:0 "Из Гуляйполя пришла делегация: пакт о взаимной обороне и доступе. Кремль должен решить, признавать ли банду Махно союзником или заразой."
 glp_diplo.1.a:0 "Гарантировать Вольную территорию"
 glp_diplo.1.b:0 "Не связываться с анархистами"
 glp_diplo.2.t:0 "Степной зондаж"
 glp_diplo.2.d:0 "Махно предлагает Берлину гарантии и военный доступ через степь. Генеральный штаб взвешивает пользу и скандал."
 glp_diplo.2.a:0 "Подписать гарантии"
 glp_diplo.2.b:0 "Отказать"
 glp_diplo.3.t:0 "Чёрное море и Форин-офис"
 glp_diplo.3.d:0 "Лондон получил предложение о пакте с Гуляйполем: доступ к портам Крыма взамен гарантий независимости."
 glp_diplo.3.a:0 "Дать гарантии"
 glp_diplo.3.b:0 "Не впутываться"
 glp_diplo.11.t:0 "Пакт подписан"
 glp_diplo.11.d:0 "Иностранная держава дала гарантии Вольной территории и открыла военный доступ. Это не дружба — это расчёт."
 glp_diplo.11.a:0 "Лишь бы не предали первыми"
 glp_diplo.12.t:0 "Отказ столицы"
 glp_diplo.12.d:0 "Делегацию вежливо выпроводили. Союз оказался бумагой без печати. Коммуны это запомнят."
 glp_diplo.12.a:0 "Значит, держимся сами"
 glp_crisis.1.t:0 "Ультиматум Москвы"
 glp_crisis.1.d:0 "Наркоминдел требует хлебную контрибуцию и разоружение пограничных куреней. Отказ Москва называет «ликвидацией бандитизма»."
 glp_crisis.1.a:0 "Отгрузить зерно — купить год"
 glp_crisis.1.b:0 "Чёрное знамя не гнётся"
 glp_crisis.2.t:0 "Южный нарыв"
 glp_crisis.2.d:0 "Махно отверг дань. Генштаб предлагает оформить претензии на Донбасс и Харьковщину."
 glp_crisis.2.a:0 "Готовить поход"
 glp_crisis.2.b:0 "Подождать"
 glp_crisis.3.t:0 "Москва точит косу"
 glp_crisis.3.d:0 "Разведка Задова доносит: у Кремля готов военный предлог. Степь должна встретить красных в седле."
 glp_crisis.3.a:0 "К тачанкам"
 glp_crisis.10.t:0 "Григорьев ломает строй"
 glp_crisis.10.d:0 "Атаман требует отдельных куреней и права на реквизиции. Штаб РПА стоит на общем уставе. Батько должен выбрать."
 glp_crisis.10.a:0 "Дать Григорьеву волю"
 glp_crisis.10.b:0 "Обрезать крылья атаману"
 glp_lab_bonus:0 "Лаборатории вольных коммун"

 glp_crisis.20.t:0 "Задов против Волина"
 glp_crisis.20.d:0 "Контрразведка требует чрезвычайных полномочий. Волин требует суда коммун. Штаб трещит по шву."
 glp_crisis.20.a:0 "Полномочия Задову"
 glp_crisis.20.b:0 "Слово Волину и сходам"
 glp_crisis.30.t:0 "Кровь на платке Батьки"
 glp_crisis.30.d:0 "Махно кашляет кровью после смотра. Врачи говорят о чахотке. Армия ждёт, кто будет говорить от его имени."
 glp_crisis.30.a:0 "Уложить Батьку в лазарет"
 glp_crisis.30.b:0 "Он останется в седле"
 glp_crisis.40.t:0 "Семёнов ломает присягу"
 glp_crisis.40.d:0 "Казачий отряд Семёнова отказал коммунам в реквизиции и потребовал отдельного корпуса. Либо суд, либо погоны."
 glp_crisis.40.a:0 "Разоружить семёновцев"
 glp_crisis.40.b:0 "Дать корпус — лишь бы дрались"
 glp_crisis.10.c:0 "Расстрелять атамана"
 glp_crisis.10.w:0 "Поделить власть с Григорьевым"
 glp_crisis.30.c:0 "Созвать Совет Атаманов"
 glp_crisis.30.w:0 "Вольница без Батьки"
 glp_crisis.31.t:0 "Кто говорит от имени РПА"
 glp_crisis.31.d:0 "Сход командиров выбирает преемника. Три кандидата — каждый со своей ценой: Вдовиченко держит партизан, Белаш ведёт штаб, Волин хранит знамя."
 glp_crisis.31.a:0 "Вдовиченко — партизанский вождь"
 glp_crisis.31.b:0 "Белаш — начальник штаба"
 glp_crisis.31.c:0 "Волин — голос анархии"
 glp_crisis.41.t:0 "Эмиграция или «параллельный штаб»"
 glp_crisis.41.d:0 "Полгода после бунта. Часть офицеров-эмигрантов рвётся уехать в Европу, часть требует собственный штаб и «вольную» структуру рядом с РПА."
 glp_crisis.41.a:0 "Пусть уезжают — степь очищается"
 glp_crisis.41.b:0 "Создать «параллельный штаб» из Скоблина"
 glp_crisis.42.t:0 "Развязка в степи"
 glp_crisis.42.d:0 "Штаб РПА требует последнего ответа: либо белая вольница остаётся под рукой, либо уходит за Днестр."
 glp_crisis.42.a:0 "Степь очищена"
 glp_crisis.42.b:0 "Уступить Скоблину"
 glp_crisis.42.c:0 "Скоблин уходит"
 glp_raid.1.t:0 "Рейд РПА"
 glp_raid.1.d:0 "Партизанский рейд за линию фронта."
 glp_raid.1.a:0 "Зачистить следы"
 glp_spanish.1.t:0 "Вести с Пиренеев"
 glp_spanish.1.d:0 "Сводка с испанского фронта."
 glp_spanish.1.a:0 "Принять к сведению"
 GLP_occupation_soviets:0 "Вольные советы на занятой земле"
 GLP_found_kiev_free_soviet:0 "Киевский вольный совет"
 GLP_found_kiev_free_soviet_desc:0 "Собрать совет в занятом Киеве и снизить сопротивление ценой пайка."
 GLP_found_odessa_port_soviet:0 "Портовый совет Одессы"
 GLP_found_odessa_port_soviet_desc:0 "Портовики под чёрным знаменем — конвои и верфи."
 GLP_found_rostov_raid_soviet:0 "Ростовский рейдовый совет"
 GLP_found_rostov_raid_soviet_desc:0 "Закрепиться на Дону и снять трофейные склады."
 GLP_found_kuban_cossack_soviet:0 "Кубанский казачий сход"
 GLP_found_kuban_cossack_soviet_desc:0 "Привлечь кубанцев в РПА — за счёт спокойствия коммун."
 GLP_steppe_raid_on_border:0 "Степной рейд по тылам"
 GLP_steppe_raid_on_border_desc:0 "Бросить курень за линию. Иногда трофеи, иногда трупы и ропот."

 glp_diplo.21.t:0 "Красные и чёрные"
 glp_diplo.21.d:0 "Москва признала Гуляйполе. В Берлине это читают как советский плацдарм в степи."
 glp_diplo.21.a:0 "Держать Балканы на замке"
 glp_diplo.22.t:0 "Сосед за Днестром"
 glp_diplo.22.d:0 "Бухарест не хочет чёрного знамени у Бессарабии. Король приказывает усилить заслоны."
 glp_diplo.22.a:0 "Закрыть границу"
 glp_diplo.23.t:0 "Степной эксперимент"
 glp_diplo.23.d:0 "Форин-офис следит за пактом Москвы и Махно. Прямой войны Лондон не ищет — только учёт."
 glp_diplo.23.a:0 "Занести в досье"
 glp_diplo.24.t:0 "Чужой флаг над степью"
 glp_diplo.24.d:0 "Гуляйполе ищет покровителя не в Кремле. Для Москвы это уже не банда, а плацдарм врага."
 glp_diplo.24.a:0 "Готовить южный кулак"
 glp_diplo.25.t:0 "Ось в Причерноморье"
 glp_diplo.25.d:0 "Берлин протянул руку Махно. Лондон не может оставить черноморские порты без присмотра."
 glp_diplo.25.a:0 "Сдерживать обоих"
 glp_diplo.26.t:0 "Антанта у Перекопа"
 glp_diplo.26.d:0 "Британия поручилась за Вольную территорию. В Берлине это удар по будущему походу на восток."
 glp_diplo.26.a:0 "Учесть и не забыть"
 glp_diplo.30.t:0 "Вольному воля"
 glp_diplo.30.d:0 "Махно отказался от всех знамён. Никто не поручитель — значит, каждый сам сторожит свою границу."
 glp_diplo.30.a:0 "Пусть сидят в степи"
