l_russian:
 GLP_focus_tree:0 "Вольная Территория — Гуляйполе"
 # Ветка 1: Военная доктрина и партизанская война
 GLP_insurgent_army_reorganization:0 "Реорганизация Повстанческой Армии"
 GLP_insurgent_army_reorganization_desc:0 "Укрепление структуры РПА на принципах выборности командиров и добровольной революционной дисциплины."
 GLP_underground_armories:0 "Подпольные арсеналы"
 GLP_underground_armories_desc:0 "Создание тайных складов оружия и боеприпасов в хуторах и балках степи."
 GLP_partisan_warfare_doctrine:0 "Доктрина партизанской войны"
 GLP_partisan_warfare_doctrine_desc:0 "Обучение бойцов тактике внезапных ударов, засад и молниеносного отхода."
 GLP_legendary_tachankas:0 "Легендарные тачанки"
 GLP_legendary_tachankas_desc:0 "Массовое производство легендарных пулеметных повозок — символа несокрушимой мобильности РПА."
 GLP_black_banner_vanguard:0 "Авангард Черного Знамени"
 GLP_black_banner_vanguard_desc:0 "Штурмовые ударные батальоны Черной Гвардии для сокрушения обороны противника."
 GLP_steppe_lightning:0 "Степная молния"
 GLP_steppe_lightning_desc:0 "Максимальная моторизация и разведка для контроля бескрайних просторов степей."
 GLP_anti_tank_cavalry:0 "Противотанковая конница"
 GLP_anti_tank_cavalry_desc:0 "Оснащение мобильных кавалерийских отрядов бронебойными ружьями и гранатами."
 GLP_armored_train_production:0 "Производство бронепоездов РПА"
 GLP_armored_train_production_desc:0 "Создание мощных бронированных крепостей на колесах для доминирования на магистралях."
 GLP_rapid_rail_deployment:0 "Стремительная ж/д переброска"
 GLP_rapid_rail_deployment_desc:0 "Использование южной железнодорожной сети для мгновенной переброски дивизий на угрожаемые участки."
 GLP_cossack_sabre_tactics:0 "Мастерство клинка и пулемета"
 GLP_cossack_sabre_tactics_desc:0 "Сочетание сокрушительного пулеметного огня тачанок с сабельной атакой лихой конницы."
 GLP_steel_ram_tactics:0 "Тактика стального тарана"
 GLP_steel_ram_tactics_desc:0 "Смелые прорывы вражеских фронтов при поддержке тяжелых бронепоездов и танков."
 GLP_invincible_insurgency:0 "Несокрушимое восстание"
 GLP_invincible_insurgency_desc:0 "Вооруженный народ невозможно победить: каждый город и хутор становится крепостью свободы."

 # Ветка 2: Индустриализация и вольные советы
 GLP_syndicate_industrial_planning:0 "Индустриальный план вольных синдикатов"
 GLP_syndicate_industrial_planning_desc:0 "Координация фабрично-заводских комитетов для развития независимой народной экономики."
 GLP_empower_the_communes:0 "Мастерские и тачанки"
 GLP_empower_the_communes_desc:0 "Передача всех заводов и фабрик в прямое самоуправление рабочих коллективов."
 GLP_donbass_coal_and_steel_collective:0 "Шахтерские и металлургические коллективы Донбасса"
 GLP_donbass_coal_and_steel_collective_desc:0 "Наращивание добычи угля и выплавки первоклассной броневой стали на заводах Донбасса."
 GLP_dnieper_hydroelectric_freedom:0 "Кооперативная электрификация"
 GLP_dnieper_hydroelectric_freedom_desc:0 "Использование колоссальной энергии Днепра для электрификации сел, городов и заводов."
 GLP_revvoensovet_industry_coordination:0 "Вольные арсеналы"
 GLP_revvoensovet_industry_coordination_desc:0 "Объединение военных мастерских под эгидой РевВоенСовета для непрерывного выпуска боеприпасов."
 GLP_decentralized_workshop_network:0 "Сеть децентрализованных мастерских"
 GLP_decentralized_workshop_network_desc:0 "Рассредоточенное производство, неуязвимое для вражеских бомбардировок."
 GLP_libertarian_railway_network:0 "Свободная железнодорожная сеть юга"
 GLP_libertarian_railway_network_desc:0 "Модернизация путей, мостов и станций силами вольных транспортных синдикатов."
 GLP_revvoensovet_armored_command:0 "Бронетанковое и железнодорожное управление"
 GLP_revvoensovet_armored_command_desc:0 "Организация производства легких танков, броневиков и тяжелых бронепоездов."
 GLP_black_sea_shipyards_refit:0 "Судоверфи Черного моря"
 GLP_black_sea_shipyards_refit_desc:0 "Модернизация верфей Николаева и Севастополя для обороны морских рубежей."
 GLP_scientific_communes_academies:0 "Научные лаборатории вольных коммун"
 GLP_scientific_communes_academies_desc:0 "Создание передовых исследовательских центров и открытие нового слота научных исследований."
 GLP_autonomous_industrial_bastion:0 "Автономный индустриальный бастион"
 GLP_autonomous_industrial_bastion_desc:0 "Полная индустриальная самодостаточность Вольной Территории."

 # Ветка 3: Внутренняя безопасность и контрразведка
 GLP_kontrrazvedka_reorganization:0 "Реорганизация Контрразведки РПА"
 GLP_kontrrazvedka_reorganization_desc:0 "Повышение эффективности агентурной и оперативной работы службы безопасности под руководством Лева Задова."
 GLP_purging_white_remnants:0 "Ликвидация белогвардейских заговоров"
 GLP_purging_white_remnants_desc:0 "Обезвреживание тайных монархических и белогвардейских ячеек, угрожающих свободе народа."
 GLP_vigilance_against_cheka_infiltrators:0 "Борьба с агентурой ЧК и ОГПУ"
 GLP_vigilance_against_cheka_infiltrators_desc:0 "Защита вольных советов и коммун от большевистских провокаторов и диверсантов."
 GLP_libertarian_civil_courts:0 "Суды чести и народные сходы"
 GLP_libertarian_civil_courts_desc:0 "Открытое народное правосудие на сходах граждан без бюрократических судей и казематов."
 GLP_decree_on_black_terror:0 "Декрет о Черном терроре"
 GLP_decree_on_black_terror_desc:0 "Беспощадное искоренение врагов революции мерами чрезвычайного военного трибунала."
 GLP_zadov_intelligence_network:0 "Сеть контрразведки Лева Задова"
 GLP_zadov_intelligence_network_desc:0 "Создание разветвленной зарубежной и внутренней разведывательной сети."
 GLP_expansion_of_iron_fist:0 "Экспансия железного кулака"
 GLP_expansion_of_iron_fist_desc:0 "Установление жесткой военной дисциплины на всех освобожденных территориях."
 GLP_peoples_militia_patrols:0 "Патрули народной стражи"
 GLP_peoples_militia_patrols_desc:0 "Добровольные отряды самообороны граждан для поддержания порядка на улицах."
 GLP_unshakeable_revolutionary_order:0 "Непоколебимый революционный порядок"
 GLP_unshakeable_revolutionary_order_desc:0 "Стабильность и абсолютная защищенность завоеваний вольного народа."

 # Ветка 4: Дипломатические союзы
 GLP_international_diplomacy_crossroads:0 "Дипломатический выбор Гуляйполя"
 GLP_international_diplomacy_crossroads_desc:0 "Определение внешнеполитического курса Вольной Территории на пороге мировой войны."
 GLP_alliance_with_soviet_union:0 "Союз с Советским Союзом"
 GLP_alliance_with_soviet_union_desc:0 "Военно-политический пакт с Москвой на условиях взаимного признания автономии советов."
 GLP_alliance_with_germany:0 "Пакт с Германией"
 GLP_alliance_with_germany_desc:0 "Прагматичный пакт о ненападении и военно-техническом сотрудничестве с Берлином."
 GLP_alliance_with_britain:0 "Договор с Великобританией"
 GLP_alliance_with_britain_desc:0 "Соглашение с западными демократиями для защиты черноморской торговли и независимости."
 GLP_soviet_armaments_lend_lease:0 "Советский военный ленд-лиз"
 GLP_soviet_armaments_lend_lease_desc:0 "Поставки стрелкового оружия и артиллерии со складов РККА."
 GLP_krupp_arms_shipments:0 "Поставки вооружений от Krupp"
 GLP_krupp_arms_shipments_desc:0 "Импорт немецких противотанковых орудий и новейшего пехотного снаряжения."
 GLP_vickers_armaments_lend_lease:0 "Военные поставки Vickers"
 GLP_vickers_armaments_lend_lease_desc:0 "Прибытие британских конвоев со стрелковым оружием и тяжелой артиллерией."
 GLP_joint_red_black_military_academy:0 "Совместная военная академия"
 GLP_joint_red_black_military_academy_desc:0 "Обмен передовым тактическим опытом между командирами РПА и советскими военспецами."
 GLP_wehrmacht_tactical_instructors:0 "Военные инструкторы Вермахта"
 GLP_wehrmacht_tactical_instructors_desc:0 "Внедрение методов глубоких маневренных прорывов и прусской штабной выучки."
 GLP_sevastopol_naval_refit_with_royal_navy:0 "Модернизация верфей с Royal Navy"
 GLP_sevastopol_naval_refit_with_royal_navy_desc:0 "Переоснащение севастопольских доков по британским чертежам."
 GLP_eurasian_red_black_vanguard:0 "Евразийский Красно-Черный авангард"
 GLP_eurasian_red_black_vanguard_desc:0 "Несокрушимый союз трудящихся Востока для разгрома мирового империализма."
 GLP_black_cross_of_the_steppes:0 "Черный крест степей"
 GLP_black_cross_of_the_steppes_desc:0 "Мощнейшая ось степной ударной мощи в союзе со странами Оси."
 GLP_bastion_of_free_nations:0 "Оплот свободных наций"
 GLP_bastion_of_free_nations_desc:0 "Гуляйполе как несокрушимый бастион свободы и антитоталитарного сопротивления."
 GLP_free_will:0 "Вольному воля"
 GLP_free_will_desc:0 "Гуляйполе не встаёт ни под чьи знамёна. Слава Батьки гремит по всей Европе: воюющие державы шлют доббровольцев под чёрное знамя, а сама РПА крепит волю трудового народа."
 GLP_old_enemies_unite:0 "Старые враги"
 GLP_old_enemies_unite_desc:0 "Призыв к бывшим противникам по всей Европе — от белых эмигрантов до дезертиров всех армий — объединиться против общего врага. Полки добровольцев прибывают в Гуляйполе на помощь Нестору Махно."
 GLP_international_brigades:0 "Интернациональные бригады"
 GLP_international_brigades_desc:0 "Анархисты, социалисты и антифашисты всего мира формируют интернациональные бригады. Гуляйполе получает оружие, людей и право принимать доббровольческие части любой воюющей страны."
 GLP_black_cross_aid:0 "Помощь Чёрного Креста"
 GLP_black_cross_aid_desc:0 "Анархистский Чёрный Крест разворачивает сеть снабжения: вольные мастеровые и зарубежные товарищи ставят под ружьё новые заводы и арсеналы."
 GLP_makhno_myth:0 "Миф о Махно"
 GLP_makhno_myth_desc:0 "Имя Батьки становится легендой по всей Европе. Бойцы РПА сражаются с верой в свою правду, а враги трепещут при одном виде чёрного знамени."

 # Ветка 5: Аграрные и социальные реформы
 GLP_peasant_grain_supplies:0 "Поставки продовольствия от вольных крестьян"
 GLP_peasant_grain_supplies_desc:0 "Свободный добровольный товарообмен между хлеборобами степи и рабочими городов."
 GLP_bread_for_cities_and_front:0 "Хлеб для городов и фронта"
 GLP_bread_for_cities_and_front_desc:0 "Бесперебойное снабжение отрядов Черной Гвардии лучшим хлебом свободных степей."
 GLP_communal_granaries:0 "Общинные зернохранилища и элеваторы"
 GLP_communal_granaries_desc:0 "Строительство современных механизированных элеваторов для создания стратегических запасов зерна."
 GLP_tractor_stations_for_communes:0 "Машинно-тракторные станции коммун"
 GLP_tractor_stations_for_communes_desc:0 "Оснащение крестьянских коммун тракторами и комбайнами для кратного роста урожайности."
 GLP_land_to_the_tillers_decree:0 "Декрет: Земля тем, кто её обрабатывает"
 GLP_land_to_the_tillers_decree_desc:0 "Окончательная отмена частной и государственной собственности на землю — земля принадлежит трудовому народу!"
 GLP_free_libertarian_schools:0 "Свободные школы и ликвидация неграмотности"
 GLP_free_libertarian_schools_desc:0 "Всеобщее бесплатное образование и открытие нового слота научных исследований."
 GLP_rural_healthcare_network:0 "Сеть земской медицины"
 GLP_rural_healthcare_network_desc:0 "Организация сельских больниц, пунктов вакцинации и санитарных поездов."
 GLP_steppes_breadbasket:0 "Житница свободной степи"
 GLP_steppes_breadbasket_desc:0 "Превращение южных просторов в изобильный оазис свободного крестьянского труда."
 GLP_peasant_intellectual_harmony:0 "Гармония крестьянского и умственного труда"
 GLP_peasant_intellectual_harmony_desc:0 "Слияние физического и научного творчества для процветания общества."
 GLP_flourishing_free_countryside:0 "Процветающая вольная деревня"
 GLP_flourishing_free_countryside_desc:0 "Богатые, культурные и вооруженные крестьянские коммуны юга."

 # Ветка 6: Судьба Вольной Территории и Мировая Революция
 GLP_fourth_congress_of_peasants:0 "IV Съезд крестьян, рабочих и повстанцев"
 GLP_fourth_congress_of_peasants_desc:0 "Всенародный съезд делегатов Вольного Гуляйполя для определения пути развития страны."
 GLP_federation_of_free_soviets:0 "Федерация вольных Советов"
 GLP_federation_of_free_soviets_desc:0 "Построение подлинного безгосударственного анархо-коммунистического общества."
 GLP_black_military_dictatorship:0 "Черная военная диктатура"
 GLP_black_military_dictatorship_desc:0 "Концентрация всей власти в руках военного совета для подготовки к тотальной войне."
 GLP_black_international:0 "Черный Интернационал"
 GLP_black_international_desc:0 "Объединение анархистов всего мира для координации антиавторитарной борьбы."
 GLP_total_militarization_of_communes:0 "Тотальная милитаризация коммун"
 GLP_total_militarization_of_communes_desc:0 "Превращение всех заводов и хозяйств в военные цеха армии."
 GLP_aid_to_spanish_anarchists:0 "Братская помощь CNT-FAI"
 GLP_aid_to_spanish_anarchists_desc:0 "Отправка добровольцев и эшелонов с оружием испанским братьям по борьбе."
 GLP_black_crescent_of_the_steppes:0 "Черный Полумесяц Вольных Степей"
 GLP_black_crescent_of_the_steppes_desc:0 "Освобождение народов Причерноморья, Крыма, Дона и Кавказа от тирании."
 GLP_anti_state_continental_crusade:0 "Антигосударственный поход"
 GLP_anti_state_continental_crusade_desc:0 "Наступление на все империалистические государства континента."
 GLP_declaration_of_world_anarchy:0 "Декларация Мировой Анархии"
 GLP_declaration_of_world_anarchy_desc:0 "Провозглашение планетарного восстания против власти капитала и государств."
 GLP_triumph_of_free_humanity:0 "Триумф Свободного Человечества"
 GLP_triumph_of_free_humanity_desc:0 "Вечный триумф свободы, братства и солидарности во всем мире."

 # Идеи и национальные духи
 GLP_idea_dnieper_hydroelectric:0 "Энергия ДнепроГЭС"
 GLP_idea_dnieper_hydroelectric_desc:0 "Турбины ДнепроГЭС питают мастерские и депо Вольной территории — металл идёт потоком, а свет горит даже в самых глухих сёлах."
 GLP_idea_decentralized_workshops:0 "Децентрализованные мастерские"
 GLP_idea_decentralized_workshops_desc:0 "Производство рассредоточено по сотням сельских мастерских: разбомбить такую промышленность невозможно, а восстанавливается она за считанные дни."
 GLP_idea_autonomous_industrial_bastion:0 "Автономная индустрия"
 GLP_idea_autonomous_industrial_bastion_desc:0 "Вольная территория опирается только на собственные станки и собственное сырьё — ни один внешний ультиматум не остановит наши заводы."
 GLP_idea_kontrrazvedka_surveillance:0 "Бдительность Контрразведки"
 GLP_idea_kontrrazvedka_surveillance_desc:0 "Разведывательно-заградительный отдел присматривает за дорогами, вокзалами и постоялыми дворами: чужой агент не проедет и одной волости."
 GLP_idea_anti_cheka_vigilance:0 "Щит от провокаторов"
 GLP_idea_anti_cheka_vigilance_desc:0 "Сельские сходы сами вылавливают провокаторов и подстрекателей, лишая соседние державы почвы для подрывной работы."
 GLP_idea_libertarian_courts:0 "Народные сходы правосудия"
 GLP_idea_libertarian_courts_desc:0 "Правосудие вершат выборные народные сходы, а не чиновники: приговоры быстры, понятны и потому уважаемы."
 GLP_idea_zadov_network:0 "Агентурная сеть Задова"
 GLP_idea_zadov_network_desc:0 "Агентура Задова работает от Харькова до Одессы, доставляя штабу сведения раньше, чем противник успевает отдать приказ."
 GLP_idea_militia_patrols:0 "Народная стража"
 GLP_idea_militia_patrols_desc:0 "Вооружённые дружины коммун несут дозор на своих же дорогах — тыл спокоен, а население считает стражу своей, а не чужой."
 GLP_idea_land_to_tillers:0 "Земля народу"
 GLP_idea_land_to_tillers_desc:0 "Помещичья земля роздана тем, кто её пашет. Крестьянин, ставший хозяином, кормит армию и охотно даёт ей сыновей."
 GLP_idea_rural_healthcare:0 "Земская медицина"
 GLP_idea_rural_healthcare_desc:0 "Земские фельдшерские пункты и походные лазареты сохраняют тысячи жизней, которые прежде уносили тиф и раны."
 GLP_idea_black_crescent:0 "Черный Полумесяц Степей"
 GLP_idea_black_crescent_desc:0 "Чёрное знамя охватывает степь широкой дугой от Днепра до Дона: наши рубежи стали глубже, а удар — тяжелее."
 GLP_idea_continental_crusade:0 "Континентальный поход"
 GLP_idea_continental_crusade_desc:0 "Повстанческая армия больше не ждёт врага у себя дома — она несёт восстание за пределы Вольной территории."
