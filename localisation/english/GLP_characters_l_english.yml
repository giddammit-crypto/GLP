 # ============ Five new ministers of the Free Territory (v1.5.0) ============
 GLP_petr_arshinov:0 "Pyotr Arshinov"
 GLP_petr_arshinov_advisor:0 "Pyotr Arshinov"
 GLP_petr_arshinov_advisor_desc:0 "Chronicler and organiser of Nabat: war support +5%, political power +10%, drift defence +10%."
 GLP_maria_nikiforova:0 "Maria Nikiforova"
 GLP_maria_nikiforova_advisor:0 "Maria Nikiforova ('Marusya')"
 GLP_maria_nikiforova_advisor_desc:0 "Revolutionary defence: conscription +5%, war support +5%, mobilization speed +10%, stability −3%."
 GLP_aron_baron:0 "Aron Baron"
 GLP_aron_baron_advisor:0 "Aron Baron"
 GLP_aron_baron_advisor_desc:0 "Syndicalist labour: construction speed +5%, factory efficiency cap +5%, consumer goods −2%."
 GLP_yakov_ozerov:0 "Yakov Ozerov"
 GLP_yakov_ozerov_advisor:0 "Yakov Ozerov"
 GLP_yakov_ozerov_advisor_desc:0 "Theorist of partisan warfare: land doctrine cost −10%, army experience +5%, max entrenchment +2."
 GLP_dmitry_popov:0 "Dmitry Popov"
 GLP_dmitry_popov_advisor:0 "Dmitry Popov"
 GLP_dmitry_popov_advisor_desc:0 "Organiser of supply and logistics (vanilla army chief trait II): divisions rebuild organisation faster."
 GLP_voldemar_antoni:0 "Voldemar Antoni"

 # New minister traits
 GLP_chronicler_of_revolution:0 "Minister of the Press: Chronicler of the Revolution"
 GLP_chronicler_of_revolution_desc:0 "Editor of the Voice of Freedom and keeper of the movement's memory: his fiery editorials hold the people's will firmer than any decree."
 GLP_black_atamansha:0 "Minister of Revolutionary Defence: Black Atamansha"
 GLP_black_atamansha_desc:0 "Marusya recognizes neither front nor rear: her free militias raise villages to arms faster than the staff can print an order. But where she passes, expect no order."
 GLP_syndicalist_organizer:0 "Minister of Labour: Syndicalist Organizer"
 GLP_syndicalist_organizer_desc:0 "The factory committees of Ekaterinoslav trust Baron as one of their own: the machines run without overseers, and output quotas rise voluntarily."
 GLP_partisan_theorist:0 "Military Theorist: Theory of Partisan Warfare"
 GLP_partisan_theorist_desc:0 "A former staff captain distilled the experience of a thousand raids into a single doctrine: strike from nowhere, entrench overnight, vanish into the steppe by dawn."

 # Black Rada pretender traits
 GLP_left_sr_conspirator:0 "Iron Hand of the Free Territory"
 GLP_left_sr_conspirator_desc:0 "Popov forges the free host into a disciplined force: the staff runs like clockwork, but the communes grumble — they did not drive out the commissars to breed their own."
 GLP_patriarch_of_anarchism:0 "Patriarch of Anarchism"
 GLP_patriarch_of_anarchism_desc:0 "The old teacher who first led young Makhno into the movement. His word reconciles atamans and communes, but the old man no longer hungers for war."

 # ============ Fleet and aviation of the Free Territory (v1.5.1) ============
 GLP_fedir_ostapenko:0 "Fedir Ostapenko"
 GLP_fedir_ostapenko_advisor:0 "Fedir Ostapenko"
 GLP_fedir_ostapenko_advisor_desc:0 "Hetman of the Azov flotilla: naval organisation +6%, coordination +8%, naval experience +10%."
 GLP_stepan_goncharenko:0 "Stepan Goncharenko"
 GLP_andriy_verba:0 "Andriy Verba"
 GLP_andriy_verba_advisor:0 "Andriy Verba"
 GLP_andriy_verba_advisor_desc:0 "Ace of the Black Wings: fighter superiority efficiency +5%, air experience +10%, untrained pilot penalty −10%."
 GLP_klym_orlyk:0 "Klym Orlyk"
 GLP_klym_orlyk_advisor:0 "Klym Orlyk"
 GLP_klym_orlyk_advisor_desc:0 "Close air support (vanilla staff trait II): ground attack wings work the battlefield far better."
 GLP_free_flotilla_commander:0 "Commander of the Free Flotilla"
 GLP_free_flotilla_commander_desc:0 "An old Black Sea boatswain who raised the black flag over the destroyers of Sevastopol. His flotilla sails without admiralties or written orders — yet moors with chronometer precision."
 GLP_black_wings_ace:0 "Ace of the Black Wings"
 GLP_black_wings_ace_desc:0 "A dashing steppe aviator: his squadron takes off from dirt strips near Gulyaipole and appears over enemy columns before their staff can even mark themselves on the map."
