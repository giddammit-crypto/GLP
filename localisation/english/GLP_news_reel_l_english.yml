l_english:
 # ================================================================
 # 10 UNIQUE NEWS EVENTS WITH IMAGES
 # ================================================================

 # 1. Armored Train "Freedom or Death"
 glp_press.1.t:0 "§WARMORED TRAIN 'FREEDOM OR DEATH' ROLLS OFF THE RAILS§!"
 glp_press.1.d:0 "§W§YEKATERINOSLAV.§!§W The fearsome armored train 'Freedom or Death' has emerged from the railway workshops — a mobile fortress bristling with heavy guns and machine-gun turrets. The iron beast symbolizes the unstoppable military might of the RIA and strikes terror into all who dare threaten the Free Territory. Batko Makhno personally inspected the war machine and ordered its immediate deployment to the southern front.§!"
 glp_press.1.a:0 "Freedom or Death! The armored train rolls to war!"
 glp_press.1.b:0 "This threatens our offensive plans..."
 glp_press.1.c:0 "An interesting engineering achievement."

 # 2. DnieperGES: Electrification of the Steppe
 glp_press.2.t:0 "§WDNIEPER HYDROELECTRIC: THE STEPPE AWAKENS§!"
 glp_press.2.d:0 "§W§YZAPORIZHZHIA.§!§W The colossal Dnieper hydroelectric dam has been brought online by volunteer engineering communes. Thousands of kilometers of power lines now stretch across the steppes, bringing light and energy to villages, workshops, and factories. Electrification is the locomotive of freedom, and the Free Territory now commands the mightiest power base in the entire south.§!"
 glp_press.2.a:0 "Electrification is the power of a free people!"
 glp_press.2.b:0 "We should have controlled this facility..."
 glp_press.2.c:0 "An impressive engineering project."

 # 3. Shchus's Cavalry Raid
 glp_press.3.t:0 "§WSHCHUS'S LEGENDARY RAID: WHITE GUARD CRUSHED§!"
 glp_press.3.d:0 "§W§YSOUTHERN FRONT STEPPE.§!§W Legendary cavalry commander Feodosiy Shchus has launched a devastating raid deep behind enemy lines, destroying two White Guard supply trains and capturing weapons depots. The Black Guard cavalry, thundering across the steppe under black-and-red banners, has struck terror into enemy garrisons. Spoils: hundreds of rifles, dozens of machine guns, and three operational armored cars.§!"
 glp_press.3.a:0 "Glory to Shchus! The steppe is ours!"
 glp_press.3.b:0 "The Makhnovists have struck our rear again..."
 glp_press.3.c:0 "The southern front situation is deteriorating."

 # 4. Anarchist Congress in Ekaterinoslav
 glp_press.4.t:0 "§WALL-UKRAINIAN ANARCHIST CONGRESS IN EKATERINOSLAV§!"
 glp_press.4.d:0 "§W§YEKATERINOSLAV.§!§W Delegates from anarchist groups, syndicalist unions, and free communes across Ukraine have gathered for a historic congress. A resolution was adopted to establish the Federation of Free Soviets — a society without state, capital, or masters. Vsevolod Volin delivered a fiery speech calling on workers worldwide to follow Gulyaypole's example.§!"
 glp_press.4.a:0 "Long live anarchy — the mother of order!"
 glp_press.4.b:0 "This is a direct threat to Soviet power..."
 glp_press.4.c:0 "A curious political phenomenon."

 # 5. Black Guard on the March
 glp_press.5.t:0 "§WBLACK GUARD ON THE MARCH: GENERAL MOBILIZATION§!"
 glp_press.5.d:0 "§W§YGULAY-POLE.§!§W The Revolutionary Military Council has declared a general mobilization of the Black Guard. Tens of thousands of volunteers — peasants, workers, miners — have answered Batko Makhno's call. Columns of armed fighters with black-and-red banners march toward the front. The steppe trembles with the thunder of hooves and roar of engines. The enemy shall be crushed!§!"
 glp_press.5.a:0 "Every free person is a soldier of the revolution!"
 glp_press.5.b:0 "The Makhnovists are mobilizing the entire population..."
 glp_press.5.c:0 "We observe the situation with interest."

 # 6. Donbass Free Syndicates
 glp_press.6.t:0 "§WDONBASS: MINES AND FACTORIES HANDED TO SYNDICATES§!"
 glp_press.6.d:0 "§W§YDONETS BASIN.§!§W All mines, steel mills, and coking plants of the Donbass have been placed under the management of free workers' syndicates. Thousands of miners and steelworkers have solemnly sworn to extract coal and forge steel in defense of freedom. Production figures are rising at record pace — free labor is more effective than coercion!§!"
 glp_press.6.a:0 "Donbass is the forge of freedom!"
 glp_press.6.b:0 "They have seized our industrial resources!"
 glp_press.6.c:0 "An interesting economic experiment."

 # 7. Zadov's Counter-Intelligence Operation
 glp_press.7.t:0 "§WZADOV'S COUNTER-INTELLIGENCE UNCOVERS PLOT§!"
 glp_press.7.d:0 "§W§YGULAY-POLE.§!§W RIA intelligence agents under Lev Zadov's command have exposed a major conspiracy of White Guard agents and Cheka provocateurs planning sabotage of military depots and assassination of army command. Dozens arrested; cipher books, maps, and agent lists seized. RIA counter-intelligence has once again proven its supreme effectiveness.§!"
 glp_press.7.a:0 "Zadov is the shield of the revolution! Enemies shall be punished."
 glp_press.7.b:0 "Captured weapons will arm the militia."

 # 8. Peasant Communes Flourish
 glp_press.8.t:0 "§WGOLDEN AGE OF GULAY-POLE'S PEASANT COMMUNES§!"
 glp_press.8.d:0 "§W§YFREE TERRITORY.§!§W The free peasant communes of the Free Territory are harvesting record crops. Communal granaries are filled to capacity, new tractor brigades work the fields, and rural schools and hospitals open in every village. Without landlords or bureaucrats, peasant labor brings unprecedented abundance. Gulyaypole proves: the people can live without a state!§!"
 glp_press.8.a:0 "Land to those who till it!"
 glp_press.8.b:0 "We invest the surplus into industry."

 # 9. Voice of Freedom Radio Tower
 glp_press.9.t:0 "§WVOICE OF FREEDOM RADIO TOWER BEGINS BROADCASTING§!"
 glp_press.9.d:0 "§W§YGULAY-POLE.§!§W The powerful 'Voice of Freedom' radio station has entered service, covering all of southern Ukraine, Crimea, Donbass, and the Caucasus. Daily broadcasts in Russian, Ukrainian, Yiddish, and German carry calls for freedom, front-line news, and revolutionary music. The voice of liberty can no longer be silenced!§!"
 glp_press.9.a:0 "The Voice of Freedom is the voice of a free people!"
 glp_press.9.b:0 "This propaganda threatens our stability..."
 glp_press.9.c:0 "Fascinating technology."

 # 10. Black International: Madrid
 glp_press.10.t:0 "§WBLACK INTERNATIONAL: BROTHERHOOD WITH CNT-FAI§!"
 glp_press.10.d:0 "§W§YMADRID — GULAY-POLE.§!§W An RIA delegation has signed a historic mutual aid pact with the Spanish anarchists of CNT-FAI. Thousands of volunteers and trainloads of weapons have been dispatched to the Iberian Peninsula. The Black International becomes a real fighting force — from the Ukrainian steppes to the banks of the Ebro, anarchists unite against fascism and tyranny!§!"
 glp_press.10.a:0 "Solidarity is our weapon! Viva CNT-FAI!"
 glp_press.10.b:0 "Brothers in struggle have come to our aid!"
 glp_press.10.c:0 "The international anarchist movement is gaining strength."
