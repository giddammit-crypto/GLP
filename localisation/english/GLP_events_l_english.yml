 # ---------------------------------------------------------------------------
 #  Intro newspaper of a new campaign
 # ---------------------------------------------------------------------------
 glp_news.100.t:0 "§WTHE FREE VOICE OF GULYAYPOLE: a storm gathers over the free steppe§!"
 glp_news.100.d:0 "§WGulyaypole, 1 January 1936. Alternate history.\n\nEighteen years ago, in the fire of 1917, the black banner rose over the Azov steppe. White regiments, the Hetman's guard, German bayonets and Red commissars each promised the peasant here order — and each left with nothing.\n\nContrary to every textbook, the Revolutionary Insurgent Army (Anarcho-Communists of the Bakunin school) was never destroyed. Neither Perekop in 1920, nor the Cheka sweeps of 1921, nor the hungry years finished off the free insurgency. By 1925 Moscow, bled white by war and revolt, signed what it had signed with no one else: a treaty recognising the Free Territory.\n\nSince then, between the Dnieper, the Don and the Crimea, stands the Free Republic of Gulyaypole — the whole south of the former Russian Empire, wrested from every government at once. There is no landlord and no minister here: the works are run by their factory committee, the village by its assembly, and Batko Makhno is still styled a counsellor of the working people rather than a leader.\n\nBut the world is sharpening its bayonets again. Moscow counts our grain and coal as its own, Berlin measures our steppe on its maps, Warsaw eyes the river crossings. The great war is already at the gate — and which side Nestor Ivanovich takes is yours to decide.§!"
 glp_news.100.a:0 "Let the thunder roll!"
 glp_news.100.b:0 "We wrote the Batko off too soon..."
 glp_news.100.c:0 "A strange state with no government"

 # --------------------------------------------------------------------
 #  Event localisation missing before the audit (stage 5)
 # --------------------------------------------------------------------
 glp.1.t:0 "Council of the Revolutionary Military Committee"
 glp.1.d:0 "Commanders and commune delegates gathered at the RIAU staff. Decisions are taken together — and carried out without delay."
 glp.1.a:0 "So the free assembly ruled"
 glp.2.t:0 "Assembly of the Free Communes"
 glp.2.d:0 "Delegates of villages and factory committees came to Gulyaypole to settle accounts and disputes without officials."
 glp.2.a:0 "Order rests on agreement"
 glp.3.t:0 "Reinforcements for the Insurgent Army"
 glp.3.d:0 "From farmsteads and mining settlements new volunteers have joined the Black Guard — with their own horses and their fathers' rifles."
 glp.3.a:0 "Take the brothers into the ranks"
 glp.10.t:0 "CNT-FAI delegation arrives in Gulyaypole"
 glp.10.d:0 "GULYAYPOLE. Spanish anarcho-syndicalists of the CNT-FAI stepped off the train under black banners. They bring the experience of Barcelona's worker collectives, a request for help — and an offer to exchange engineers and weapon blueprints."
 glp.10.a:0 "Volunteers for our brothers in struggle"
 glp.10.b:0 "Take Barcelona's industrial know-how"
 glp.11.t:0 "Steppe manoeuvres of the tachanka detachments"
 glp.11.d:0 "EKATERINOSLAV REGION. Five hundred tachankas fought a mock engagement on the sun-scorched plain, wheeling at the gallop and escaping before the enemy could unlimber a battery. Belash's staff filled three notebooks."
 glp.11.a:0 "Train as we intend to fight"
 glp.11.b:0 "Issue new rifles to the regiments"
 glp.12.t:0 "The Dnieper dam powers the free workshops"
 glp.12.d:0 "ZAPOROZHYE. The turbines are at full output. The current flows not to ministries but to forges, mills and armouries of the Free Territory. Engineers argue whether to build new shops or invest in electrical science."
 glp.12.a:0 "Raise the shops beside the dam"
 glp.12.b:0 "Invest in electrical science"
 glp.13.t:0 "Donbass: the coal syndicates unite"
 glp.13.d:0 "YUZOVKA. The miners' committees merged their artels into a single free syndicate. Coal will move on one schedule — but the hewers themselves will dispose of it. The war council asks for a share for the arms works."
 glp.13.a:0 "Coal to the arms workshops"
 glp.13.b:0 "Profits back to the mining settlements"
 glp.14.t:0 "The heavy armoured train leaves the depot"
 glp.14.d:0 "EKATERINOSLAV. Riveted plating, a gun turret, machine-gun casemates and a workshop car. 'Liberty or death' is painted along her side in white. The drivers swear they will take her as far as Warsaw."
 glp.14.a:0 "Let the steppe hear her whistle"
 glp.15.t:0 "The great autumn fair at Gulyaypole"
 glp.15.d:0 "GULYAYPOLE. Carts came from across the steppe: grain, horses, leather, Donbass coal and Crimean salt. No excise and no constable — only free trade and a handshake. After the trading, young men enlist by whole streets."
 glp.15.a:0 "The fair feeds and reconciles"
 glp.15.b:0 "Enlist the volunteers on the spot"
 glp.16.t:0 "Sevastopol: the revolutionary fleet reborn"
 glp.16.d:0 "SEVASTOPOL. Sailors' committees raised ships abandoned by every government at once. Boilers overhauled, guns uncrated. The question is whether to lay down a yard or first train the crews."
 glp.16.a:0 "Lay down a yard at Sevastopol"
 glp.16.b:0 "Train the crews first"
 glp.17.t:0 "The Batko tours the forward posts"
 glp.17.d:0 "FRONTIER BELT. Makhno rode the posts from the Dnieper to the Don without an escort, sleeping at the campfires. Where he passed, muster rolls fill up and talk of 'coming to terms with Moscow' dies away."
 glp.17.a:0 "The Batko's word binds tighter than an order"
 glp.17.b:0 "Turn the tour into assemblies and agitation"
 glp.18.t:0 "The free communes bring in a record harvest"
 glp.18.d:0 "TAURIDA. The communes reported to the assembly: grain enough to eat, to store and to trade with the towns. The argument is whether to share the surplus out or put it into new workshops."
 glp.18.a:0 "Share it out — let the people grow strong"
 glp.18.b:0 "Put the surplus into workshops"
 glp.19.t:0 "Radio 'Voice of Liberty' goes on air"
 glp.19.d:0 "GULYAYPOLE. A mast rose above the old district office. The first broadcast was heard in Kharkov, Rostov and — if intercepts are to be believed — even in Warsaw."
 glp.19.a:0 "Carry word of the free order to the world"
 glp.19.b:0 "Broadcast to the enemy's troops"
 glp.20.t:0 "War council of the RevVoenSovet"
 glp.20.d:0 "GULYAYPOLE. Belash spread out the maps of the south: rail junctions, crossings, ravines where a regiment can hide. Karetnik demands cavalry corps, Shchus freedom to raid, Zadov intelligence. All agree on one thing: fight our own way."
 glp.20.a:0 "Adopt our own cavalry doctrine"
 glp.20.b:0 "Learn on manoeuvres, not on paper"
 glp.21.t:0 "Zadov's counter-intelligence rolls up a network"
 glp.21.d:0 "EKATERINOSLAV. The department took the whole chain: safe houses, ciphers, couriers and an arms cache. Zadov reported briefly: 'Clean work, there will be no noise.'"
 glp.21.a:0 "Announce the case at the assembly"
 glp.21.b:0 "Hand the cache to the regiments"
 glp.22.t:0 "The 'Black Petrel' squadron is formed"
 glp.22.d:0 "STEPPE AIRFIELD. Aircraft assembled from captured and purchased parts form the first free squadron. The pilots are yesterday's mechanics and cavalrymen; a circled letter A is painted on the fins."
 glp.22.a:0 "Keep pace with the age — new machines"
 glp.22.b:0 "Airfields and workshops first"
 glp.23.t:0 "Congress of free thought at Ekaterinoslav"
 glp.23.d:0 "EKATERINOSLAV. Volin gathered writers, teachers and commune delegates: three days of argument about living without a state and not sliding into a new power. The printed pamphlet sold out at once."
 glp.23.a:0 "Print it and spread it through the communes"
 glp.23.b:0 "Turn the argument into practice"
 glp.24.t:0 "Jubilee of the stateless republic"
 glp.24.d:0 "GULYAYPOLE. Tachankas on parade, a band, tables down the whole street. The Free Territory has been buried three times — and it still stands, with no tsar, no commissar and no master."
 glp.24.a:0 "Glory to the free people!"
 glp_cnt_bonus:0 "Experience of the Barcelona collectives"
 glp_electrification:0 "Electrification of the free steppe"
 glp_cav_doctrine:0 "The Gulyaypole cavalry doctrine"
 glp_air_bonus:0 "The 'Black Petrel' flying school"
 glp_theory_bonus:0 "Free scientific thought"
 glp_news.1.b:0 "Moscow: a temporary misunderstanding in the south"
 glp_news.1.c:0 "A curious experiment — but how will it end?"
 glp_news.2.b:0 "A congress without a party is not power"
 glp_news.4.b:0 "A Black International? Let them shout"
 glp_news.5.b:0 "This treaty is no concern of ours"
 glp_news.5.c:0 "Note the new alignment"
 glp_news.6.b:0 "Acknowledge the obvious"
 glp_press.8.c:0 "Take note"
 glp_news.7.t:0 "§WOld Enemies in the RIA Ranks§!"
 glp_news.7.d:0 "§WFormer White officers, soldiers of broken armies and free spirits from across Europe gather beneath the black flag. 'Against the common enemy we stand together,' declare veterans as they enlist in the Batko's regiments.§!"
 glp_news.7.a:0 "A rifle and a horse for every free man!"
 glp_news.7.b:0 "An unexpected alliance in the steppes"
 glp_trophy.1.t:0 "Trophy Teams of the RIA"
 glp_trophy.1.d:0 "Batko's fighters have stripped another beaten enemy unit clean: Gulyaypole's armouries brim with captured rifles, gear and vehicles. From volunteers and prisoners willing to serve the Free Territory, a new detachment has been raised — with its own maintenance company, so that the enemy's weapons keep serving the revolution."
 glp_trophy.1.a:0 "Anarchy is the mother of order!"

 glp_white.1.t:0 "Staff Quarrel"
 glp_white.1.d:0 "A month after Skoblin, Turkul and Semyonov were called, RIA headquarters is splitting. Makhnovists demand the 'gold-epaulettes' be disarmed. The emigres demand full command of the shock brigades."
 glp_white.1.a:0 "Back the generals"
 glp_white.1.b:0 "Back the Makhnovists"

 GLP_reconciliation_with_past:0 "Reconciliation with the Past"
 GLP_equip_volunteer_shock_brigades:0 "Equip Volunteer Shock Brigades"
 GLP_equip_volunteer_shock_brigades_desc:0 "Re-arm the White brigades with rifles and guns — at the communes' expense."

 glp_diplo.1.t:0 "The Kharkov Question"
 glp_diplo.1.d:0 "A delegation from Gulyaypole asks for a defence pact and access. The Kremlin must decide whether Makhno is an ally or a plague."
 glp_diplo.1.a:0 "Guarantee the Free Territory"
 glp_diplo.1.b:0 "Do not deal with anarchists"
 glp_diplo.2.t:0 "A Probe from the Steppe"
 glp_diplo.2.d:0 "Makhno offers Berlin guarantees and military access across the steppe. The General Staff weighs the scandal against the use."
 glp_diplo.2.a:0 "Sign the guarantees"
 glp_diplo.2.b:0 "Refuse"
 glp_diplo.3.t:0 "The Black Sea and the Foreign Office"
 glp_diplo.3.d:0 "London is offered a pact with Gulyaypole: Crimean ports in exchange for a guarantee of independence."
 glp_diplo.3.a:0 "Give guarantees"
 glp_diplo.3.b:0 "Stay out"
 glp_diplo.11.t:0 "The Pact is Sealed"
 glp_diplo.11.d:0 "A foreign power has guaranteed the Free Territory and opened military access. This is calculation, not friendship."
 glp_diplo.11.a:0 "So long as they do not betray first"
 glp_diplo.12.t:0 "A Capital Says No"
 glp_diplo.12.d:0 "The delegation was shown the door. The alliance is paper without a seal. The communes will remember."
 glp_diplo.12.a:0 "Then we stand alone"
 glp_crisis.1.t:0 "Moscow's Ultimatum"
 glp_crisis.1.d:0 "The Narkomindel demands a grain levy and the disarming of border kurens. Refusal, Moscow says, means 'liquidation of banditry'."
 glp_crisis.1.a:0 "Ship the grain — buy a year"
 glp_crisis.1.b:0 "The black banner does not bend"
 glp_crisis.2.t:0 "The Southern Abscess"
 glp_crisis.2.d:0 "Makhno refused tribute. The General Staff wants claims drawn on the Donbass and Kharkov land."
 glp_crisis.2.a:0 "Prepare the campaign"
 glp_crisis.2.b:0 "Wait"
 glp_crisis.3.t:0 "Moscow Sharpens the Scythe"
 glp_crisis.3.d:0 "Zadov's scouts report a casus belli is ready. The steppe must meet the Reds in the saddle."
 glp_crisis.3.a:0 "To the tachankas"
 glp_crisis.10.t:0 "Grigoriev Breaks Ranks"
 glp_crisis.10.d:0 "The ataman wants separate kurens and the right to requisition. RIA staff demand one statute. Batko must choose."
 glp_crisis.10.a:0 "Give Grigoriev his head"
 glp_crisis.10.b:0 "Clip the ataman's wings"
 glp_lab_bonus:0 "Laboratories of the Free Communes"

 glp_crisis.20.t:0 "Zadov versus Volin"
 glp_crisis.20.d:0 "Counter-intelligence wants emergency powers. Volin wants communal courts. The staff is splitting."
 glp_crisis.20.a:0 "Powers to Zadov"
 glp_crisis.20.b:0 "The word to Volin and the assemblies"
 glp_crisis.30.t:0 "Blood on the Batko's Kerchief"
 glp_crisis.30.d:0 "Makhno coughs blood after a review. The doctors say consumption. The army waits to hear who will speak in his name."
 glp_crisis.30.a:0 "Put the Batko in the lazaret"
 glp_crisis.30.b:0 "He stays in the saddle"
 glp_crisis.40.t:0 "Semyonov Breaks His Oath"
 glp_crisis.40.d:0 "Semyonov's Cossacks refuse a commune levy and demand a separate corps. Either a trial or the epaulettes."
 glp_crisis.40.a:0 "Disarm the Semyonov men"
 glp_crisis.40.b:0 "Give them a corps — so long as they fight"
 glp_crisis.10.c:0 "Execute the ataman"
 glp_crisis.10.w:0 "Share the rule with Grigoriev"
 glp_crisis.30.c:0 "Convene the Atamans' Council"
 glp_crisis.30.w:0 "The free territory without the Batko"
 glp_crisis.31.t:0 "Who Speaks for the RIA"
 glp_crisis.31.d:0 "The assembly of commanders chooses the successor. Three candidates, each with a price: Vdovychenko holds the partisans together, Belash leads the staff, Voline guards the banner."
 glp_crisis.31.a:0 "Vdovychenko — partisan chief"
 glp_crisis.31.b:0 "Belash — chief of staff"
 glp_crisis.31.c:0 "Voline — voice of anarchy"
 glp_crisis.41.t:0 "Emigration or 'Parallel Staff'"
 glp_crisis.41.d:0 "Half a year after the revolt. Some of the emigre officers want to leave for Europe, others demand their own staff and a 'free' structure beside the RIA."
 glp_crisis.41.a:0 "Let them go — the steppe is cleansed"
 glp_crisis.41.b:0 "Form a 'parallel staff' around Skoblin"
 glp_crisis.42.t:0 "A Reckoning on the Steppe"
 glp_crisis.42.d:0 "The RIA staff demands a final answer: either the white free corps stays at hand, or it goes beyond the Dniester."
 glp_crisis.42.a:0 "The steppe is cleansed"
 glp_crisis.42.b:0 "Concede to Skoblin"
 glp_crisis.42.c:0 "Skoblin goes"
 GLP_occupation_soviets:0 "Free Soviets on Occupied Land"
 GLP_found_kiev_free_soviet:0 "Kiev Free Soviet"
 GLP_found_kiev_free_soviet_desc:0 "Raise a soviet in occupied Kiev and cut resistance at the price of rations."
 GLP_found_odessa_port_soviet:0 "Odessa Port Soviet"
 GLP_found_odessa_port_soviet_desc:0 "Dockers under the black flag — convoys and yards."
 GLP_found_rostov_raid_soviet:0 "Rostov Raid Soviet"
 GLP_found_rostov_raid_soviet_desc:0 "Dig in on the Don and lift trophy stores."
 GLP_found_kuban_cossack_soviet:0 "Kuban Cossack Assembly"
 GLP_found_kuban_cossack_soviet_desc:0 "Draw Kuban riders into the RIA — at the communes' calm."
 GLP_steppe_raid_on_border:0 "Steppe Raid Behind the Lines"
 GLP_steppe_raid_on_border_desc:0 "Throw a kuren across the line. Sometimes trophies, sometimes corpses and grumbling."

 glp_diplo.21.t:0 "Reds and Blacks"
 glp_diplo.21.d:0 "Moscow has recognized Gulyaypole. Berlin reads it as a Soviet foothold on the steppe."
 glp_diplo.21.a:0 "Lock down the Balkans"
 glp_diplo.22.t:0 "A Neighbour beyond the Dniester"
 glp_diplo.22.d:0 "Bucharest does not want the black banner on Bessarabia. The king orders the marches stiffened."
 glp_diplo.22.a:0 "Close the border"
 glp_diplo.23.t:0 "A Steppe Experiment"
 glp_diplo.23.d:0 "The Foreign Office watches the Moscow–Makhno pact. London does not seek a war — only a file."
 glp_diplo.23.a:0 "Enter it in the dossier"
 glp_diplo.24.t:0 "A Foreign Flag over the Steppe"
 glp_diplo.24.d:0 "Gulyaypole seeks a patron who is not the Kremlin. To Moscow this is no longer a gang, but an enemy bridgehead."
 glp_diplo.24.a:0 "Prepare the southern fist"
 glp_diplo.25.t:0 "An Axis on the Black Sea"
 glp_diplo.25.d:0 "Berlin has taken Makhno's hand. London cannot leave the Black Sea ports unwatched."
 glp_diplo.25.a:0 "Contain them both"
 glp_diplo.26.t:0 "The Entente at Perekop"
 glp_diplo.26.d:0 "Britain has stood surety for the Free Territory. In Berlin that is a blow to any future drive east."
 glp_diplo.26.a:0 "Note it and do not forget"
 glp_diplo.30.t:0 "To Each Their Own Freedom"
 glp_diplo.30.d:0 "Makhno has refused every banner. No surety — so each neighbour watches his own frontier."
 glp_diplo.30.a:0 "Let them sit on the steppe"
