 tachanka_equipment_2:0 "Бронированная тачанка прорыва обр. 1938 г."
 tachanka_equipment_2_desc:0 "Тачанка со стальными щитками и спаренной пулемётной установкой."
 tachanka_equipment_3:0 "Бронеавтомобиль «Воля» обр. 1939 г."
 tachanka_equipment_3_desc:0 "Полугусеничный броневик с двумя пулемётными башнями."
