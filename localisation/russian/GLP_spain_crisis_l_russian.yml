l_russian:
 # ================================================================
 #  Модуль «Иберійскій пожаръ и Чёрный Интернаціоналъ»
 # ================================================================

 # --- Событіе «Иберійскій пожаръ» (іюль 1936) ---
 glp_spain.1.t:0 "§WИБЕРІЙСКІЙ ПОЖАРЪ§!"
 glp_spain.1.d:0 "§WГУЛЯЙ-ПОЛЕ§!. Изъ Барселоны приходятъ вести: поднялась Каталонія, поднялись синдикаты, и надъ Іберіей полыхаетъ огонь, который, можетъ быть, и есть нашъ огонь. «Набатъ» звонитъ по всѣмъ точкамъ: братья зовуть. Частини РПА уже шепчуться о дальнемъ походѣ — черезъ моря и горы, къ огню.§!"
 glp_spain.1.a:0 "Братья зовуть! Всё для Каталоніи!"
 glp_spain.1.b:0 "Поможемъ тайно"
 glp_spain.1.c:0 "Наши рубѣжи важнѣе"

 # --- Майскіе дні въ Барселонѣ (май 1937) ---
 glp_barcelona.1.t:0 "§WМАЙСКІЕ ДНІ ВЪ БАРСЕЛОНѢ§!"
 glp_barcelona.1.d:0 "§WБАРСЕЛОНА§!. Фабричные міціи переросли въ перестрѣлки, перестрѣлки — въ уличныя битвы. На одной сторонѣ — вольныя синдикаты CNT-FAI, на другой — комиссары НКВД и агенты PCE, и за кѣмъ побѣда — рѣшится въ эти дни. Нашіе связные ждутъ сигналу.§!"
 glp_barcelona.1.a:0 "Чёрный Интернаціоналъ бьётъ первымъ"
 glp_barcelona.1.b:0 "Діючемо тихо"
 glp_barcelona.1.c:0 "Пусть рѣшаєть фронтъ"
 glp_barcelona.1.w:0 "Наблюдаємъ з-підъ тѣни"

 # --- Новини: исходъ майськихъ днівъ ---
 glp_barcelona.2.t:0 "§WВЛАСТЬ СИНДИКАТІВЪ§!"
 glp_barcelona.2.d:0 "§WБАРСЕЛОНА§!. Спецгрупа КРО обезвредила агентівъ НКВД до того, якъ вони встигли сісти до потяга. Фабрики Каталонії й Арагону проголошені вільними, міліція на вулицяхъ, і надъ Барселоною вперше вивісалося чорне прапоръ зъ двома жолудями.§!"
 glp_barcelona.2.a:0 "Свобода або смерть!"
 glp_barcelona.3.t:0 "§WСИЛЬНІШЕ СЛІВО — ПІЛКОВИЙ КОМІСАРЪ§!"
 glp_barcelona.3.d:0 "§WБАРСЕЛОНА§!. Наші люди вивели агентуру зъ міста раніше терміну, але відкритого ходу не було: РГТ вціліла, CNT-FAI дістала лише передих. Зв'язкові доносять: справа не скінчилася, але вікно звужується.§!"
 glp_barcelona.3.a:0 "Справа не скінчилася"
 glp_barcelona.4.t:0 "§WПОРЯДОКЪ ЧУЖОЙ РУКОЮ§!"
 glp_barcelona.4.d:0 "§WМОСКВА§!. Безъ нашої руки Барселона сдана: майскіе дни придушені, вольні міліціі розігнані, а на вулицяхъ — комісари. Зв'язки зъ Гуляйполемъ обриваються: «махновські програми» згорнуті, і у вільній пресі про нихъ більше не пишуть.§!"
 glp_barcelona.4.a:0 "Такъ вийшло"
 glp_barcelona.5.t:0 "§WБАРСЕЛОНА УСПОКОЇЛАСЯ§!"
 glp_barcelona.5.d:0 "§WБАРСЕЛОНА§!. Перестрілки стихли раніше, ніжъ хтось встигъ бити в набат. Фронтъ лишився фронтомъ, а Барселона — містомъ, де знову торгують на ринку. Але всі знають: питання про те, чиїй владі вільніше, відкладене не назавжди.§!"
 glp_barcelona.5.a:0 "Чікаємо"

 # --- Чорноморсько-Іберійський пактъ ---
 glp_bi.1.t:0 "§WЧОРНОМОРСЬКО-ІБЕРІЙСЬКИЙ ПАКТЪ§!"
 glp_bi.1.d:0 "§WГУЛЯЙ-ПОЛЕ§!. На нейтральній воді Чорного моря підписано пактъ: Вільна Територія та вільні синдикати Іберії поєднують зусилля. «Чорний Інтернаціонал» проголошено: вугілля Донбасу та хліб степу — за каталонський вольфрам і синдикалістські майстерні. Відъ Гуляйполя до Барселони — одна вільна артерія.§!"
 glp_bi.1.a:0 "Вольному воля!"

 # --- Назва фракції ---
 GLP_black_international_faction:0 "Чорний Інтернаціонал"

 # --- Категорія та рішення «Іспанський маршрут» ---
 GLP_spain_smuggling_routes:0 "Іспанський маршрут"
 GLP_spain_black_sea_run:0 "Чорноморський прорив"
 GLP_spain_black_sea_run_desc:0 "Конвой з 1500 гвинтівок іде через Босфор. Шанс прориву — 65%. При перехопленні Regia Marina конвой втрачено, а Рим надішле ноту протесту."
 GLP_spain_balkan_underground_traffic:0 "Балканський підпільний трафік"
 GLP_spain_balkan_underground_traffic_desc:0 "Прихована доставка невеликими партіями поїздами через Румунію та Югославію. Шанс — 85%."
 GLP_spain_french_syndicate_smuggling:0 "Французька синдикалістська контрабанда"
 GLP_spain_french_syndicate_smuggling_desc:0 "Вантаж веде через Піренеї по власних лініях синдикалісти з Франції. Шанс — 95%, плюс теплі стосунки з лівими у Франції."
 GLP_spain_send_kro_group:0 "Надсилання спеціальної групи КРО"
 GLP_spain_send_kro_group_desc:0 "Група Льва Задова йде до Барселони: виведення з лагу агентів НКВД та PCE до «травневих днів». Без цього кроку анархистам не встояти."
 GLP_spain_brigade_homecoming:0 "Повернення бригади"
 GLP_spain_brigade_homecoming_desc:0 "Добровольці бригади РПАУ повертаються з Іберійського фронту. Белаш і Каретник отримують рису «Іспанський закалю»."
 GLP_spain_black_international_pact:0 "Чорноморсько-Іберійський пакт"
 GLP_spain_black_international_pact_desc:0 "Створення фракції «Чорний Інтернаціонал» з Іспанією та взаємні економічні духи. Доступно після успішних «травневих днів» з 1938 року."

 # --- Духи ---
 GLP_idea_spanish_brigade:0 "Добровольча бригада РПАУ"
 GLP_idea_spanish_brigade_desc:0 "Частини РПАУ пішли на Іберійський фронт: добровольці йдуть охотніше, а досвід вуличних боїв лишається у полках."
 GLP_idea_nabat_disloyal:0 "«Набат» замовк"
 GLP_idea_nabat_disloyal_desc:0 "Мережа зв'язкових «Набат» розчарована відмовою: чутки замінюють свідоцтва, а свідоцтва — чутки. На 365 днів."
 GLP_idea_catalan_wolfram_syndicate_workshops:0 "Каталонський вольфрам і синдикалістські майстерні"
 GLP_idea_catalan_wolfram_syndicate_workshops_desc:0 "Вольфрам Піренеїв і майстерні Барселони йдуть на озброєння: заводи озброєнь працюють швидше, і дослідження йдуть сміливіше. (У 1.19 наційний дух не видає ресурсів — зараховано бонусами виробництва.)"
 GLP_idea_ukrainian_coal_and_grain:0 "Українське вугілля і хліб"
 GLP_idea_ukrainian_coal_and_grain_desc:0 "Вугілля Донбасу і хліб степу йдуть до Іберії: заводи будуються швидше, але на внутрішній ринок лишається менше. (У 1.19 наційний дух не видає ресурсів — зараховано бонусами виробництва.)"

 # --- Риси командирів ---
 GLP_spanish_tempering:0 "Іспанський закалю"
 GLP_spanish_tempering_desc:0 "Повернувся з Іберійського фронту: вуличний бій, кіннота через гірські проходи. Організація та розвідка — як у травневих днів."

 # --- Модифікатори думок ---
 GLP_italian_protest_note:0 "Нота протесту (перехоплення конвою)"
 GLP_french_syndicalist_warmth:0 "Французькі синдикалісти ведуть наш вантаж"
 GLP_spanish_syndicate_alliance:0 "Вільна Іспанія синдикалів"
 GLP_spanish_soviet_cold:0 "Прорадянська Барселона"
 GLP_soviet_anarchy_resentment:0 "Незадоволення анархістським втручанством"
