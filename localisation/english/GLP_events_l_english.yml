l_english:
 # News Events
 glp_news.1.t:0 "§WREBIRTH OF FREE GULYAYPOLE§!"
 glp_news.1.d:0 "§WGULYAYPOLE. Across the Black Sea steppes and the industrial giants of Donbass, the Free Territory has resumed activity under Batko Makhno and the Revolutionary Insurgent Army (RIA). Free peasant communes and factory committees have taken control, proclaiming a stateless society ready to defend freedom by force of arms.§!"
 glp_news.1.a:0 "§WLiberty or Death! Anarchy is the Mother of Order!§!"

 glp_news.2.t:0 "§WFOURTH CONGRESS OF PEASANTS & WORKERS§!"
 glp_news.2.d:0 "§WGULYAYPOLE. Delegates from hundreds of communes, mines, and Black Guard regiments have proclaimed the Federation of Free Soviets.§!"
 glp_news.2.a:0 "§WLong live the free order!§!"

 glp_news.3.t:0 "§WLEGENDARY TACHANKAS RIDE THE STEPPE§!"
 glp_news.3.d:0 "§WGULYAYPOLE. Mass production of legendary machine-gun carriages is underway across southern workshops.§!"
 glp_news.3.a:0 "§WThe steppe belongs to the free!§!"
 glp_news.3.b:0 "§WFormidable news from the steppes§!"

 glp_news.4.t:0 "§WFORMATION OF THE BLACK INTERNATIONAL§!"
 glp_news.4.d:0 "§WGULYAYPOLE. Syndicalist and anarchist delegations from across the globe have gathered to establish the Black International.§!"
 glp_news.4.a:0 "§WThe flame of revolution will never die!§!"

 glp_news.5.t:0 "§WNEW FOREIGN ALLIANCE RATIFIED§!"
 glp_news.5.d:0 "§WGULYAYPOLE. The Revolutionary Military Council has ratified an international treaty of mutual military cooperation.§!"
 glp_news.5.a:0 "§WThe enemy shall be defeated!§!"

 glp_news.6.t:0 "§WTRIUMPH OF THE FREE PEOPLE§!"
 glp_news.6.d:0 "§WGULYAYPOLE. The Free Territory has proven the invincible strength of stateless fraternity.§!"
 glp_news.6.a:0 "§WGlory to Batko Makhno and the free people!§!"

 # Decisions (16 Unique Decisions)
 GLP_revolutionary_military_ops:0 "§WRIA Military Operations & Militia§!"
 GLP_syndicate_industrial_initiatives:0 "§WFree Syndicate Industrial Initiatives§!"
 GLP_peasant_agrarian_communes:0 "§WPeasant Communes & Food Supply§!"
 GLP_kontrrazvedka_and_order:0 "§WKontrrazvedka & Internal Security§!"

 GLP_mobilize_black_guard_reserves:0 "§WMobilize Black Guard Reserves§!"
 GLP_conduct_cavalry_partisan_raid:0 "§WConduct Cavalry Partisan Raid§!"
 GLP_commission_armored_train:0 "§WCommission Armored Train 'Liberty or Death'§!"
 GLP_send_brigade_to_cnt_fai:0 "§WSend Volunteer Corps to CNT-FAI§!"
 GLP_establish_dnieper_partisan_camps:0 "§WEstablish Dnieper Partisan Bases§!"
 GLP_form_flying_tachanka_detachments:0 "§WForm Flying Tachanka Detachments§!"

 GLP_donbass_miners_initiative:0 "§WDonbass Miners' Stakhanovite Drive§!"
 GLP_dnieper_rural_electrification:0 "§WDnieper Dam Rural Electrification§!"
 GLP_expand_ekaterinoslav_armories:0 "§WExpand Ekaterinoslav Armories§!"
 GLP_build_armored_rail_scouts:0 "§WMalyshev Plant Armored Rail Scouts§!"

 GLP_emergency_grain_relief:0 "§WEmergency Grain Relief to Cities§!"
 GLP_organize_communal_tractor_brigades:0 "§WOrganize Communal Tractor Brigades§!"
 GLP_establish_strategic_grain_reserve:0 "§WEstablish Strategic Grain Reserve§!"

 GLP_crackdown_on_crimean_white_cells:0 "§WCrackdown on Crimean White-Guard Cells§!"
 GLP_purge_cheka_provocateurs:0 "§WPurge Cheka Infiltrators§!"
 GLP_assemble_popular_tribunals:0 "§WAssemble Popular Courts of Honor§!"

 # ---------------------------------------------------------------------------
 #  Intro newspaper of a new campaign
 # ---------------------------------------------------------------------------
 glp_news.100.t:0 "§WTHE FREE VOICE OF GULYAYPOLE: a storm gathers over the free steppe§!"
 glp_news.100.d:0 "§WGulyaypole, 1 January 1936. Alternate history.\n\nEighteen years ago, in the fire of 1917, the black banner rose over the Azov steppe. White regiments, the Hetman's guard, German bayonets and Red commissars each promised the peasant here order — and each left with nothing.\n\nContrary to every textbook, the Revolutionary Insurgent Army (Anarcho-Communists of the Bakunin school) was never destroyed. Neither Perekop in 1920, nor the Cheka sweeps of 1921, nor the hungry years finished off the free insurgency. By 1925 Moscow, bled white by war and revolt, signed what it had signed with no one else: a treaty recognising the Free Territory.\n\nSince then, between the Dnieper, the Don and the Crimea, stands the Free Republic of Gulyaypole — the whole south of the former Russian Empire, wrested from every government at once. There is no landlord and no minister here: the works are run by their factory committee, the village by its assembly, and Batko Makhno is still styled a counsellor of the working people rather than a leader.\n\nBut the world is sharpening its bayonets again. Moscow counts our grain and coal as its own, Berlin measures our steppe on its maps, Warsaw eyes the river crossings. The great war is already at the gate — and which side Nestor Ivanovich takes is yours to decide.§!"
 glp_news.100.a:0 "§WLet the thunder roll!§!"
 glp_news.100.b:0 "§WWe wrote the Batko off too soon...§!"
 glp_news.100.c:0 "§WA strange state with no government§!"

 # --------------------------------------------------------------------
 #  Event localisation missing before the audit (stage 5)
 # --------------------------------------------------------------------
 glp.1.t:0 "§WCouncil of the Revolutionary Military Committee§!"
 glp.1.d:0 "§WCommanders and commune delegates gathered at the RIAU staff. Decisions are taken together — and carried out without delay.§!"
 glp.1.a:0 "§WSo the free assembly ruled§!"
 glp.2.t:0 "§WAssembly of the Free Communes§!"
 glp.2.d:0 "§WDelegates of villages and factory committees came to Gulyaypole to settle accounts and disputes without officials.§!"
 glp.2.a:0 "§WOrder rests on agreement§!"
 glp.3.t:0 "§WReinforcements for the Insurgent Army§!"
 glp.3.d:0 "§WFrom farmsteads and mining settlements new volunteers have joined the Black Guard — with their own horses and their fathers' rifles.§!"
 glp.3.a:0 "§WTake the brothers into the ranks§!"
 glp.10.t:0 "§WCNT-FAI delegation arrives in Gulyaypole§!"
 glp.10.d:0 "§WGULYAYPOLE. Spanish anarcho-syndicalists of the CNT-FAI stepped off the train under black banners. They bring the experience of Barcelona's worker collectives, a request for help — and an offer to exchange engineers and weapon blueprints.§!"
 glp.10.a:0 "§WVolunteers for our brothers in struggle§!"
 glp.10.b:0 "§WTake Barcelona's industrial know-how§!"
 glp.11.t:0 "§WSteppe manoeuvres of the tachanka detachments§!"
 glp.11.d:0 "§WEKATERINOSLAV REGION. Five hundred tachankas fought a mock engagement on the sun-scorched plain, wheeling at the gallop and escaping before the enemy could unlimber a battery. Belash's staff filled three notebooks.§!"
 glp.11.a:0 "§WTrain as we intend to fight§!"
 glp.11.b:0 "§WIssue new rifles to the regiments§!"
 glp.12.t:0 "§WThe Dnieper dam powers the free workshops§!"
 glp.12.d:0 "§WZAPOROZHYE. The turbines are at full output. The current flows not to ministries but to forges, mills and armouries of the Free Territory. Engineers argue whether to build new shops or invest in electrical science.§!"
 glp.12.a:0 "§WRaise the shops beside the dam§!"
 glp.12.b:0 "§WInvest in electrical science§!"
 glp.13.t:0 "§WDonbass: the coal syndicates unite§!"
 glp.13.d:0 "§WYUZOVKA. The miners' committees merged their artels into a single free syndicate. Coal will move on one schedule — but the hewers themselves will dispose of it. The war council asks for a share for the arms works.§!"
 glp.13.a:0 "§WCoal to the arms workshops§!"
 glp.13.b:0 "§WProfits back to the mining settlements§!"
 glp.14.t:0 "§WThe heavy armoured train leaves the depot§!"
 glp.14.d:0 "§WEKATERINOSLAV. Riveted plating, a gun turret, machine-gun casemates and a workshop car. 'Liberty or death' is painted along her side in white. The drivers swear they will take her as far as Warsaw.§!"
 glp.14.a:0 "§WLet the steppe hear her whistle§!"
 glp.15.t:0 "§WThe great autumn fair at Gulyaypole§!"
 glp.15.d:0 "§WGULYAYPOLE. Carts came from across the steppe: grain, horses, leather, Donbass coal and Crimean salt. No excise and no constable — only free trade and a handshake. After the trading, young men enlist by whole streets.§!"
 glp.15.a:0 "§WThe fair feeds and reconciles§!"
 glp.15.b:0 "§WEnlist the volunteers on the spot§!"
 glp.16.t:0 "§WSevastopol: the revolutionary fleet reborn§!"
 glp.16.d:0 "§WSEVASTOPOL. Sailors' committees raised ships abandoned by every government at once. Boilers overhauled, guns uncrated. The question is whether to lay down a yard or first train the crews.§!"
 glp.16.a:0 "§WLay down a yard at Sevastopol§!"
 glp.16.b:0 "§WTrain the crews first§!"
 glp.17.t:0 "§WThe Batko tours the forward posts§!"
 glp.17.d:0 "§WFRONTIER BELT. Makhno rode the posts from the Dnieper to the Don without an escort, sleeping at the campfires. Where he passed, muster rolls fill up and talk of 'coming to terms with Moscow' dies away.§!"
 glp.17.a:0 "§WThe Batko's word binds tighter than an order§!"
 glp.17.b:0 "§WTurn the tour into assemblies and agitation§!"
 glp.18.t:0 "§WThe free communes bring in a record harvest§!"
 glp.18.d:0 "§WTAURIDA. The communes reported to the assembly: grain enough to eat, to store and to trade with the towns. The argument is whether to share the surplus out or put it into new workshops.§!"
 glp.18.a:0 "§WShare it out — let the people grow strong§!"
 glp.18.b:0 "§WPut the surplus into workshops§!"
 glp.19.t:0 "§WRadio 'Voice of Liberty' goes on air§!"
 glp.19.d:0 "§WGULYAYPOLE. A mast rose above the old district office. The first broadcast was heard in Kharkov, Rostov and — if intercepts are to be believed — even in Warsaw.§!"
 glp.19.a:0 "§WCarry word of the free order to the world§!"
 glp.19.b:0 "§WBroadcast to the enemy's troops§!"
 glp.20.t:0 "§WWar council of the RevVoenSovet§!"
 glp.20.d:0 "§WGULYAYPOLE. Belash spread out the maps of the south: rail junctions, crossings, ravines where a regiment can hide. Karetnik demands cavalry corps, Shchus freedom to raid, Zadov intelligence. All agree on one thing: fight our own way.§!"
 glp.20.a:0 "§WAdopt our own cavalry doctrine§!"
 glp.20.b:0 "§WLearn on manoeuvres, not on paper§!"
 glp.21.t:0 "§WZadov's counter-intelligence rolls up a network§!"
 glp.21.d:0 "§WEKATERINOSLAV. The department took the whole chain: safe houses, ciphers, couriers and an arms cache. Zadov reported briefly: 'Clean work, there will be no noise.'§!"
 glp.21.a:0 "§WAnnounce the case at the assembly§!"
 glp.21.b:0 "§WHand the cache to the regiments§!"
 glp.22.t:0 "§WThe 'Black Petrel' squadron is formed§!"
 glp.22.d:0 "§WSTEPPE AIRFIELD. Aircraft assembled from captured and purchased parts form the first free squadron. The pilots are yesterday's mechanics and cavalrymen; a circled letter A is painted on the fins.§!"
 glp.22.a:0 "§WKeep pace with the age — new machines§!"
 glp.22.b:0 "§WAirfields and workshops first§!"
 glp.23.t:0 "§WCongress of free thought at Ekaterinoslav§!"
 glp.23.d:0 "§WEKATERINOSLAV. Volin gathered writers, teachers and commune delegates: three days of argument about living without a state and not sliding into a new power. The printed pamphlet sold out at once.§!"
 glp.23.a:0 "§WPrint it and spread it through the communes§!"
 glp.23.b:0 "§WTurn the argument into practice§!"
 glp.24.t:0 "§WJubilee of the stateless republic§!"
 glp.24.d:0 "§WGULYAYPOLE. Tachankas on parade, a band, tables down the whole street. The Free Territory has been buried three times — and it still stands, with no tsar, no commissar and no master.§!"
 glp.24.a:0 "§WGlory to the free people!§!"
 glp_cnt_bonus:0 "§WExperience of the Barcelona collectives§!"
 glp_electrification:0 "§WElectrification of the free steppe§!"
 glp_cav_doctrine:0 "§WThe Gulyaypole cavalry doctrine§!"
 glp_air_bonus:0 "§WThe 'Black Petrel' flying school§!"
 glp_theory_bonus:0 "§WFree scientific thought§!"
 glp_news.1.b:0 "§WMoscow: a temporary misunderstanding in the south§!"
 glp_news.1.c:0 "§WA curious experiment — but how will it end?§!"
 glp_news.2.b:0 "§WA congress without a party is not power§!"
 glp_news.4.b:0 "§WA Black International? Let them shout§!"
 glp_news.5.b:0 "§WThis treaty is no concern of ours§!"
 glp_news.5.c:0 "§WNote the new alignment§!"
 glp_news.6.b:0 "§WAcknowledge the obvious§!"
 glp_press.8.c:0 "§WTake note§!"
 glp_news.7.t:0 "§WOld Enemies in the RIA Ranks§!"
 glp_news.7.d:0 "§WFormer White officers, soldiers of broken armies and free spirits from across Europe gather beneath the black flag. 'Against the common enemy we stand together,' declare veterans as they enlist in the Batko's regiments.§!"
 glp_news.7.a:0 "§WA rifle and a horse for every free man!§!"
 glp_news.7.b:0 "§WAn unexpected alliance in the steppes§!"
 glp_trophy.1.t:0 "§WTrophy Teams of the RIA§!"
 glp_trophy.1.d:0 "§WBatko's fighters have stripped another beaten enemy unit clean: Gulyaypole's armouries brim with captured rifles, gear and vehicles. From volunteers and prisoners willing to serve the Free Territory, a new detachment has been raised — with its own maintenance company, so that the enemy's weapons keep serving the revolution.§!"
 glp_trophy.1.a:0 "§WAnarchy is the mother of order!§!"

 glp_white.1.t:0 "§WStaff Quarrel§!"
 glp_white.1.d:0 "§WA month after Skoblin, Turkul and Semyonov were called, RIA headquarters is splitting. Makhnovists demand the 'gold-epaulettes' be disarmed. The emigres demand full command of the shock brigades.§!"
 glp_white.1.a:0 "§WBack the generals§!"
 glp_white.1.b:0 "§WBack the Makhnovists§!"

 GLP_reconciliation_with_past:0 "§WReconciliation with the Past§!"
 GLP_equip_volunteer_shock_brigades:0 "§WEquip Volunteer Shock Brigades§!"
 GLP_equip_volunteer_shock_brigades_desc:0 "§WRe-arm the White brigades with rifles and guns — at the communes' expense.§!"

 glp_diplo.1.t:0 "§WThe Kharkov Question§!"
 glp_diplo.1.d:0 "§WA delegation from Gulyaypole asks for a defence pact and access. The Kremlin must decide whether Makhno is an ally or a plague.§!"
 glp_diplo.1.a:0 "§WGuarantee the Free Territory§!"
 glp_diplo.1.b:0 "§WDo not deal with anarchists§!"
 glp_diplo.2.t:0 "§WA Probe from the Steppe§!"
 glp_diplo.2.d:0 "§WMakhno offers Berlin guarantees and military access across the steppe. The General Staff weighs the scandal against the use.§!"
 glp_diplo.2.a:0 "§WSign the guarantees§!"
 glp_diplo.2.b:0 "§WRefuse§!"
 glp_diplo.3.t:0 "§WThe Black Sea and the Foreign Office§!"
 glp_diplo.3.d:0 "§WLondon is offered a pact with Gulyaypole: Crimean ports in exchange for a guarantee of independence.§!"
 glp_diplo.3.a:0 "§WGive guarantees§!"
 glp_diplo.3.b:0 "§WStay out§!"
 glp_diplo.11.t:0 "§WThe Pact is Sealed§!"
 glp_diplo.11.d:0 "§WA foreign power has guaranteed the Free Territory and opened military access. This is calculation, not friendship.§!"
 glp_diplo.11.a:0 "§WSo long as they do not betray first§!"
 glp_diplo.12.t:0 "§WA Capital Says No§!"
 glp_diplo.12.d:0 "§WThe delegation was shown the door. The alliance is paper without a seal. The communes will remember.§!"
 glp_diplo.12.a:0 "§WThen we stand alone§!"
 glp_crisis.1.t:0 "§WMoscow's Ultimatum§!"
 glp_crisis.1.d:0 "§WThe Narkomindel demands a grain levy and the disarming of border kurens. Refusal, Moscow says, means 'liquidation of banditry'.§!"
 glp_crisis.1.a:0 "§WShip the grain — buy a year§!"
 glp_crisis.1.b:0 "§WThe black banner does not bend§!"
 glp_crisis.2.t:0 "§WThe Southern Abscess§!"
 glp_crisis.2.d:0 "§WMakhno refused tribute. The General Staff wants claims drawn on the Donbass and Kharkov land.§!"
 glp_crisis.2.a:0 "§WPrepare the campaign§!"
 glp_crisis.2.b:0 "§WWait§!"
 glp_crisis.3.t:0 "§WMoscow Sharpens the Scythe§!"
 glp_crisis.3.d:0 "§WZadov's scouts report a casus belli is ready. The steppe must meet the Reds in the saddle.§!"
 glp_crisis.3.a:0 "§WTo the tachankas§!"
 glp_crisis.10.t:0 "§WGrigoriev Breaks Ranks§!"
 glp_crisis.10.d:0 "§WThe ataman wants separate kurens and the right to requisition. RIA staff demand one statute. Batko must choose.§!"
 glp_crisis.10.a:0 "§WGive Grigoriev his head§!"
 glp_crisis.10.b:0 "§WClip the ataman's wings§!"
 glp_lab_bonus:0 "§WLaboratories of the Free Communes§!"

 glp_crisis.20.t:0 "§WZadov versus Volin§!"
 glp_crisis.20.d:0 "§WCounter-intelligence wants emergency powers. Volin wants communal courts. The staff is splitting.§!"
 glp_crisis.20.a:0 "§WPowers to Zadov§!"
 glp_crisis.20.b:0 "§WThe word to Volin and the assemblies§!"
 glp_crisis.30.t:0 "§WBlood on the Batko's Kerchief§!"
 glp_crisis.30.d:0 "§WMakhno coughs blood after a review. The doctors say consumption. The army waits to hear who will speak in his name.§!"
 glp_crisis.30.a:0 "§WPut the Batko in the lazaret§!"
 glp_crisis.30.b:0 "§WHe stays in the saddle§!"
 glp_crisis.40.t:0 "§WSemyonov Breaks His Oath§!"
 glp_crisis.40.d:0 "§WSemyonov's Cossacks refuse a commune levy and demand a separate corps. Either a trial or the epaulettes.§!"
 glp_crisis.40.a:0 "§WDisarm the Semyonov men§!"
 glp_crisis.40.b:0 "§WGive them a corps — so long as they fight§!"
 glp_crisis.10.c:0 "§WExecute the ataman§!"
 glp_crisis.10.w:0 "§WShare the rule with Grigoriev§!"
 glp_crisis.30.c:0 "§WConvene the Atamans' Council§!"
 glp_crisis.30.w:0 "§WThe free territory without the Batko§!"
 glp_crisis.31.t:0 "§WWho Speaks for the RIA§!"
 glp_crisis.31.d:0 "§WThe assembly of commanders chooses the successor. Three candidates, each with a price: Vdovychenko holds the partisans together, Belash leads the staff, Voline guards the banner.§!"
 glp_crisis.31.a:0 "§WVdovychenko — partisan chief§!"
 glp_crisis.31.b:0 "§WBelash — chief of staff§!"
 glp_crisis.31.c:0 "§WVoline — voice of anarchy§!"
 glp_crisis.41.t:0 "§WEmigration or 'Parallel Staff'§!"
 glp_crisis.41.d:0 "§WHalf a year after the revolt. Some of the emigre officers want to leave for Europe, others demand their own staff and a 'free' structure beside the RIA.§!"
 glp_crisis.41.a:0 "§WLet them go — the steppe is cleansed§!"
 glp_crisis.41.b:0 "§WForm a 'parallel staff' around Skoblin§!"
 glp_crisis.42.t:0 "§WA Reckoning on the Steppe§!"
 glp_crisis.42.d:0 "§WThe RIA staff demands a final answer: either the white free corps stays at hand, or it goes beyond the Dniester.§!"
 glp_crisis.42.a:0 "§WThe steppe is cleansed§!"
 glp_crisis.42.b:0 "§WConcede to Skoblin§!"
 glp_crisis.42.c:0 "§WSkoblin goes§!"
 glp_raid.1.t:0 "§WRPA Raid§!"
 glp_raid.1.d:0 "§WA partisan raid across the front line.§!"
 glp_raid.1.a:0 "§WCover our traces§!"
 glp_spanish.1.t:0 "§WNews from the Pyrenees§!"
 glp_spanish.1.d:0 "§WA dispatch from the Spanish front.§!"
 glp_spanish.1.a:0 "§WNote for the record§!"
 GLP_occupation_soviets:0 "§WFree Soviets on Occupied Land§!"
 GLP_found_kiev_free_soviet:0 "§WKiev Free Soviet§!"
 GLP_found_kiev_free_soviet_desc:0 "§WRaise a soviet in occupied Kiev and cut resistance at the price of rations.§!"
 GLP_found_odessa_port_soviet:0 "§WOdessa Port Soviet§!"
 GLP_found_odessa_port_soviet_desc:0 "§WDockers under the black flag — convoys and yards.§!"
 GLP_found_rostov_raid_soviet:0 "§WRostov Raid Soviet§!"
 GLP_found_rostov_raid_soviet_desc:0 "§WDig in on the Don and lift trophy stores.§!"
 GLP_found_kuban_cossack_soviet:0 "§WKuban Cossack Assembly§!"
 GLP_found_kuban_cossack_soviet_desc:0 "§WDraw Kuban riders into the RIA — at the communes' calm.§!"
 GLP_steppe_raid_on_border:0 "§WSteppe Raid Behind the Lines§!"
 GLP_steppe_raid_on_border_desc:0 "§WThrow a kuren across the line. Sometimes trophies, sometimes corpses and grumbling.§!"

 glp_diplo.21.t:0 "§WReds and Blacks§!"
 glp_diplo.21.d:0 "§WMoscow has recognized Gulyaypole. Berlin reads it as a Soviet foothold on the steppe.§!"
 glp_diplo.21.a:0 "§WLock down the Balkans§!"
 glp_diplo.22.t:0 "§WA Neighbour beyond the Dniester§!"
 glp_diplo.22.d:0 "§WBucharest does not want the black banner on Bessarabia. The king orders the marches stiffened.§!"
 glp_diplo.22.a:0 "§WClose the border§!"
 glp_diplo.23.t:0 "§WA Steppe Experiment§!"
 glp_diplo.23.d:0 "§WThe Foreign Office watches the Moscow–Makhno pact. London does not seek a war — only a file.§!"
 glp_diplo.23.a:0 "§WEnter it in the dossier§!"
 glp_diplo.24.t:0 "§WA Foreign Flag over the Steppe§!"
 glp_diplo.24.d:0 "§WGulyaypole seeks a patron who is not the Kremlin. To Moscow this is no longer a gang, but an enemy bridgehead.§!"
 glp_diplo.24.a:0 "§WPrepare the southern fist§!"
 glp_diplo.25.t:0 "§WAn Axis on the Black Sea§!"
 glp_diplo.25.d:0 "§WBerlin has taken Makhno's hand. London cannot leave the Black Sea ports unwatched.§!"
 glp_diplo.25.a:0 "§WContain them both§!"
 glp_diplo.26.t:0 "§WThe Entente at Perekop§!"
 glp_diplo.26.d:0 "§WBritain has stood surety for the Free Territory. In Berlin that is a blow to any future drive east.§!"
 glp_diplo.26.a:0 "§WNote it and do not forget§!"
 glp_diplo.30.t:0 "§WTo Each Their Own Freedom§!"
 glp_diplo.30.d:0 "§WMakhno has refused every banner. No surety — so each neighbour watches his own frontier.§!"
 glp_diplo.30.a:0 "§WLet them sit on the steppe§!"
 glp_cinematic_intro.1.t:0 "§WLaunch Gulyaipole Intro§!"
 glp_cinematic_intro.1.d:0 "§WHidden system event to launch the intro cinematic.§!"
