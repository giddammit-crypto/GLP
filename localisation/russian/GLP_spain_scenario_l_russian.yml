l_russian:
 glp_spain2.1.t:0 "§WПервый контакт с колонной Дуррути§!"
 glp_spain2.1.d:0 "§WПосланники Буэнавентуры Дуррути прибыли в Гуляйполе с вестями о борьбе НКТ-ФАИ в Испании. Они просят прислать опытных военных советников из нашей Черной гвардии.§!"
 glp_spain2.1.a:0 "§WОтправить наших лучших командиров в Арагон!§!"
 glp_spain2.1.b:0 "§WМы можем предложить лишь символическую солидарность.§!"
 glp_spain2.2.t:0 "§WБуэнавентура Дуррути: Лев Арагона§!"
 glp_spain2.2.d:0 "§WДуррути проявил себя как харизматичный и непреклонный лидер. Его философия тесно переплетается с нашими махновскими принципами. Более тесные связи с его колонной могут стать основой для истинного §WЧерного Интернационала§!.§!"
 glp_spain2.2.a:0 "§WПринять видение Дуррути. Мы стоим вместе!§!"
 glp_spain2.2.b:0 "§WМы будем поддерживать дружеские, но независимые отношения.§!"
 glp_spain2.3.t:0 "§WСмерть Дуррути§!"
 glp_spain2.3.d:0 "§WТрагические новости из Мадрида: Буэнавентура Дуррути пал на фронте в Университетском городке. Вокруг обстоятельств его смерти ходят слухи, многие подозревают причастность НКВД.§!"
 glp_spain2.3.a:0 "§WМы должны расследовать это убийство!§!"
 glp_spain2.3.b:0 "§WТяжелый удар по революции. Оплакать его.§!"
 glp_spain2.3.c:0 "§WНемедленно отправить оружие, чтобы отомстить за него!§!"
 glp_spain2.4.t:0 "§WАрагонский коллектив§!"
 glp_spain2.4.d:0 "§WОтчеты из Арагона подробно описывают успешную коллективизацию сельского хозяйства и промышленности силами НКТ-ФАИ, демонстрируя жизнеспособность анархистской экономики.§!"
 glp_spain2.4.a:0 "§WВдохновляющий пример для всех нас.§!"
 glp_spain2.5.t:0 "§WЧерноморский рейс: Успех§!"
 glp_spain2.5.d:0 "§WНаша тайная партия оружия успешно прорвала блокаду и достигла испанских анархистов.§!"
 glp_spain2.5.a:0 "§WОтличные новости.§!"
 glp_spain2.6.t:0 "§WЧерноморский рейс: Перехват§!"
 glp_spain2.6.d:0 "§WКатастрофа! Итальянские военно-морские патрули перехватили наше замаскированное грузовое судно с оружием для Испании.§!"
 glp_spain2.6.a:0 "§WФашисты заплатят за это.§!"
 glp_spain2.7.t:0 "§WБалканское подполье: Подозрения Румынии§!"
 glp_spain2.7.d:0 "§WРумынские власти с подозрением относятся к внезапному увеличению транзита 'сельскохозяйственной техники' через их территорию.§!"
 glp_spain2.7.a:0 "§WПодкупить пограничников.§!"
 glp_spain2.7.b:0 "§WИзменить маршрут на менее охраняемый.§!"
 glp_spain2.8.t:0 "§WСолидарность французских синдикалистов§!"
 glp_spain2.8.d:0 "§WФранцузская ВКТ согласилась закрыть глаза на наши контрабандные операции через Пиренеи, проявив истинную синдикалистскую солидарность.§!"
 glp_spain2.8.a:0 "§WДа здравствует революция!§!"
 glp_spain2.9.t:0 "§WЗагнанный лидер: Андрес Нин§!"
 glp_spain2.9.d:0 "§WАндрес Нин, лидер ПОУМ, преследуется агентами Сталина в Испании. У нас есть короткое окно, чтобы задействовать оперативников КРО для его спасения.§!"
 glp_spain2.9.a:0 "§WОтправить КРО! Мы должны спасти его.§!"
 glp_spain2.9.b:0 "§WЭто слишком рискованно. Мы не можем вмешиваться.§!"
 glp_spain2.10.t:0 "§WНин спасен!§!"
 glp_spain2.10.d:0 "§WВ ходе дерзкой операции нашим агентам удалось тайно вывезти Андреса Нина из Испании. Он прибыл в Гуляйполе в качестве политического беженца.§!"
 glp_spain2.10.a:0 "§WДобро пожаловать, товарищ Нин.§!"
 glp_spain2.11.t:0 "§WСудьба Нина§!"
 glp_spain2.11.d:0 "§WБез нашего вмешательства Андрес Нин был арестован советскими агентами и жестоко убит. Его смерть - мрачное предупреждение всем антисталинистским левым силам.§!"
 glp_spain2.11.a:0 "§WТрагическая потеря для революции.§!"
 glp_spain2.12.t:0 "§WАнархистская Испания консолидируется§!"
 glp_spain2.12.d:0 "§WНКТ-ФАИ укрепила свой контроль над анархистскими территориями и предложила создать единый фронт.§!"
 glp_spain2.12.a:0 "§WМы присоединимся к ним!§!"
 glp_spain2.12.b:0 "§WПока мы будем наблюдать.§!"
 glp_spain2.13.t:0 "§WСоветский раскол§!"
 glp_spain2.13.d:0 "§WМосква открыто осудила нашу поддержку испанских анархистов, назвав нас 'махновскими вредителями' и саботажниками республиканского дела.§!"
 glp_spain2.13.a:0 "§WПусть кричат.§!"
 glp_spain2.14.t:0 "§WЭмма Гольдман в Гуляйполе§!"
 glp_spain2.14.d:0 "§WИзвестная анархистка Эмма Гольдман прибыла в Гуляйполе, привлекая международное внимание к нашему делу и борьбе в Испании.§!"
 glp_spain2.14.a:0 "§WЗнаменательное событие.§!"
 glp_spain2.15.t:0 "§WКонгресс Черного Интернационала§!"
 glp_spain2.15.d:0 "§WДелегаты из Гуляйполя, Анархистской Испании и французской ВКТ собрались, чтобы официально оформить Черный Интернационал.§!"
 glp_spain2.15.a:0 "§WНовая эра глобальной солидарности!§!"
 glp_spain2.16.t:0 "§WФранко у ворот§!"
 glp_spain2.16.d:0 "§WРеспубликанские силы рушатся. Фашистские войска приближаются к последним оплотам.§!"
 glp_spain2.16.a:0 "§WОтправить всё, что у нас есть, чтобы удержать линию!§!"
 glp_spain2.16.b:0 "§WГотовиться к приему беженцев...§!"
 glp_spain2.17.t:0 "§WИспанские беженцы в Гуляйполе§!"
 glp_spain2.17.d:0 "§WС падением Испании тысячи кадров НКТ-ФАИ и закаленных в боях ветеранов искали убежища на нашей территории.§!"
 glp_spain2.17.a:0 "§WИх опыт усилит нашу Черную гвардию.§!"
 glp_spain2.18.t:0 "§WУроки Иберии§!"
 glp_spain2.18.d:0 "§WГражданская война в Испании закончилась, оставив нам глубокие уроки о международной солидарности, предательстве и цене свободы.§!"
 glp_spain2.18.a:0 "§WМы не забудем.§!"
