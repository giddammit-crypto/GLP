 # ---------------------------------------------------------------------------
 #  Закладка старта и слогъ конца 1920-хъ (главное меню, экранъ выбора страны)
 # ---------------------------------------------------------------------------
 GLP_GATHERING_STORM_DESC:0 "§YГуляйполе, зима 1936 года.§!\n\nСемнадцать лѣтъ минуло съ того дня, какъ вольная степь отбилась и отъ бѣлаго погона, и отъ краснаго комиссара. Между Днѣпромъ и Дономъ стоитъ то, чего не значится ни въ одномъ дипломатическомъ справочникѣ: земля безъ помѣщика, заводъ безъ хозяина, уѣздъ безъ начальства.\n\nВластью здѣсь зовутъ сельскій сходъ, войскомъ — Революціонную Повстанческую Армію, а Батько Махно по старой памяти именуется не президентомъ и не вождемъ, а всего лишь §Yсовѣтчикомъ вольнаго народа§!.\n\nСосѣди сговариваются. Москва точитъ зубы на хлѣбъ и уголь, Варшава — на переправы, Берлинъ считаетъ наши версты по своей картѣ. Черная гвардія сѣдлаетъ коней: §Yземля — крестьянамъ, фабрики — рабочимъ, а воля — никому не отдается§!."
 GLP_MOTTO_1:0 "Анархія — мать порядка"
 GLP_MOTTO_2:0 "Свобода или смерть!"
 GLP_MOTTO_3:0 "Земля — крестьянамъ, фабрики — рабочимъ"
