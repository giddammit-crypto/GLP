l_english:
 glp_spain2.1.t:0 "§WFirst Contact with the Durruti Column§!"
 glp_spain2.1.d:0 "§WEnvoys from Buenaventura Durruti have arrived in Gulyaypole, bringing news of the CNT-FAI's struggle in Spain. They request experienced military advisors from our Black Guard to help organize their militia columns.§!"
 glp_spain2.1.a:0 "§WSend our best commanders to Aragon!§!"
 glp_spain2.1.b:0 "§WWe can only offer our symbolic solidarity.§!"
 glp_spain2.2.t:0 "§WBuenaventura Durruti: The Lion of Aragon§!"
 glp_spain2.2.d:0 "§WDurruti has proven to be a charismatic and unyielding leader. His philosophy closely aligns with our own Makhnovist principles. Closer ties with his column could form the basis of a true §WBlack International§!.§!"
 glp_spain2.2.a:0 "§WEmbrace Durruti's vision. We stand together!§!"
 glp_spain2.2.b:0 "§WWe shall maintain friendly but independent relations.§!"
 glp_spain2.3.t:0 "§WThe Death of Durruti§!"
 glp_spain2.3.d:0 "§WTragic news from Madrid: Buenaventura Durruti has fallen at the University City front. Rumors swirl about the circumstances of his death, with many suspecting NKVD involvement.§!"
 glp_spain2.3.a:0 "§WWe must investigate this assassination!§!"
 glp_spain2.3.b:0 "§WA heavy blow to the revolution. Mourn him.§!"
 glp_spain2.3.c:0 "§WSend arms to avenge him immediately!§!"
 glp_spain2.4.t:0 "§WThe Aragon Collective§!"
 glp_spain2.4.d:0 "§WReports from Aragon detail the successful collectivization of agriculture and industry by the CNT-FAI, demonstrating the viability of anarchist economics.§!"
 glp_spain2.4.a:0 "§WAn inspiring example for us all.§!"
 glp_spain2.5.t:0 "§WThe Black Sea Run: Success§!"
 glp_spain2.5.d:0 "§WOur covert weapons shipment has successfully breached the blockade and reached the Spanish anarchists.§!"
 glp_spain2.5.a:0 "§WExcellent news.§!"
 glp_spain2.6.t:0 "§WThe Black Sea Run: Intercepted§!"
 glp_spain2.6.d:0 "§WDisaster! Italian naval patrols have intercepted our disguised freighter carrying weapons to Spain.§!"
 glp_spain2.6.a:0 "§WThe fascists will pay for this.§!"
 glp_spain2.7.t:0 "§WBalkan Underground: Romanian Suspicion§!"
 glp_spain2.7.d:0 "§WRomanian authorities are growing suspicious of the sudden increase in 'agricultural machinery' transit through their territory.§!"
 glp_spain2.7.a:0 "§WBribe the border guards.§!"
 glp_spain2.7.b:0 "§WReroute through less watched paths.§!"
 glp_spain2.8.t:0 "§WFrench Syndicalist Solidarity§!"
 glp_spain2.8.d:0 "§WThe French CGT has agreed to turn a blind eye to our smuggling operations across the Pyrenees, showing true syndicalist solidarity.§!"
 glp_spain2.8.a:0 "§WVive la révolution!§!"
 glp_spain2.9.t:0 "§WThe Hunted Leader: Andrés Nin§!"
 glp_spain2.9.d:0 "§WAndrés Nin, leader of the POUM, is being hunted by Stalin's agents in Spain. We have a brief window to deploy our KRO operatives to extract him.§!"
 glp_spain2.9.a:0 "§WSend the KRO! We must save him.§!"
 glp_spain2.9.b:0 "§WIt is too risky. We cannot intervene.§!"
 glp_spain2.10.t:0 "§WNin Saved!§!"
 glp_spain2.10.d:0 "§WIn a daring operation, our agents have successfully smuggled Andrés Nin out of Spain. He has arrived in Gulyaypole as a political refugee.§!"
 glp_spain2.10.a:0 "§WWelcome, comrade Nin.§!"
 glp_spain2.11.t:0 "§WNin's Fate§!"
 glp_spain2.11.d:0 "§WWithout our intervention, Andrés Nin was arrested by Soviet agents and brutally murdered. His death is a grim warning to anti-Stalinist leftists everywhere.§!"
 glp_spain2.11.a:0 "§WA tragic loss for the revolution.§!"
 glp_spain2.12.t:0 "§WAnarchist Spain Consolidates§!"
 glp_spain2.12.d:0 "§WThe CNT-FAI has solidified its control over anarchist territories and proposed forming a united front.§!"
 glp_spain2.12.a:0 "§WWe shall join them!§!"
 glp_spain2.12.b:0 "§WWe will observe for now.§!"
 glp_spain2.13.t:0 "§WThe Soviet Rift§!"
 glp_spain2.13.d:0 "§WMoscow has openly denounced our support for the Spanish anarchists, labeling us as 'Makhnovist wreckers' and saboteurs of the Republican cause.§!"
 glp_spain2.13.a:0 "§WLet them scream.§!"
 glp_spain2.14.t:0 "§WEmma Goldman in Gulyaypole§!"
 glp_spain2.14.d:0 "§WThe renowned anarchist Emma Goldman has arrived in Gulyaypole, drawing international attention to our cause and the struggle in Spain.§!"
 glp_spain2.14.a:0 "§WA momentous occasion.§!"
 glp_spain2.15.t:0 "§WThe Black International Congress§!"
 glp_spain2.15.d:0 "§WDelegates from Gulyaypole, Anarchist Spain, and the French CGT have gathered to formalize the Black International.§!"
 glp_spain2.15.a:0 "§WA new era of global solidarity!§!"
 glp_spain2.16.t:0 "§WFranco at the Gates§!"
 glp_spain2.16.d:0 "§WThe Republican forces are crumbling. Fascist troops are closing in on the final strongholds.§!"
 glp_spain2.16.a:0 "§WSend everything we have to hold the line!§!"
 glp_spain2.16.b:0 "§WPrepare to receive refugees...§!"
 glp_spain2.17.t:0 "§WSpanish Refugees in Gulyaypole§!"
 glp_spain2.17.d:0 "§WWith the fall of Spain, thousands of CNT-FAI cadres and battle-hardened veterans have sought refuge in our territory.§!"
 glp_spain2.17.a:0 "§WTheir experience will strengthen our Black Guard.§!"
 glp_spain2.18.t:0 "§WThe Lessons of Iberia§!"
 glp_spain2.18.d:0 "§WThe Spanish Civil War has ended, leaving us with profound lessons about international solidarity, betrayal, and the cost of freedom.§!"
 glp_spain2.18.a:0 "§WWe will not forget.§!"
