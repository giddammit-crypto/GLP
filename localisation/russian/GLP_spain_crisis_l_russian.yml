l_russian:
 # ================================================================
 #  Модуль «Испанский пожаръ и Чёрный Интернационалъ»
 # ================================================================

 # --- Событие «Испанский пожаръ» (лето 1936) ---
 glp_spain.1.t:0 "§WИСПАНСКИЙ ПОЖАРЪ§!"
 glp_spain.1.d:0 "§WГУЛЯЙ-ПОЛЕ§!. Изъ Барселоны приходятъ вести: поднялась Каталония, поднялись синдикаты, и надъ Иберией полыхаетъ огонь, который, можетъ быть, и есть нашъ огонь. «Набатъ» звонитъ по всемъ точкамъ: братья зовутъ. Частини РПА уже шепчутъся о дальнемъ походе — черезъ моря и горы, къ огню.§!"
 glp_spain.1.a:0 "Братья зовутъ! Всё для Каталонии!"
 glp_spain.1.b:0 "Поможемъ тайно"
 glp_spain.1.c:0 "Наши рубежи важнее"

 # --- Майские дни въ Барселоне (май 1937) ---
 glp_barcelona.1.t:0 "§WМАЙСКИЕ ДНИ ВЪ БАРСЕЛОНЕ§!"
 glp_barcelona.1.d:0 "§WБАРСЕЛОНА§!. Фабричные митинги переросли въ перестрелки, перестрелки — въ уличныя битвы. На одной стороне — вольныя синдикаты CNT-FAI, на другой — комиссары НКВД и агенты PCE, и за кемъ победа — решится въ эти дни. Наши связные ждутъ сигналу.§!"
 glp_barcelona.1.a:0 "Чёрный Интернационалъ бьётъ первымъ"
 glp_barcelona.1.b:0 "Диючемо тихо"
 glp_barcelona.1.c:0 "Пусть решитъ фронтъ"
 glp_barcelona.1.w:0 "Наблюдаемъ изъ-пидъ тени"

 # --- Новини: исходъ майськихъ днивъ ---
 glp_barcelona.2.t:0 "§WВЛАСТЬ СИНДИКАТИВЪ§!"
 glp_barcelona.2.d:0 "§WБАРСЕЛОНА§!. Спецгрупа КРО обезвредила агентивъ НКВД до того, якъ вони успили систи до потяга. Фабрики Каталонии й Арагону проголошени вильними, милиция на вулицяхъ, и надъ Барселоною впервые вивисалося чорне знамя зъ двома жолудями.§!"
 glp_barcelona.2.a:0 "Свобода або смерть!"
 glp_barcelona.3.t:0 "§WСИЛЬНИШЕЕ СЛИВО — ПИЛКОВИЙ КОМИССАРЪ§!"
 glp_barcelona.3.d:0 "§WБАРСЕЛОНА§!. Наши люди вивели агентуру зъ миста ранише термину, але видкритого ходу не було: РГТ вцилила, CNT-FAI дисталась лише передыху. Зв'язкови доносять: справа не скинчилась, але викно звужуеться.§!"
 glp_barcelona.3.a:0 "Справа не скинчилась"
 glp_barcelona.4.t:0 "§WПОРЯДОКЪ ЧУЖОЮ РУКОЮ§!"
 glp_barcelona.4.d:0 "§WМОСКВА§!. Безъ нашои руки Барселона сдана: майские дни придушени, вильни милиции розигнани, а на вулицяхъ — комисари. Зв'язки зъ Гуляйполемъ обриваються: «махновськи програми» згорнути, и у вильний преси про нихъ бильше не пишуть.§!"
 glp_barcelona.4.a:0 "Такъ вийшло"
 glp_barcelona.5.t:0 "§WБАРСЕЛОНА УСПОКОИЛАСЯ§!"
 glp_barcelona.5.d:0 "§WБАРСЕЛОНА§!. Перестрилки стихли ранише, нижъ хтось встигъ бити в набат. Фронтъ лишився фронтомъ, а Барселона — мистомъ, де знову торгують на ринку. Але вси знають: питання про те, чиий влади вильнише, видкладене не назавжди.§!"
 glp_barcelona.5.a:0 "Чикаемо"

 # --- Чорноморсько-Иберийський пактъ ---
 glp_bi.1.t:0 "§WЧОРНОМОРСЬКО-ИБЕРИЙСЬКИЙ ПАКТЪ§!"
 glp_bi.1.d:0 "§WГУЛЯЙ-ПОЛЕ§!. На нейтральний води Чорного моря пидписано пактъ: Вильна Територия та вильни синдикати Иберии поеднують зусилля. «Чорний Интернационал» проголошено: вугилля Донбасу та хлиб степу — за каталонський вольфрам и синдикалистськи майстерни. Видъ Гуляйполя до Барселони — одна вильна артерия.§!"
 glp_bi.1.a:0 "Вольному воля!"

 # --- Назва фракции ---
 GLP_black_international_faction:0 "Чорний Интернационал"

 # --- Категория та ришенне «Испанський маршрутъ» ---
 GLP_spain_smuggling_routes:0 "Испанський маршрутъ"
 GLP_spain_black_sea_run:0 "Чорноморський проривъ"
 GLP_spain_black_sea_run_desc:0 "Конвой з 1500 гвинтивок иде через Босфор. Шансъ прориву — 65%. При перехопленни Regia Marina конвой втрачено, а Рим надсилае ноту протесту."
 GLP_spain_balkan_underground_traffic:0 "Балканський пидпильний трафикъ"
 GLP_spain_balkan_underground_traffic_desc:0 "Прихована доставка невеликими партиями поиздами через Румунию та Югославию. Шансъ — 85%."
 GLP_spain_french_syndicate_smuggling:0 "Французька синдикалистська контрабанда"
 GLP_spain_french_syndicate_smuggling_desc:0 "Вантаж веде через Пиренейи по власних линиях синдикалисти з Франции. Шансъ — 95%, плюс тепли стосунки з ливими у Франции."
 GLP_spain_send_kro_group:0 "Надсилання специальнои групи КРО"
 GLP_spain_send_kro_group_desc:0 "Група Льва Задова йде до Барселони: виведення з ладу агентив НКВД та PCE до «травневих днив». Без цього кроку анархистам не встояти."
 GLP_spain_brigade_homecoming:0 "Повернення бригади"
 GLP_spain_brigade_homecoming_desc:0 "Добровольци бригади РПАУ повертаються з Иберийського фронту. Белаш и Каретник отримують рису «Испанський закалю»."
 GLP_spain_black_international_pact:0 "Чорноморсько-Иберийський пактъ"
 GLP_spain_black_international_pact_desc:0 "Створення фракции «Чорний Интернационал» з Испаниею та взаемни економични духи. Доступно писля успишних «травневих днив» з 1938 року."

 # --- Духи ---
 GLP_idea_spanish_brigade:0 "Добровольча бригада РПАУ"
 GLP_idea_spanish_brigade_desc:0 "Частини РПАУ пишли на Иберийський фронт: добровольци йдуть охочише, а досвид вуличних боив лишаеться у полках."
 GLP_idea_nabat_disloyal:0 "«Набат» замовк"
 GLP_idea_nabat_disloyal_desc:0 "Мережа зв'язковикив «Набат» розчарована видмовою: чутки заминюють свидчення, а свидчення — чутки. На 365 днив."
 GLP_idea_catalan_wolfram_syndicate_workshops:0 "Каталонський вольфрам и синдикалистськи майстерни"
 GLP_idea_catalan_wolfram_syndicate_workshops_desc:0 "Вольфрам Пиренейив и майстерни Барселони йдуть на озброення: заводи озброень працюють швидше, и дослидження йдуть смиливише. (У 1.19 национальний дух не видае ресурси — зараховано бонусами виробництва.)"
 GLP_idea_ukrainian_coal_and_grain:0 "Украинське вугилля и хлиб"
 GLP_idea_ukrainian_coal_and_grain_desc:0 "Вугилля Донбасу и хлиб степу йдуть до Иберии: заводи будуються швидше, але на внутришний ринок лишаеться менше. (У 1.19 национальний дух не видае ресурси — зараховано бонусами виробництва.)"

 # --- Риси командирив ---
 GLP_spanish_tempering:0 "Испанський закалю"
 GLP_spanish_tempering_desc:0 "Повернувся з Иберийського фронту: вуличний бий, киннота через гирськи проходи. Организация та розвидка — як у травневих днив."

 # --- Модификатори думок ---
 GLP_italian_protest_note:0 "Нота протесту (перехоплення конвою)"
 GLP_french_syndicalist_warmth:0 "Французьки синдикалисти ведуть наш вантаж"
 GLP_spanish_syndicate_alliance:0 "Вильна Испания синдикалив"
 GLP_spanish_soviet_cold:0 "Прорадянська Барселона"
 GLP_soviet_anarchy_resentment:0 "Незадоволення анархистським втручанством"
