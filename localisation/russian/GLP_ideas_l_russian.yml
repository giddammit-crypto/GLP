 GLP_idea_white_emigre_officers:0 "§WОфицерский корпус эмигрантов§!"
 GLP_idea_white_emigre_officers_desc:0 "§WБелые кадры поднимают удар конницы и пехоты, но каждый день съедают политическую власть и злят анархистов.§!"

 GLP_idea_moscow_grain_tribute:0 "§WХлебная дань Москве§!"
 GLP_idea_moscow_grain_tribute_desc:0 "§WКоммуны отгружают зерно в обмен на отсрочку войны. Тыл голодает, советы ропщут.§!"
 GLP_idea_partisan_camps_timed:0 "§WЛагеря в плавнях§!"
 GLP_idea_partisan_camps_timed_desc:0 "§WВременные базы в днепровских камышах прикрывают тыл и кормят разведку.§!"

 GLP_idea_makhno_illness:0 "§WБолезнь Батьки§!"
 GLP_idea_makhno_illness_desc:0 "§WТуберкулёз валит Махно. Советы спорят, штаб теряет нить.§!"
 GLP_idea_occupied_kiev_soviet:0 "§WКиевский вольный совет§!"
 GLP_idea_occupied_kiev_soviet_desc:0 "§WВ занятом Киеве собирают совет — повиновение растёт ценой хлеба.§!"

 GLP_idea_recognized_border:0 "§WПризнанная граница§!"
 GLP_idea_recognized_border_desc:0 "§WХоть одна держава поручилась за Вольную территорию. Окружение ослабло, но степь всё ещё чужая для бирж.§!"
 GLP_idea_isolated_resistance:0 "§WИзоляционное сопротивление§!"
 GLP_idea_isolated_resistance_desc:0 "§WПакт отвергнут — и держимся сами. Гарнизоны копаются глубже, деревни стоят за повстанцами, но товар дорожает, а политическая сила тает: чужих друзей у нас больше нет.§!"
# ── Новые идеи: Испанский сценарий ──────────────────────────────────────
 GLP_voice_of_aragon:0 "§WГолос Арагона§!"
 GLP_voice_of_aragon_desc:0 "§WАндрес Нин — живой символ того, что можно победить НКВД. Его присутствие в Гуляйполе даёт анархистскому движению политический и теоретический импульс.§!"
 GLP_international_support:0 "§WМеждународная солидарность§!"
 GLP_international_support_desc:0 "§WВизит Эммы Гольдман привлёк взгляды всего мира. Добровольцы едут, пресса пишет, а Вольная Территория впервые становится символом живой анархии.§!"
 GLP_black_international_member:0 "§WЧлен Чёрного Интернационала§!"
 GLP_black_international_member_desc:0 "§WГуляйполе, синдикалистская Испания и французская ВКТ официально объединились. Чёрный Интернационал — реальная сила, а не декларация.§!"
 GLP_spanish_veterans:0 "§WИспанские ветераны§!"
 GLP_spanish_veterans_desc:0 "§WКадры НКТ-ФАИ прошли уличные бои Барселоны, оборону Мадрида и горные переходы Арагона. Их опыт — в ротах Черной гвардии.§!"
 GLP_aragon_collective_model:0 "§WАрагонская коллективная модель§!"
 GLP_aragon_collective_model_desc:0 "§WДоклады из Арагона подтверждают: анархо-коллективизм работает. Таврийские коммуны перенимают методы: самоуправление, ротация, взаимопомощь.§!"
 GLP_equal_soviet_partnership:0 "§WРавноправный Советский Пакт§!"
 GLP_equal_soviet_partnership_desc:0 "§WХарьковский пакт II заключён на равных условиях без политотделов и чекистов. Красная Армия и Повстанческая Армия координируют штабы, сохраняя полную внутреннюю автономию.§!"
 GLP_soviet_heavy_industry_support:0 "§WСоветская индустриальная программа§!"
 GLP_soviet_heavy_industry_support_desc:0 "§WСтанки из Харькова и Ленинграда, поставки угля и чугуна позволили развернуть мощную оборонную промышленность в Гуляйполе.§!"
 GLP_krupp_rearmament:0 "§WПеревооружение заводов Круппа§!"
 GLP_krupp_rearmament_desc:0 "§WТяжелые немецкие противотанковые орудия и бронеавтомобили поступили на вооружение дивизий Черной Гвардии, значительно усилив огневую мощь.§!"
 GLP_german_anarchist_cadres:0 "§WНемецкие анархо-синдикалисты (FAUD)§!"
 GLP_german_anarchist_cadres_desc:0 "§WСпасённые активисты профсоюза FAUD и антифашистского подполья Берлина передают опыт подпольной борьбы и инженерные навыки Вольной Территории.§!"
 GLP_black_sea_admiralty:0 "§WЧерноморское Синдикальное Адмиралтейство§!"
 GLP_black_sea_admiralty_desc:0 "§WБританская военно-морская миссия и поставки конвоев укрепили черноморские коммуникации, сделав порты Одессы и Бердянска неприступными с моря.§!"
 GLP_british_trade_union_solidarity:0 "§WСолидарность британских тред-юнионов§!"
 GLP_british_trade_union_solidarity_desc:0 "§WСоюз с рабочими профсоюзами Великобритании обеспечивает постоянный приток солидарной помощи и политическое прикрытие на Западе.§!"
