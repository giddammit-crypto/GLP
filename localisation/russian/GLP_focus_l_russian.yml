 # Спринт 2 (фаза B): дипломатические решения
 GLP_receive_lend_lease:0 "Принять помощь по ленд-лизу"
 GLP_receive_lend_lease_desc:0 "Партнёр по пакту присылает скромный конвой стрелкового вооружения и снаряжения раз в год. Бесплатно для казны — но в долгу перед ним остаёмся."
 GLP_white_volunteer_wave:0 "Волна белых добровольцев"
 GLP_white_volunteer_wave_desc:0 "Бывшие офицеры и бойцы Белой армии переправляются через границу Вольной территории сражаться за землю своей молодости. До трёх волн, каждая ценой внутренней стабильности."
