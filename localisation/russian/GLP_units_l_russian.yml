 # --- Классические поезда (Ванильная ветка) ---
 basic_train:0 "Гражданский поезд"
 basic_train_desc:0 "Этот паровоз, реквизированный армией с регулярных гражданских грузовых перевозок, хорошо подходит для перемещения большого количества припасов на большие расстояния."
 wartime_train:0 "Военный упрощенный поезд"
 wartime_train_desc:0 "Упрощенный проект, в котором ради удешевления производства опущены многие детали, присущие обычным товарным поездам."
 armored_train:0 "Бронепоезд"
 armored_train_desc:0 "Паровоз укрыт тяжелой броней, защищающей от вражеских атак. По грузоподъемности он равен другим поездам, но его выпуск стоит дороже."
 train_equipment_1:0 "Гражданский поезд"
 train_equipment_1_desc:0 "Гражданский грузовой поезд, реквизированный для армейских перевозок."
 train_equipment_2:0 "Военный упрощенный поезд"
 train_equipment_2_desc:0 "Упрощенный военный поезд военного времени."
 train_equipment_3:0 "Бронепоезд"
 train_equipment_3_desc:0 "Стандартный армейский бронепоезд."
