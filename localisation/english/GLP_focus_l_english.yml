 GLP_bastion_of_free_nations:0 "Bastion of Free Nations"
 GLP_bastion_of_free_nations_desc:0 "Gulyaypole as a beacon of liberty."
 GLP_free_will:0 "To Each Their Own Freedom"
 GLP_free_will_desc:0 "Gulyaypole bows to no banner. The fame of Batko Makhno thunders across Europe: warring nations send volunteers to the black flag, while the RIA strengthens the will of the working people."
 GLP_old_enemies_unite:0 "Old Enemies"
 GLP_old_enemies_unite_desc:0 "A call to former foes across Europe — from White emigres to deserters of every army — to unite against the common enemy. Regiments of volunteers arrive in Gulyaypole to aid Nestor Makhno."
 GLP_international_brigades:0 "International Brigades"
 GLP_international_brigades_desc:0 "Anarchists, socialists and anti-fascists the world over form international brigades. Gulyaypole receives weapons, men and the right to host volunteer units from any country at war."
 GLP_black_cross_aid:0 "Black Cross Aid"
 GLP_black_cross_aid_desc:0 "The Anarchist Black Cross deploys a supply network: free artisans and foreign comrades arm new factories and arsenals."
 GLP_makhno_myth:0 "The Makhno Myth"
 GLP_makhno_myth_desc:0 "The Batko's name becomes a legend across Europe. RIA fighters battle with faith in their cause, and enemies tremble at the very sight of the black banner."

