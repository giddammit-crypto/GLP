l_russian:
 # ── Ветка СССР ─────────────────────────────────────────────────────────────
 glp_powers.1.t:0 "Телеграмма из Кремля: Харьковский пакт II"
 glp_powers.1.d:0 "В штаб Революционной Повстанческой Армии в Гуляйполе прибыла зашифрованная депеша из Москвы. Политбюро ЦК ВКП(б) во главе со Сталиным, осознавая надвигающуюся угрозу со стороны нацистского Рейха, предлагает заключить 'Харьковский пакт II' — договор о дружбе, военной взаимопомощи и совместной координации обороны.\n\nОднако Москва выставляет условия: допуск советских военных советников и комиссаров в махновские штабы, а также совместный контроль над железными дорогами. Военно-революционный совет замер в ожидании решения Батьки."
 glp_powers.1.a:0 "Принять условия Москвы: промышленность важнее споров о политруках"
 glp_powers.1.b:0 "Степное условие: только равноправный военный союз без чекистов и комиссаров!"
 glp_powers.1.c:0 "Тайная игра КРО: согласиться на словах, но внедрить людей Задова в агентуру ГРУ"

 glp_powers.2.t:0 "Танковые эшелоны из Харькова"
 glp_powers.2.d:0 "На станцию Гуляйполе под покровом ночи прибыли первые тяжёлые эшелоны с Харьковского паровозостроительного завода №183. Десятки быстроходных танков БТ-7, артиллерийские тягачи 'Коминтерн' и тысячи ящиков с трёхлинейками и патронами разгружаются силами Черной Гвардии.\n\nКомандир бронетанковых сил Виктор Белаш предлагает два плана: создать отдельную ударную механизированную бригаду прорыва или равномерно усилить мобильные тачаночные полки."
 glp_powers.2.a:0 "Сформировать отдельную механизированную бригаду «Батько Махно»"
 glp_powers.2.b:0 "Распределить броневики и пушки среди тачаночных дивизионов"

 glp_powers.3.t:0 "Инцидент на Красно-Чёрных манёврах"
 glp_powers.3.d:0 "В степях между Синельниково и Гуляйполем начались первые в истории совместные манёвры РККА и РПА. Командарм Жуков и Семён Каретник наблюдают за встречным танковым боем. Когда повстанцы подняли чёрные флаги с черепом рядом с красными знамёнами, советские политруки выразили протест, но выучка и дерзость махновских конных налётов заставили замолчать даже строгих московских инспекторов."
 glp_powers.3.a:0 "Утвердить единую тактику глубокого маневренного прорыва"
 glp_powers.3.b:0 "Сохранить автономную партизанскую специфику Повстанческой Армии"

 # ── Ветка Германии ─────────────────────────────────────────────────────────
 glp_powers.10.t:0 "Эмиссары из Берлина: Предложение Абвера"
 glp_powers.10.d:0 "Через нейтральных торговых атташе в Стамбуле в Гуляйполе вышли представители германского генералитета и адмирала Канариса. Берлин, заинтересованный в криворожской руде и угле Донбасса, предлагает прагматический договор: поставки тяжелых противотанковых орудий Pak 36, станков и дизелей завода Круппа в обмен на режим наибольшего благоприятствования.\n\nДля многих бойцов РПА сделка с фашистами — святотатство, но командиры КРО напоминают: 'Оружие врага должно послужить его же гибели, когда придёт время'."
 glp_powers.10.a:0 "Холодный прагматизм: забирать всё немецкое оружие и готовиться к схватке"
 glp_powers.10.b:0 "Синдикальный демарш: закупать оборудование только через нейтралов в Швейцарии"
 glp_powers.10.c:0 "Спецоперация «Чёрный Клин»: использовать связи для эвакуации подполья FAUD"

 glp_powers.11.t:0 "Эшелоны Круппа на станции Пологи"
 glp_powers.11.d:0 "Первые составы с заводов Круппа прибыли на узловую станцию Пологи. Ящики с орудийными стволами и двигателями вызвали волнения среди рабочих железнодорожного депо. Рабочие заявили, что не пропустят составы с немецкими штампами, пока с них не будут сбиты все нацистские орлы."
 glp_powers.11.a:0 "Перебить все клейма на Чёрный Череп и направить орудия на фронт!"
 glp_powers.11.b:0 "Направить немецкие образцы инженерам в мастерские для копирования"

 glp_powers.12.t:0 "Чёрный крест степей"
 glp_powers.12.d:0 "Разведка КРО докладывает: Берлин не считает договор долгосрочным и разрабатывает планы агрессии на восток. Батько Махно и Военно-революционный совет отдают приказ о скрытой мобилизации: использовать передышку для создания непробиваемой эшелонированной обороны в степи."
 glp_powers.12.a:0 "Утвердить секретный мобилизационный план «Степной гром»"
 glp_powers.12.b:0 "Создавать скрытые партизанские арсеналы в каждом хуторе и балке"

 # ── Ветка Великобритании ───────────────────────────────────────────────────
 glp_powers.20.t:0 "Атташе Форин-Офиса в Гуляйполе"
 glp_powers.20.d:0 "В Гуляйполе прибыла неофициальная дипломатическая миссия из Лондона. Британское адмиралтейство видит в Черноморском регионе ключевой фланг сдерживания континентальных тираний. Британцы предлагают включить порты Одессы и Бердянска в британскую систему морских конвоев, а также передать лицензии на скорострельные пулемёты Виккерс и морские радиолокаторы."
 glp_powers.20.a:0 "Заключить Черноморско-Британский морской пакт"
 glp_powers.20.b:0 "Союз не с империей, а с рабочими: прямой пакт с тред-юнионами Ливерпуля!"
 glp_powers.20.c:0 "Технологический шпионаж: матросские комитеты перенимают чертежи радаров"

 glp_powers.21.t:0 "Караван из Ливерпуля"
 glp_powers.21.d:0 "Британский морской караван под прикрытием крейсеров Королевского флота прошёл Босфор и ошвартовался в Одессе. Сотни крупнокалиберных пулемётов Vickers, зенитные автоматы Pom-Pom и ящики с медикаментами доставлены в распоряжение Повстанческой Армии."
 glp_powers.21.a:0 "Оснастить моторизованные тачанки скорострельными Виккерсами!"
 glp_powers.21.b:0 "Развернуть зенитные орудия на береговых укреплениях Одессы и Бердянска"

 # Дополнительные категории решений и внешнеполитических направлений
 GLP_foreign_aid:0 "Иностранная помощь и закупки вооружения"
 GLP_foreign_aid_desc:0 "Взаимодействие с внешним миром для закупки дефицитного сырья, станков и военных технологий."
 GLP_pact_with_sov:0 "Отношения с Москвой"
 GLP_pact_with_sov_desc:0 "Дипломатический паритет, торговля и временные соглашения с СССР."
 GLP_pact_with_ger:0 "Тайные контакты с Берлином"
 GLP_pact_with_ger_desc:0 "Прагматичные переговоры для игры на межимпериалистических противоречиях."
 GLP_pact_with_eng:0 "Диалог с западными демократиями"
 GLP_pact_with_eng_desc:0 "Попытки заручиться признанием и поддержкой Лондона и Парижа."
 GLP_allied_white_emigres:0 "Интеграция белой эмиграции"
 GLP_allied_white_emigres_desc:0 "Привлечение опытных военных специалистов и офицеров бывшей Белой армии под чёрные знамёна."
