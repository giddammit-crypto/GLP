 neutrality:0 "Анархизм"
 neutrality_noun:0 "Анархизм"
 neutrality_desc:0 "Анархо-коммунизм — общество без государства, помещиков и господ, организованное на основе добровольной федерации вольных коммун, фабрично-заводских комитетов и советов трудящихся."
 anarchism:0 "Анархизм"
 anarchism_desc:0 "Анархо-коммунизм отвергает государственную власть, капиталистическую эксплуатацию и партийную диктатуру, организуя общество на основе добровольной федерации вольных советов, крестьянских коммун и рабочих синдикатов."
