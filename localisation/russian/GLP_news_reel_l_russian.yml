l_russian:
 # ================================================================
 # 10 УНИКАЛЬНЫХ НОВОСНЫХ СОБЫТИЙ С ИЗОБРАЖЕНИЯМИ
 # ================================================================

 # 1. Бронепоезд «Свобода или Смерть»
 glp_press.1.t:0 "БРОНЕПОЕЗД «СВОБОДА ИЛИ СМЕРТЬ» СОШЁЛ С ВЕРФЕЙ"
 glp_press.1.d:0 "§YЕКАТЕРИНОСЛАВ.§! Из ворот железнодорожных мастерских вышел грозный бронепоезд «Свобода или Смерть» — боевая крепость на рельсах, оснащённая тяжёлыми орудиями и пулемётными башнями. Бронированный состав стал символом несокрушимой военной мощи РПА и грозой всех, кто посмеет угрожать Вольной Территории. Батько Махно лично осмотрел боевую машину и отдал приказ о немедленном развёртывании на южном направлении."
 glp_press.1.a:0 "Свобода или Смерть! Бронепоезд — на фронт!"
 glp_press.1.b:0 "Это угроза нашему наступлению..."
 glp_press.1.c:0 "Интересная конструкция, надо изучить."

 # 2. ДнепроГЭС: Электрификация степи
 glp_press.2.t:0 "ДНЕПРОГЭС: СТЕПЬ ОЗАРЕНА ЭЛЕКТРИЧЕСТВОМ"
 glp_press.2.d:0 "§YЗАПОРОЖЬЕ.§! Грандиозная плотина Днепровской гидроэлектростанции введена в эксплуатацию силами вольных инженерных коммун. Тысячи километров линий электропередач протянулись по степям, неся свет и энергию в сёла, мастерские и заводы. Электрификация — локомотив свободы, и теперь Вольная Территория обладает мощнейшей энергетической базой на всём юге."
 glp_press.2.a:0 "Электрификация — это власть свободного народа!"
 glp_press.2.b:0 "Мы должны были контролировать этот объект..."
 glp_press.2.c:0 "Впечатляющий инженерный проект."

 # 3. Кавалерийский рейд Щуся
 glp_press.3.t:0 "ЛИХОЙ РЕЙД ЩУСЯ: РАЗГРОМ БЕЛОГВАРДЕЙЦЕВ"
 glp_press.3.d:0 "§YСТЕПЬ ЮЖНОГО ФРОНТА.§! Легендарный командир конного отряда Феодосий Щусь совершил стремительный рейд по тылам противника, разгромив два белогвардейских эшелона и захватив склады с оружием и продовольствием. Конница Черной Гвардии, несущаяся по степи под чёрно-красными знамёнами, навела ужас на вражеские гарнизоны. Трофеи: сотни винтовок, десятки пулемётов и три исправных бронеавтомобиля."
 glp_press.3.a:0 "Слава лихому Щусю! Степь — наша!"
 glp_press.3.b:0 "Махновцы снова нанесли удар в тыл..."
 glp_press.3.c:0 "Ситуация на южном фронте обостряется."

 # 4. Съезд анархистов в Екатеринославе
 glp_press.4.t:0 "ВСЕУКРАИНСКИЙ СЪЕЗД АНАРХИСТОВ В ЕКАТЕРИНОСЛАВЕ"
 glp_press.4.d:0 "§YЕКАТЕРИНОСЛАВ.§! Делегаты анархистских групп, синдикалистских союзов и вольных коммун со всей Украины собрались на исторический съезд. Принята резолюция о создании Федерации Вольных Советов — общества без государства, капитала и начальников. Всеволод Волин выступил с пламенной речью, призвав трудящихся всего мира последовать примеру Гуляйполя."
 glp_press.4.a:0 "Да здравствует анархия — мать порядка!"
 glp_press.4.b:0 "Это прямая угроза советской власти..."
 glp_press.4.c:0 "Любопытное политическое явление."

 # 5. Чёрная Гвардия на марше
 glp_press.5.t:0 "ЧЁРНАЯ ГВАРДИЯ НА МАРШЕ: ВСЕОБЩАЯ МОБИЛИЗАЦИЯ"
 glp_press.5.d:0 "§YГУЛЯЙ-ПОЛЕ.§! РевВоенСовет объявил всеобщую мобилизацию Черной Гвардии. Десятки тысяч добровольцев — крестьян, рабочих, шахтёров — откликнулись на призыв Батьки Махно. Колонны вооружённых бойцов с чёрно-красными знамёнами движутся к линии фронта. Степь гудит от топота копыт и рёва моторов. Враг будет разбит!"
 glp_press.5.a:0 "Каждый свободный человек — солдат революции!"
 glp_press.5.b:0 "Махновцы мобилизуют всё население..."
 glp_press.5.c:0 "Наблюдаем за развитием ситуации."

 # 6. Вольные синдикаты Донбасса
 glp_press.6.t:0 "ДОНБАСС: ШАХТЫ И ЗАВОДЫ ПЕРЕДАНЫ СИНДИКАТАМ"
 glp_press.6.d:0 "§YДОНЕЦКИЙ БАССЕЙН.§! Все шахты, металлургические заводы и коксохимические предприятия Донбасса переданы под управление вольных рабочих синдикатов. Тысячи шахтёров и металлургов торжественно поклялись добывать уголь и выплавлять сталь для защиты свободы. Производственные показатели растут рекордными темпами — свободный труд эффективнее принуждения!"
 glp_press.6.a:0 "Донбасс — кузница свободы!"
 glp_press.6.b:0 "Они захватили наши промышленные ресурсы!"
 glp_press.6.c:0 "Интересный эксперимент в экономике."

 # 7. Операция контрразведки Задова
 glp_press.7.t:0 "КОНТРРАЗВЕДКА ЗАДОВА РАЗОБЛАЧИЛА ЗАГОВОР"
 glp_press.7.d:0 "§YГУЛЯЙ-ПОЛЕ.§! Агенты особой разведки РПА под руководством Лева Задова разоблачили масштабный заговор белогвардейских агентов и провокаторов ЧК, планировавших диверсии на военных складах и покушение на командование. Десятки арестованных, изъяты шифры, карты и списки агентуры. Контрразведка РПА вновь доказала свою высочайшую эффективность."
 glp_press.7.a:0 "Задов — щит революции! Враги будут наказаны."
 glp_press.7.b:0 "Изъятое оружие пойдёт на вооружение ополчения."

 # 8. Процветание крестьянских коммун
 glp_press.8.t:0 "ЗОЛОТОЙ ВЕК КРЕСТЬЯНСКИХ КОММУН ГУЛЯЙ-ПОЛЯ"
 glp_press.8.d:0 "§YВОЛЬНАЯ ТЕРРИТОРИЯ.§! Свободные крестьянские коммуны Вольной Территории собирают рекордный урожай. Общинные зернохранилища заполнены до отказа, новые тракторные бригады работают на полях, а сельские школы и больницы открываются в каждом селе. Без помещиков и чиновников крестьянский труд приносит невиданное изобилие. Гуляйполе доказывает: народ может жить без государства!"
 glp_press.8.a:0 "Земля — тем, кто её обрабатывает!"
 glp_press.8.b:0 "Инвестируем излишки в промышленность."

 # 9. Радиобашня «Голос Воли»
 glp_press.9.t:0 "РАДИОБАШНЯ «ГОЛОС ВОЛИ» НАЧИНАЕТ ВЕЩАНИЕ"
 glp_press.9.d:0 "§YГУЛЯЙ-ПОЛЕ.§! Мощная радиостанция «Голос Воли» вступила в строй, покрывая сигналом всю южную Украину, Крым, Донбасс и Кавказ. Каждый день в эфир выходят передачи на русском, украинском, идиш и немецком языках — призывы к свободе, новости фронта и революционная музыка. Голос свободы теперь невозможно заглушить!"
 glp_press.9.a:0 "Голос Воли — голос свободного народа!"
 glp_press.9.b:0 "Эта пропаганда угрожает нашей стабильности..."
 glp_press.9.c:0 "Интересная технология."

 # 10. Чёрный Интернационал: Мадрид
 glp_press.10.t:0 "ЧЁРНЫЙ ИНТЕРНАЦИОНАЛ: БРАТСТВО С CNT-FAI"
 glp_press.10.d:0 "§YМАДРИД — ГУЛЯЙ-ПОЛЕ.§! Делегация РПА подписала исторический пакт о взаимопомощи с испанскими анархистами CNT-FAI. Тысячи добровольцев и эшелоны с оружием отправлены на Пиренейский полуостров. Чёрный Интернационал становится реальной боевой силой — от степей Украины до берегов Эбро анархисты объединяются против фашизма и тирании!"
 glp_press.10.a:0 "Солидарность — наше оружие! Viva CNT-FAI!"
 glp_press.10.b:0 "Братья по борьбе пришли на помощь!"
 glp_press.10.c:0 "Международное анархистское движение набирает силу."

 # 11. Падение Гуляйполя
 glp_press.11.t:0 "ПАДЕНИЕ ГУЛЯЙПОЛЯ: КОНЕЦ ВОЛЬНОЙ ТЕРРИТОРИИ"
 glp_press.11.d:0 "§YГУЛЯЙ-ПОЛЕ.§! Последние очаги сопротивления Черной Гвардии сломлены. Столица повстанчества, семнадцать лет остававшаяся неприступным бастионом безвластия и вольного труда, пала под сокрушительным натиском неприятеля. Вольные советы разогнаны, фабрики и земля переходят под контроль оккупационных властей. Эпоха степной анархии подошла к трагическому концу."
 glp_press.11.a:0 "Анархистский мятеж окончательно подавлен!"
 glp_press.11.b:0 "Эра вольного эксперимента в степи завершилась..."
 glp_press.11.c:0 "Пламя свободы не угаснет в сердцах повстанцев!"
