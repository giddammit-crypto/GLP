 # Country Leader Traits
 batko_makhno:0 "Батько Махно"
 batko_makhno_desc:0 "Непререкаемый вождь повстанческого движения, объединивший вольных крестьян, рабочих и кавалеристов в несокрушимую армию свободы. Гений партизанской войны, внушающий ужас врагам и беззаветную преданность соратникам."

 # General / Field Marshal Traits (unit leader traits, /common/unit_leader/)
 GLP_tachanka_commander:0 "§WКомандир тачанок§!"
 GLP_tachanka_commander_desc:0 "§WМастер тактики пулемётных тачанок, превращающий степной простор в смертоносную ловушку для противника.§!"
 GLP_guerilla_master:0 "§WМастер партизанской войны§!"
 GLP_guerilla_master_desc:0 "§WЛегенда иррегулярной войны, превращающая каждое село и каждую балку в неприступную крепость.§!"
 GLP_steppe_raider:0 "§WСтепной рейдер§!"
 GLP_steppe_raider_desc:0 "§WКомандир глубоких конных рейдов: его колонны идут там, где штабные карты обозначают пустоту.§!"

 # Country Leader Traits (продолжение)
 GLP_inspirational_leader:0 "§WВдохновляющий вождь§!"
 GLP_inspirational_leader_desc:0 "§WБатько говорит с крестьянином на его языке — и село снимается с места целыми обозами, чтобы идти за чёрным знаменем.§!"
 GLP_panic:0 "§WПаника§!"
 GLP_panic_desc:0 "§WМолниеносные решения Махно наводят ужас на врага, но лихорадочные метания армии подтачивают порядок в тылу.§!"

 # Political Advisor Traits
 anarchist_organizer:0 "Организатор Вольных Коммун"
 anarchist_organizer_desc:0 "Талантливый администратор, способный наладить работу экономики без государственного принуждения через добровольную кооперацию."
 GLP_operational_planner:0 "§WНачальник штаба: оперативный планировщик§!"
 GLP_operational_planner_desc:0 "§WГлавный тактик и картограф махновского движения: его штабные разработки превращают крестьянские отряды в управляемую армию.§!"
 GLP_head_of_intelligence:0 "§WНачальник разведки: тихий трудяга§!"
 GLP_head_of_intelligence_desc:0 "§WРазведывательно-заградительный отдел работает без шума и огласки, зато знает о противнике больше, чем его собственный штаб.§!"
 counter_intelligence_expert:0 "Мастер контрразведки"
 counter_intelligence_expert_desc:0 "Легендарный разведчик и начальник особой разведки армии, чья агентурная сеть пронизывает тылы противника."
 free_soviets_minister:0 "Министр просвещения: Вольные Советы"
 free_soviets_minister_desc:0 "Вдохновенный пропагандист анархо-коммунизма, чьи пламенные речи укрепляют дух народа и ускоряют строительство свободного общества."
 GLP_soviet_military_mission:0 "§WСоветская военная миссия§!"
 GLP_german_military_mission:0 "§WГерманская военная миссия§!"
 GLP_british_naval_mission:0 "§WБританская военно-морская миссия§!"
 GLP_soviet_mission_advisor:0 "§WСоветская военная миссия§!"
 GLP_german_mission_advisor:0 "§WГерманская военная миссия§!"
 GLP_british_naval_advisor:0 "§WБританская военно-морская миссия§!"
 GLP_soviet_mission_doctrine:0 "§WГлубокий оперативно-боевой порядок§!"
 GLP_soviet_mission_doctrine_desc:0 "§WКрасные командиры делятся с РПА опытом глубоких операций: дешевле доктрины, выше планирование.§!"
 GLP_german_mission_drill:0 "§WПрусская выучка§!"
 GLP_german_mission_drill_desc:0 "§WИнструкторы Рейхсвера муштруют повстанческие полки: прорыв и наступательная мощь растут.§!"
 GLP_british_naval_drill:0 "§WКоролевская морская выучка§!"
 GLP_british_naval_drill_desc:0 "§WБританские офицеры ставят службу Черноморского флота: дешевле морская доктрина, выше координация.§!"
 GLP_bogdan_dybets:0 "§WБогдан Дыбец§!"
 GLP_bogdan_dybets_desc:0 "§WСтарый гуляй-польский командир ещё с времён первого совета. Оппонент Батьки по крестьянскому сходу, но в строю Повстанческой Армии — надёжный организатор пехоты.§!"
 GLP_aleksey_dybets:0 "§WАлексей Дыбец§!"
 GLP_aleksey_dybets_desc:0 "§WМолодой кавалерийский командир из многодетной дыбецкой семьи. Быстрый в набегах, стремительный в манёвре — ставку делает на молниеносные рейды по тылам.§!"
 GLP_feodosiy_kozhin:0 "§WФеодосий Кожин§!"
 GLP_feodosiy_kozhin_desc:0 "§WСтепной командир старой закалки, крестьянин-анархист. Суров к врагу и к подчинённым, мастер засад в балках и оврагах Причерноморья.§!"

 GLP_trofim_vdovychenko:0 "§WТрофим Вдовиченко§!"
 GLP_trofim_vdovychenko_desc:0 "§WКрестьянин-анархист из Новоспасовки, командир Азовской группы. За железную дисциплину и умение сводить разрозненные отряды в единую боевую силу его любили во всём Приазовье.§!"
 GLP_aleksey_marchenko:0 "§WАлексей Марченко§!"
 GLP_aleksey_marchenko_desc:0 "§WКомандир махновской конницы. Его конные колонны вырвались из крымского окружения через Перекоп и днём и ночью шли на соединение с Батькой — лучшая шашка вольной степи.§!"
 GLP_platon_petrenko:0 "§WПлатон Петренко§!"
 GLP_platon_petrenko_desc:0 "§WКомандир Крымского корпуса. Это его бойцы вброд перешли гнилой Сиваш и штурмом взяли перекопские укрепления, открыв путь в Крым.§!"
 GLP_vasily_kurylenko:0 "§WВасилий Куриленко§!"
 GLP_vasily_kurylenko_desc:0 "§WМолодой командир Новоспасовской группы, герой освобождения Мариуполя. Дерзкий до безрассудства: на его лихость равнялся весь полк.§!"
 GLP_petr_gavrilenko:0 "§WПётр Гавриленко§!"
 GLP_petr_gavrilenko_desc:0 "§WНачальник полевого штаба Крымской группы. Тихий, точный штабист, чьи карты и расчёты превращают дерзость повстанцев в один выверенный удар.§!"

 GLP_nikolai_skoblin:0 "§WНиколай Скоблин§!"
 GLP_nikolai_skoblin_desc:0 "§WБывший белый кавалерийский генерал, эмигрант. Прагматический союзник Батьки — и постоянный источник недоверия в штабе.§!"
 GLP_anton_turkul:0 "§WАнтон Туркул§!"
 GLP_anton_turkul_desc:0 "§WПехотный генерал Добровольческой армии, жёсткий и прямолинейный. Его бригады дерутся как ветераны Гражданской.§!"
 GLP_grigory_semyonov:0 "§WГригорий Семёнов§!"
 GLP_grigory_semyonov_desc:0 "§WКазачий атаман-эмигрант. Степной командир старой имперской школы, привыкший решать дела шашкой и налётом.§!"
 GLP_white_emigre:0 "§WБелый эмигрант§!"
 GLP_white_emigre_desc:0 "§WОфицер старой армии: выше выучка, выше расход снабжения и политическая цена союза.§!"
 GLP_white_emigre_favored:0 "§WДоверие штаба§!"
 GLP_white_emigre_favored_desc:0 "§WБатько поддержал белых командиров — их власть в поле выросла, коммуны ропщут.§!"
 GLP_white_emigre_sidelined:0 "§WПод надзором махновцев§!"
 GLP_white_emigre_sidelined_desc:0 "§WЭмигрантам урезали полномочия. Штаб спокоен, удар ослаб.§!"

 # ---------------- Олег Потёмкин (Атаман, корпусный командир РПА) ----------------
 GLP_oleg_potemkin:0 "§WОлег Потёмкин§!"
 GLP_potemkin_infantry_master:0 "§WМастер пехотных боёв§!"
 GLP_potemkin_infantry_master_desc:0 "§WСамый закалённый пехотинец Вольной Территории: его роты бьют в лоб, держатся на смертельной земле и выходят из окружения через центр противника.§!"
 GLP_potemkin_black_fidele:0 "§WФидель Атамана§!"
 GLP_potemkin_black_fidele_desc:0 "§WГлавный приверженец Батьки Махно: его преданность держит часть в строю там, где у других уже не хватает сил.§!"
# ---------------- Иван Лепетченко (полевой командир РПА) ----------------
 GLP_ivan_lepetchenko:0 "§WИван Лепетченко§!"
